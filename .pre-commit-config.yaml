repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-d, "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, indentation: disable}}"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.9.0
    hooks:
      - id: shellcheck
        args: ["--severity=error"]

  - repo: https://github.com/ansible/ansible-lint
    rev: v6.22.1
    hooks:
      - id: ansible-lint
        # This prevents pre-commit from passing individual filenames to ansible-lint
        # which evaluates the entire ansible/ directory instead as a project.
        pass_filenames: false
        always_run: true
        args: ["ansible/"]
