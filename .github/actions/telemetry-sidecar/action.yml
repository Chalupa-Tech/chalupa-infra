name: 'Telemetry sidecar (Alloy)'
description: >-
  Launches Grafana Alloy as an OTLP→VictoriaMetrics forwarder inside a
  CI job. Emitters (Gemini CLI, Claude Code, OTel-instrumented build
  steps) export to http://127.0.0.1:4318. Caller owns teardown — see
  docs/runbooks/ci-telemetry-onboarding.md. Degrades gracefully when
  TELEMETRY_TOKEN is unset.

inputs:
  service-name:
    description: 'OTel service.name resource attribute (e.g. gemini-review, build-push).'
    required: true
  service-version:
    description: 'Optional service.version resource attribute.'
    required: false
    default: ''
  extra-resource-attrs:
    description: 'Additional comma-separated key=value OTel resource attributes.'
    required: false
    default: ''
  alloy-config-path:
    description: 'Path to Alloy river config, relative to the workspace.'
    required: false
    default: '.github/alloy/default.alloy'
  alloy-version:
    description: 'Grafana Alloy image tag.'
    required: false
    default: 'v1.15.1'
  container-name:
    description: 'Name of the Alloy docker container (so teardown can reference it).'
    required: false
    default: 'alloy'
  tailscale-tags:
    description: 'Tags to use if this action needs to join Tailscale.'
    required: false
    default: 'tag:ci'

outputs:
  started:
    description: 'true iff Alloy is running and ready to receive OTLP.'
    value: ${{ steps.launch.outputs.started }}

runs:
  using: composite
  steps:
    - name: 'Check telemetry prerequisites'
      id: 'prereq'
      shell: bash
      env:
        TELEMETRY_TOKEN: ${{ env.TELEMETRY_TOKEN }}
        VM_WRITE_URL: ${{ env.VM_WRITE_URL }}
      run: |
        set -euo pipefail
        if [ -z "${TELEMETRY_TOKEN:-}" ]; then
          echo "::warning::TELEMETRY_TOKEN unset — skipping telemetry sidecar"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "${VM_WRITE_URL:-}" ]; then
          echo "::warning::VM_WRITE_URL unset — skipping telemetry sidecar"
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "proceed=true" >> "$GITHUB_OUTPUT"

    - name: 'Probe Tailscale'
      id: 'ts-probe'
      if: steps.prereq.outputs.proceed == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v tailscale >/dev/null 2>&1 && tailscale status --json >/dev/null 2>&1; then
          echo "Tailscale already up — skipping nested join"
          echo "up=true" >> "$GITHUB_OUTPUT"
        else
          echo "up=false" >> "$GITHUB_OUTPUT"
        fi

    - name: 'Join Tailscale'
      if: steps.prereq.outputs.proceed == 'true' && steps.ts-probe.outputs.up != 'true'
      uses: 'tailscale/github-action@v2' # ratchet:exclude
      with:
        oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ env.TS_OAUTH_CLIENT_SECRET }}
        tags: ${{ inputs.tailscale-tags }}

    - name: 'Launch Alloy'
      id: 'launch'
      if: steps.prereq.outputs.proceed == 'true'
      shell: bash
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        SERVICE_VER: ${{ inputs.service-version }}
        EXTRA_ATTRS: ${{ inputs.extra-resource-attrs }}
        CFG_PATH: ${{ inputs.alloy-config-path }}
        ALLOY_VER: ${{ inputs.alloy-version }}
        CONTAINER: ${{ inputs.container-name }}
        TELEMETRY_TOKEN: ${{ env.TELEMETRY_TOKEN }}
        VM_WRITE_URL: ${{ env.VM_WRITE_URL }}
      run: |
        set -euo pipefail

        # Assemble OTEL_RESOURCE_ATTRIBUTES. service.name + github.* are
        # always set; service.version and extras are optional. schema_url
        # pins the GenAI SemConv version so consumers can adapt if names
        # churn — GenAI SemConv is still "Development" as of 2026-04-19.
        ATTRS="service.name=${SERVICE_NAME}"
        ATTRS="${ATTRS},service.namespace=chalupa-ci"
        ATTRS="${ATTRS},otel.schema_url=https://opentelemetry.io/schemas/1.34.0"
        ATTRS="${ATTRS},github.run_id=${GITHUB_RUN_ID}"
        ATTRS="${ATTRS},github.repository=${GITHUB_REPOSITORY}"
        ATTRS="${ATTRS},github.workflow=${GITHUB_WORKFLOW}"
        ATTRS="${ATTRS},github.actor=${GITHUB_ACTOR}"
        if [ -n "${SERVICE_VER:-}" ]; then
          ATTRS="${ATTRS},service.version=${SERVICE_VER}"
        fi
        if [ -n "${EXTRA_ATTRS:-}" ]; then
          ATTRS="${ATTRS},${EXTRA_ATTRS}"
        fi

        docker run -d \
          --name "${CONTAINER}" \
          --network host \
          -v "${PWD}/${CFG_PATH}:/etc/alloy/config.alloy:ro" \
          -e VM_WRITE_URL \
          -e TELEMETRY_TOKEN \
          -e OTEL_RESOURCE_ATTRIBUTES="${ATTRS}" \
          "grafana/alloy:${ALLOY_VER}" \
          run \
            --server.http.listen-addr=127.0.0.1:12345 \
            --stability.level=public-preview \
            /etc/alloy/config.alloy

        # Alloy exposes /-/ready on its HTTP server once the config has
        # loaded + all components report healthy. 20s is ample on a
        # GitHub-hosted runner with a warm Docker cache.
        for i in {1..20}; do
          if curl -fsS http://127.0.0.1:12345/-/ready >/dev/null 2>&1; then
            echo "Alloy ready after ${i}s"
            echo "started=true" >> "$GITHUB_OUTPUT"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318" >> "$GITHUB_ENV"
            echo "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done
        echo "::warning::Alloy did not become ready in 20s — continuing without telemetry"
        docker logs "${CONTAINER}" 2>&1 | tail -40 || true
        docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true
        echo "started=false" >> "$GITHUB_OUTPUT"

    - name: 'Record sidecar outcome'
      if: steps.prereq.outputs.proceed == 'true'
      shell: bash
      env:
        STARTED: ${{ steps.launch.outputs.started }}
      run: |
        echo "SIDECAR_STARTED=${STARTED}" >> "$GITHUB_ENV"

    - name: 'Record sidecar skipped'
      if: steps.prereq.outputs.proceed != 'true'
      shell: bash
      run: |
        echo "SIDECAR_STARTED=false" >> "$GITHUB_ENV"
