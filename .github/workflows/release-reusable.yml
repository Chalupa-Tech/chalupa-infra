---
name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Container image name (e.g. go-schwab-auth)'
        required: true
        type: string
      values_path:
        description: 'Path to values.yaml in chalupa-infra (e.g. k8s/apps/schwab/go-schwab-auth/values.yaml)'
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_CLIENT_SECRET:
        required: true
      GITEA_REGISTRY_USER:
        required: true
      GITEA_REGISTRY_PASSWORD:
        required: true
      GH_PAT:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # One release evaluation per repo at a time, queued, never cancelled.
    # A push that lands while the promotion commit's run is tagging waits
    # for it, then sees the new tag and releases its own commits; two
    # Tier-2 runs cannot push the same ci/promote-* branch at once.
    # (GitHub keeps one pending run per group; a newer push replaces the
    # pending one, and the newer HEAD contains its commits.)
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      new_release: ${{ steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false' }}
      version: ${{ steps.detect_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so that the promotion PR's merge (Tier 2) triggers this
          # workflow again; events caused by GITHUB_TOKEN start no runs.
          # It does not bypass the org "Protect Main" ruleset: nothing in
          # this workflow pushes to main.
          token: ${{ secrets.GH_PAT }}

      - name: Auto-promote and detect version
        id: detect_version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Every exit that cuts no release says why in the job summary, and
          # warns when '## [Unreleased]' holds entries that are not shipping.
          # A green run that released nothing once hid a six-month gap.
          summary() { echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          unreleased_entries() {
            # Non-blank lines between '## [Unreleased]' and the next '## ['.
            awk '/^##[[:space:]]+\[Unreleased\]/{f=1;next} /^##[[:space:]]+\[/{f=0} f && NF' CHANGELOG.md | grep -c . || true
          }
          skip_release() {
            local reason="$1" level="${2:-notice}"
            local entries; entries=$(unreleased_entries)
            local since="${LAST_TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo none)}"
            local age=""
            if [[ "$since" != "none" ]]; then
              age=" ($(( ( $(date -u +%s) - $(git log -1 --format=%ct "$since") ) / 86400 )) days ago)"
            fi
            summary "### No release cut"
            summary ""
            summary "$reason"
            summary ""
            summary "- Last tag: \`$since\`$age"
            summary "- Lines under \`[Unreleased]\`: $entries"
            if [[ "$entries" -gt 0 && "$level" == "warning" ]]; then
              echo "::warning title=Unreleased changes not released::$reason $entries line(s) under [Unreleased] since $since$age. Title the PR feat:/fix: or cut a release with a 'release: vX.Y.Z' PR."
            else
              echo "::notice title=No release::$reason"
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # ---------------------------------------------------------------
          # Promotion commit. Tier 2 below promotes '[Unreleased]' through a
          # PR, because the org ruleset rejects pushes to main. When that PR
          # squash-merges, this workflow runs again with HEAD = the promotion
          # commit ('chore: promote Unreleased to vX.Y.Z (#N)', authored by
          # the PAT user, not the bot). Release the version it names. This is
          # also the loop guard: that HEAD never reaches the Tier-2 scan.
          # A rerun on an older promotion commit stops at 'Check if Tag
          # Exists'.
          # ---------------------------------------------------------------
          HEAD_SUBJECT=$(git log -1 --format='%s')
          RE_PROMOTE='^chore: promote Unreleased to v([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$'
          if [[ "$HEAD_SUBJECT" =~ $RE_PROMOTE ]]; then
            PROMOTED="${BASH_REMATCH[1]}"
            if ! grep -qE "^##[[:space:]]+\[${PROMOTED//./\\.}\]" CHANGELOG.md; then
              echo "::error::HEAD is '$HEAD_SUBJECT' but CHANGELOG.md has no '## [$PROMOTED]' section."
              exit 1
            fi
            echo "HEAD is the promotion commit for v$PROMOTED; releasing it."
            summary "Promotion commit for **v$PROMOTED**; releasing it."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$PROMOTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Tier detection. Read the first '## [<token>]' header.
          # ---------------------------------------------------------------
          FIRST_HEADER=$(grep -m1 -oE '^##[[:space:]]+\[[^]]+\]' CHANGELOG.md || true)
          if [[ -z "$FIRST_HEADER" ]]; then
            echo "::error::CHANGELOG.md has no '## [<version>]' or '## [Unreleased]' header."
            exit 1
          fi
          FIRST_TOKEN=$(echo "$FIRST_HEADER" | sed -E 's/^##[[:space:]]+\[(.+)\]$/\1/')
          echo "First changelog section: [$FIRST_TOKEN]"

          if [[ "$FIRST_TOKEN" != "Unreleased" ]]; then
            # Tier 1: explicit version. Use as-is.
            if [[ ! "$FIRST_TOKEN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::First section '[$FIRST_TOKEN]' is not 'Unreleased' or X.Y.Z."
              exit 1
            fi
            echo "Tier 1: explicit version $FIRST_TOKEN."
            summary "Tier 1: explicit version **$FIRST_TOKEN** from CHANGELOG.md."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$FIRST_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An empty '## [Unreleased]' kept above a version section that has no
          # tag yet is a hand-written release PR that left the header in place.
          # Treat the version section as Tier 1. A tagged version below it, or
          # entries under '[Unreleased]', keep the Tier-2 handling.
          NEXT_TOKEN=$(grep -oE '^##[[:space:]]+\[[^]]+\]' CHANGELOG.md | sed -n 2p | sed -E 's/^##[[:space:]]+\[(.+)\]$/\1/' || true)
          if [[ "$(unreleased_entries)" -eq 0 && "$NEXT_TOKEN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
             && ! git rev-parse -q --verify "refs/tags/v$NEXT_TOKEN" >/dev/null; then
            echo "Tier 1: '[Unreleased]' is empty above untagged version $NEXT_TOKEN."
            summary "Tier 1: explicit version **$NEXT_TOKEN** from CHANGELOG.md ('[Unreleased]' header was empty, so the next section was taken)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Tier 2: auto-promote. Derive bump from conventional-commit
          # prefixes on each commit since LAST_TAG.
          # ---------------------------------------------------------------
          echo "Tier 2: deriving version from conventional commits."
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            LAST_VERSION="0.0.0"
            RANGE="HEAD"
            echo "No prior tags. Scanning full history."
          else
            LAST_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
            echo "Last tag: $LAST_TAG → $LAST_VERSION. Range: $RANGE"
          fi

          COMMITS=$(git log --reverse --format='%H' $RANGE)
          if [[ -z "$COMMITS" ]]; then
            skip_release "No commits since ${LAST_TAG:-the start of history}." warning
          fi

          ALL_DEFERRED=true
          BUMP="none"   # none | patch | minor | major

          # Conventional-commits subject regex. Bodies are noisy (squash
          # merges embed pre-squash commit subjects), so type prefix is
          # subject-only. BREAKING CHANGE in body still wins.
          RE_BREAK='^[a-z]+(\([^)]+\))?!:[[:space:]]'
          RE_FEAT='^feat(\([^)]+\))?:[[:space:]]'
          RE_FIX='^fix(\([^)]+\))?:[[:space:]]'

          while IFS= read -r SHA; do
            SUBJECT=$(git log -1 --format='%s' "$SHA")
            BODY=$(git log -1 --format='%b' "$SHA")
            echo "  $SHA: $SUBJECT"

            # release-deferred label check. Best-effort: missing PR or
            # API error counts as 'not deferred' (fail-open so we don't
            # accidentally suppress a real release).
            LABELS=$(gh pr list --search "sha:$SHA" --state merged --json labels --jq '.[0].labels[].name' 2>/dev/null || true)
            if ! grep -qx 'release-deferred' <<< "$LABELS"; then
              ALL_DEFERRED=false
            fi

            if echo "$BODY" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            elif [[ "$SUBJECT" =~ $RE_BREAK ]]; then
              BUMP="major"
            elif [[ "$SUBJECT" =~ $RE_FEAT ]]; then
              [[ "$BUMP" != "major" ]] && BUMP="minor"
            elif [[ "$SUBJECT" =~ $RE_FIX ]]; then
              [[ "$BUMP" == "none" ]] && BUMP="patch"
            fi
          done <<< "$COMMITS"

          if [[ "$ALL_DEFERRED" == "true" ]]; then
            skip_release "All commits since ${LAST_TAG:-the start of history} are on release-deferred PRs."
          fi

          if [[ "$BUMP" == "none" ]]; then
            N_COMMITS=$(grep -c . <<< "$COMMITS")
            skip_release "None of the $N_COMMITS commit(s) since ${LAST_TAG:-the start of history} has a feat:/fix:/breaking subject." warning
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$LAST_VERSION"
          case "$BUMP" in
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN + 1)); PAT=0 ;;
            patch) PAT=$((PAT + 1)) ;;
          esac
          NEW_VERSION="${MAJ}.${MIN}.${PAT}"
          TODAY=$(date -u +%Y-%m-%d)
          echo "Bump: $BUMP → $NEW_VERSION (date $TODAY)"

          # A merge that lands after a promotion commit but before its run
          # has tagged it scans from the same LAST_TAG. Whatever bump it
          # computes (a feat after a promoted fix gives a different
          # version), do not promote again while a promoted version is
          # untagged; these commits ship with the next release.
          # Pending = a promotion commit since LAST_TAG whose tag does not
          # exist yet; the changelog alone is not evidence (a repo with
          # numbered sections but no tags would never release).
          PENDING=$(git log --format='%s' $RANGE | sed -nE 's/^chore: promote Unreleased to v([0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p' | head -1)
          if [[ -n "$PENDING" ]] && ! git rev-parse -q --verify "refs/tags/v$PENDING" >/dev/null; then
            skip_release "v$PENDING is promoted in CHANGELOG.md and waits for its tag; commits after the promotion ship with the next release." warning
          fi

          # Rewrite CHANGELOG.md: '## [Unreleased]' → '## [Unreleased]\n\n## [X.Y.Z] - DATE'.
          # Preserves all body content; only inserts a new header above.
          NEW_VERSION="$NEW_VERSION" TODAY="$TODAY" python3 - <<'PY'
          import os, re
          new_version = os.environ['NEW_VERSION']
          today = os.environ['TODAY']
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          new_content, n = re.subn(
              r'^## \[Unreleased\][^\n]*$',
              f'## [Unreleased]\n\n## [{new_version}] - {today}',
              content, count=1, flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("could not find '## [Unreleased]' header to rewrite")
          with open('CHANGELOG.md', 'w') as f:
              f.write(new_content)
          PY

          # The org ruleset rejects a push to main, so promote through a PR,
          # the same create + auto-merge the deploy job uses. This run cuts
          # nothing: the run on the merged promotion commit (top of this
          # step) tags, builds and deploys.
          BRANCH="ci/promote-v$NEW_VERSION"
          TITLE="chore: promote Unreleased to v$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add CHANGELOG.md
          git commit -m "$TITLE"
          # Force: a rerun after a failed earlier attempt finds the branch.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          PR_URL=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create -R "$REPO" \
              --title "$TITLE" \
              --body "Automated Tier-2 promotion of \`[Unreleased]\` to v$NEW_VERSION ($BUMP bump since ${LAST_TAG:-the start of history}). The Release run on this PR's merge commit tags v$NEW_VERSION, builds the image and opens the chalupa-infra deploy PR." \
              --head "$BRANCH" \
              --base main)
          fi
          echo "Promotion PR: $PR_URL"
          # --auto is refused when the PR is already clean; merge directly then.
          if ! MERGE_OUT=$(gh pr merge "$PR_URL" -R "$REPO" --squash --auto --delete-branch 2>&1); then
            if [[ "$MERGE_OUT" == *"clean status"* ]]; then
              echo "Promotion PR is already clean; merging directly."
              gh pr merge "$PR_URL" -R "$REPO" --squash --delete-branch
            else
              echo "$MERGE_OUT" >&2
              exit 1
            fi
          else
            echo "$MERGE_OUT"
          fi

          summary "### Promoting to v$NEW_VERSION"
          summary ""
          summary "$BUMP bump since \`${LAST_TAG:-none}\`. Promotion PR: $PR_URL"
          summary ""
          summary "The release is cut by the Release run on that PR's merge commit."
          echo "::notice title=Promotion PR opened::v$NEW_VERSION via $PR_URL"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Check if Tag Exists
        id: check_tag
        if: steps.detect_version.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.detect_version.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Version is empty — cannot check tag."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "::notice title=No release::v$VERSION is already tagged; nothing to release."
            echo "### No release cut" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "v$VERSION is already tagged." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist. Creating release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        if: steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.detect_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION:refs/tags/v$VERSION"

      - name: Create Release
        if: steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.detect_version.outputs.version }}
          generate_release_notes: true

  build-push:
    name: Build & Push Container
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: Chalupa-Tech/chalupa-infra/.github/workflows/build-push-reusable.yml@main
    with:
      image_name: ${{ inputs.image_name }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      GITEA_REGISTRY_USER: ${{ secrets.GITEA_REGISTRY_USER }}
      GITEA_REGISTRY_PASSWORD: ${{ secrets.GITEA_REGISTRY_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}

  deploy:
    name: Update Image Tag in chalupa-infra
    needs: [release, build-push]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chalupa-infra
        uses: actions/checkout@v4
        with:
          repository: Chalupa-Tech/chalupa-infra
          token: ${{ secrets.GH_PAT }}

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          args: "--accept-dns=false"

      - name: Add Gitea to /etc/hosts
        run: |
          GITEA_IP=$(tailscale ip -4 gitea.tailbecff0.ts.net 2>/dev/null || tailscale status --json | jq -r '.Peer[] | select(.HostName=="gitea") | .TailscaleIPs[0]')
          echo "${GITEA_IP} gitea.tailbecff0.ts.net" | sudo tee -a /etc/hosts

      - name: Verify image exists in registry
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          IMAGE="gitea.tailbecff0.ts.net/chalupa-tech/${{ inputs.image_name }}:${VERSION}"
          echo "Verifying image: $IMAGE"
          # Use curl to check the registry API (no docker login needed for existence check)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.GITEA_REGISTRY_USER }}:${{ secrets.GITEA_REGISTRY_PASSWORD }}" \
            "https://gitea.tailbecff0.ts.net/v2/chalupa-tech/${{ inputs.image_name }}/manifests/${VERSION}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Image $IMAGE not found in registry (HTTP $HTTP_STATUS). Aborting deploy."
            exit 1
          fi
          echo "Image verified (HTTP $HTTP_STATUS)."

      - name: Update image tag
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          VALUES_FILE="${{ inputs.values_path }}"
          sed -i "s|^  tag:.*|  tag: ${VERSION}|" "$VALUES_FILE"
          echo "Updated $VALUES_FILE to tag: $VERSION"
          cat "$VALUES_FILE"

      - name: Create PR and merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          BRANCH="ci/${{ inputs.image_name }}-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "deploy: ${{ inputs.image_name }} ${VERSION}"
          # Force: a rerun after a failed earlier attempt finds the branch.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          # Likewise reuse the PR an earlier attempt left open. Only one that
          # targets main: gh pr merge merges into the PR's own base.
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url // empty')
          if [[ -z "$PR_URL" ]]; then
            PR_URL=$(gh pr create \
              --title "deploy: ${{ inputs.image_name }} ${VERSION}" \
              --body "Automated image tag bump from [${{ inputs.image_name }} ${VERSION}](https://github.com/Chalupa-Tech/${{ inputs.image_name }}/releases/tag/${VERSION})." \
              --head "$BRANCH" \
              --base main)
          fi
          echo "Deploy PR: $PR_URL"

          # GitHub refuses --auto when nothing is pending (the PR is already
          # clean). Merge directly then; any other refusal fails the job.
          if ! MERGE_OUT=$(gh pr merge "$PR_URL" --squash --auto 2>&1); then
            if [[ "$MERGE_OUT" == *"clean status"* ]]; then
              echo "PR is already clean; merging directly."
              gh pr merge "$PR_URL" --squash --delete-branch
            else
              echo "$MERGE_OUT" >&2
              exit 1
            fi
          else
            echo "$MERGE_OUT"
          fi
