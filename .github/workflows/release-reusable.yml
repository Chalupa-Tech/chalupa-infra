---
name: Reusable Release Pipeline

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Container image name (e.g. go-schwab-auth)'
        required: true
        type: string
      values_path:
        description: 'Path to values.yaml in chalupa-infra (e.g. k8s/apps/schwab/go-schwab-auth/values.yaml)'
        required: true
        type: string
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_CLIENT_SECRET:
        required: true
      GITEA_REGISTRY_USER:
        required: true
      GITEA_REGISTRY_PASSWORD:
        required: true
      GH_PAT:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false' }}
      version: ${{ steps.detect_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT lets the auto-promote bot commit push past the org
          # "Protect Main" ruleset; default GITHUB_TOKEN cannot bypass.
          token: ${{ secrets.GH_PAT }}

      - name: Auto-promote and detect version
        id: detect_version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # Bot-commit loop guard. If the workflow is re-firing on the
          # auto-promote bot's own push, exit before scanning anything.
          # The chore-only classification below is a second line of defense
          # in case the bot's commit is one of several since LAST_TAG.
          # ---------------------------------------------------------------
          HEAD_SUBJECT=$(git log -1 --format='%s')
          HEAD_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if [[ "$HEAD_AUTHOR_EMAIL" == "github-actions[bot]@users.noreply.github.com" ]] \
              && [[ "$HEAD_SUBJECT" =~ ^chore:\ promote\ Unreleased\ to\ v ]]; then
            echo "HEAD is the auto-promote bot commit ('$HEAD_SUBJECT'); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Tier detection. Read the first '## [<token>]' header.
          # ---------------------------------------------------------------
          FIRST_HEADER=$(grep -m1 -oE '^##[[:space:]]+\[[^]]+\]' CHANGELOG.md || true)
          if [[ -z "$FIRST_HEADER" ]]; then
            echo "::error::CHANGELOG.md has no '## [<version>]' or '## [Unreleased]' header."
            exit 1
          fi
          FIRST_TOKEN=$(echo "$FIRST_HEADER" | sed -E 's/^##[[:space:]]+\[(.+)\]$/\1/')
          echo "First changelog section: [$FIRST_TOKEN]"

          if [[ "$FIRST_TOKEN" != "Unreleased" ]]; then
            # Tier 1: explicit version. Use as-is.
            if [[ ! "$FIRST_TOKEN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::First section '[$FIRST_TOKEN]' is not 'Unreleased' or X.Y.Z."
              exit 1
            fi
            echo "Tier 1: explicit version $FIRST_TOKEN."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$FIRST_TOKEN" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ---------------------------------------------------------------
          # Tier 2: auto-promote. Derive bump from conventional-commit
          # prefixes on each commit since LAST_TAG.
          # ---------------------------------------------------------------
          echo "Tier 2: deriving version from conventional commits."
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LAST_TAG" ]]; then
            LAST_VERSION="0.0.0"
            RANGE="HEAD"
            echo "No prior tags. Scanning full history."
          else
            LAST_VERSION="${LAST_TAG#v}"
            RANGE="${LAST_TAG}..HEAD"
            echo "Last tag: $LAST_TAG → $LAST_VERSION. Range: $RANGE"
          fi

          COMMITS=$(git log --reverse --format='%H' $RANGE)
          if [[ -z "$COMMITS" ]]; then
            echo "No commits since $LAST_TAG. Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ALL_DEFERRED=true
          BUMP="none"   # none | patch | minor | major

          # Conventional-commits subject regex. Bodies are noisy (squash
          # merges embed pre-squash commit subjects), so type prefix is
          # subject-only. BREAKING CHANGE in body still wins.
          RE_BREAK='^[a-z]+(\([^)]+\))?!:[[:space:]]'
          RE_FEAT='^feat(\([^)]+\))?:[[:space:]]'
          RE_FIX='^fix(\([^)]+\))?:[[:space:]]'

          while IFS= read -r SHA; do
            SUBJECT=$(git log -1 --format='%s' "$SHA")
            BODY=$(git log -1 --format='%b' "$SHA")
            echo "  $SHA: $SUBJECT"

            # release-deferred label check. Best-effort: missing PR or
            # API error counts as 'not deferred' (fail-open so we don't
            # accidentally suppress a real release).
            LABELS=$(gh pr list --search "sha:$SHA" --state merged --json labels --jq '.[0].labels[].name' 2>/dev/null || true)
            if ! grep -qx 'release-deferred' <<< "$LABELS"; then
              ALL_DEFERRED=false
            fi

            if echo "$BODY" | grep -qE '^BREAKING CHANGE:'; then
              BUMP="major"
            elif [[ "$SUBJECT" =~ $RE_BREAK ]]; then
              BUMP="major"
            elif [[ "$SUBJECT" =~ $RE_FEAT ]]; then
              [[ "$BUMP" != "major" ]] && BUMP="minor"
            elif [[ "$SUBJECT" =~ $RE_FIX ]]; then
              [[ "$BUMP" == "none" ]] && BUMP="patch"
            fi
          done <<< "$COMMITS"

          if [[ "$ALL_DEFERRED" == "true" ]]; then
            echo "All commits since $LAST_TAG are on release-deferred-labeled PRs. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BUMP" == "none" ]]; then
            echo "No releasable commits (feat/fix/breaking) since $LAST_TAG. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJ MIN PAT <<< "$LAST_VERSION"
          case "$BUMP" in
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN + 1)); PAT=0 ;;
            patch) PAT=$((PAT + 1)) ;;
          esac
          NEW_VERSION="${MAJ}.${MIN}.${PAT}"
          TODAY=$(date -u +%Y-%m-%d)
          echo "Bump: $BUMP → $NEW_VERSION (date $TODAY)"

          # Rewrite CHANGELOG.md: '## [Unreleased]' → '## [Unreleased]\n\n## [X.Y.Z] - DATE'.
          # Preserves all body content; only inserts a new header above.
          NEW_VERSION="$NEW_VERSION" TODAY="$TODAY" python3 - <<'PY'
          import os, re
          new_version = os.environ['NEW_VERSION']
          today = os.environ['TODAY']
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          new_content, n = re.subn(
              r'^## \[Unreleased\][^\n]*$',
              f'## [Unreleased]\n\n## [{new_version}] - {today}',
              content, count=1, flags=re.MULTILINE,
          )
          if n != 1:
              raise SystemExit("could not find '## [Unreleased]' header to rewrite")
          with open('CHANGELOG.md', 'w') as f:
              f.write(new_content)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: promote Unreleased to v$NEW_VERSION"
          git push origin HEAD:main

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check if Tag Exists
        id: check_tag
        if: steps.detect_version.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.detect_version.outputs.version }}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Version is empty — cannot check tag."
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist. Creating release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Tag
        if: steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.detect_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create Release
        if: steps.detect_version.outputs.skip == 'false' && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.detect_version.outputs.version }}
          generate_release_notes: true

  build-push:
    name: Build & Push Container
    needs: release
    if: needs.release.outputs.new_release == 'true'
    uses: Chalupa-Tech/chalupa-infra/.github/workflows/build-push-reusable.yml@main
    with:
      image_name: ${{ inputs.image_name }}
      version: ${{ needs.release.outputs.version }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
      GITEA_REGISTRY_USER: ${{ secrets.GITEA_REGISTRY_USER }}
      GITEA_REGISTRY_PASSWORD: ${{ secrets.GITEA_REGISTRY_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}

  deploy:
    name: Update Image Tag in chalupa-infra
    needs: [release, build-push]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout chalupa-infra
        uses: actions/checkout@v4
        with:
          repository: Chalupa-Tech/chalupa-infra
          token: ${{ secrets.GH_PAT }}

      - name: Join Tailscale network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          args: "--accept-dns=false"

      - name: Add Gitea to /etc/hosts
        run: |
          GITEA_IP=$(tailscale ip -4 gitea.tailbecff0.ts.net 2>/dev/null || tailscale status --json | jq -r '.Peer[] | select(.HostName=="gitea") | .TailscaleIPs[0]')
          echo "${GITEA_IP} gitea.tailbecff0.ts.net" | sudo tee -a /etc/hosts

      - name: Verify image exists in registry
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          IMAGE="gitea.tailbecff0.ts.net/chalupa-tech/${{ inputs.image_name }}:${VERSION}"
          echo "Verifying image: $IMAGE"
          # Use curl to check the registry API (no docker login needed for existence check)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.GITEA_REGISTRY_USER }}:${{ secrets.GITEA_REGISTRY_PASSWORD }}" \
            "https://gitea.tailbecff0.ts.net/v2/chalupa-tech/${{ inputs.image_name }}/manifests/${VERSION}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Image $IMAGE not found in registry (HTTP $HTTP_STATUS). Aborting deploy."
            exit 1
          fi
          echo "Image verified (HTTP $HTTP_STATUS)."

      - name: Update image tag
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          VALUES_FILE="${{ inputs.values_path }}"
          sed -i "s|^  tag:.*|  tag: ${VERSION}|" "$VALUES_FILE"
          echo "Updated $VALUES_FILE to tag: $VERSION"
          cat "$VALUES_FILE"

      - name: Create PR and merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VERSION="v${{ needs.release.outputs.version }}"
          BRANCH="ci/${{ inputs.image_name }}-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "deploy: ${{ inputs.image_name }} ${VERSION}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "deploy: ${{ inputs.image_name }} ${VERSION}" \
            --body "Automated image tag bump from [${{ inputs.image_name }} ${VERSION}](https://github.com/Chalupa-Tech/${{ inputs.image_name }}/releases/tag/${VERSION})." \
            --head "$BRANCH" \
            --base main)
          echo "Created PR: $PR_URL"

          gh pr merge "$PR_URL" --squash --auto
