name: Deploy Infrastructure

# Triggers on merge to main for any Ansible changes.
# Uses Tailscale GitHub Action to ephemerally join the private network,
# then runs the appropriate Ansible playbook(s) based on what changed.

on:
  push:
    branches: [main]
    paths:
      - 'ansible/**'

  # Allow manual trigger for any playbook
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run (site | minio | backups | docker-node | all)'
        required: false
        default: all
      tags:
        description: 'Optional --tags for the cluster playbooks (e.g. offsite-copy)'
        required: false
        default: ''

# One deploy at a time: two runs both write MinIO users and seed OpenBao from
# their own checkout, so an older run finishing last could restore old keys.
concurrency:
  group: deploy-infra
  cancel-in-progress: false

env:
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_HOST_KEY_CHECKING: "False"
  ANSIBLE_REMOTE_USER: "ci"
  # Hosts CI must not touch. tpi1 is cordoned for session 250's storage
  # work and tpi3 is no longer a cluster node (TP site removal); both are
  # still in the inventory for the operator's own runs.
  CI_LIMIT: "all:!tpi1:!tpi3"

jobs:
  detect-changes:
    name: Detect Changed Roles
    runs-on: ubuntu-latest
    outputs:
      run_site: ${{ steps.filter.outputs.site }}
      run_minio: ${{ steps.filter.outputs.minio }}
      run_backups: ${{ steps.filter.outputs.backups }}
      run_docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect which playbooks need to run
        id: filter
        run: |
          # On workflow_dispatch, respect the input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.playbook }}"
            echo "site=$( [ "$INPUT" = "site" ] || [ "$INPUT" = "all" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "minio=$( [ "$INPUT" = "minio" ] || [ "$INPUT" = "all" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "backups=$( [ "$INPUT" = "backups" ] || [ "$INPUT" = "all" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "docker=$( [ "$INPUT" = "docker-node" ] || [ "$INPUT" = "all" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push, check which files changed
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files: $CHANGED"

          SITE=false
          MINIO=false
          DOCKER=false

          # Roles applied by bootstrap.yml. k3s_hardening is there too (the
          # finalize play and the rolling etcd snapshot play); it was missing,
          # so its changes never reached the nodes.
          if echo "$CHANGED" | grep -qE '^ansible/(remote/|roles/(openbao_setup|argocd_setup|k3s_install|k3s_config|k3s_hardening|registry_config|pi_prepare|preflight|user_setup|tailscale_install|tailscale_services)/)'; then
            SITE=true
          fi
          # MinIO on fw1 is not in bootstrap.yml: its own playbook.
          if echo "$CHANGED" | grep -qE '^ansible/roles/minio_server/'; then
            MINIO=true
          fi
          if echo "$CHANGED" | grep -qE '^ansible/roles/gitea_setup/|^ansible/playbooks/docker-node\.yml'; then
            DOCKER=true
          fi
          # Always run both if shared inventory/group_vars changed
          if echo "$CHANGED" | grep -qE '^ansible/(inventory|playbooks)/'; then
            SITE=true
            MINIO=true
            DOCKER=true
          fi

          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "minio=$MINIO" >> "$GITHUB_OUTPUT"
          echo "backups=false" >> "$GITHUB_OUTPUT"
          echo "docker=$DOCKER" >> "$GITHUB_OUTPUT"

  deploy-cluster:
    name: Deploy K3s Cluster (minio, bootstrap, backups)
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.run_site == 'true' ||
      needs.detect-changes.outputs.run_minio == 'true' ||
      needs.detect-changes.outputs.run_backups == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: pip install ansible

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > /tmp/vault-pass.txt && chmod 600 /tmp/vault-pass.txt

      # Every cluster playbook connects as the ci user on every host
      # (-e beats the inventory's ansible_user: ubuntu on oracle1, which
      # refused CI's key from April to November 2026) and skips CI_LIMIT.
      # MinIO first: the other playbooks' backups write to it.
      - name: Run minio.yml (MinIO on fw1, buckets and scoped users)
        if: needs.detect-changes.outputs.run_minio == 'true'
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            --vault-password-file /tmp/vault-pass.txt \
            -e ansible_user=ci \
            --limit fw1 \
            ${TAGS:+--tags "$TAGS"} \
            playbooks/minio.yml
        working-directory: ${{ github.workspace }}/ansible

      - name: Run bootstrap.yml (k3s_config / openbao_setup / cluster config)
        if: needs.detect-changes.outputs.run_site == 'true'
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            --vault-password-file /tmp/vault-pass.txt \
            -e ansible_user=ci \
            --limit "$CI_LIMIT" \
            ${TAGS:+--tags "$TAGS"} \
            playbooks/bootstrap.yml
        working-directory: ${{ github.workspace }}/ansible

      # Dispatch only: the etcd and OpenBao backup settings on their own
      # (bootstrap.yml covers the same roles on push).
      - name: Run control-plane-backups.yml
        if: needs.detect-changes.outputs.run_backups == 'true'
        env:
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            --vault-password-file /tmp/vault-pass.txt \
            -e ansible_user=ci \
            --limit "$CI_LIMIT" \
            ${TAGS:+--tags "$TAGS"} \
            playbooks/control-plane-backups.yml
        working-directory: ${{ github.workspace }}/ansible

      - name: Cleanup vault password
        if: always()
        run: rm -f /tmp/vault-pass.txt

  deploy-docker:
    name: Deploy Docker Node (Gitea)
    needs: [detect-changes, deploy-cluster]
    # Run if docker changes detected, regardless of whether cluster job ran
    # (deploy-cluster may have been skipped if only docker files changed)
    if: |
      always() &&
      needs.detect-changes.outputs.run_docker == 'true' &&
      (needs.deploy-cluster.result == 'success' || needs.deploy-cluster.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}

      - name: Install Ansible
        run: pip install ansible

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > /tmp/vault-pass.txt && chmod 600 /tmp/vault-pass.txt

      - name: Run docker-node.yml (Gitea + OIDC)
        run: |
          ansible-playbook \
            -i inventory/hosts.yml \
            --vault-password-file /tmp/vault-pass.txt \
            -l docker_nodes \
            playbooks/docker-node.yml
        working-directory: ${{ github.workspace }}/ansible

      - name: Cleanup vault password
        if: always()
        run: rm -f /tmp/vault-pass.txt
