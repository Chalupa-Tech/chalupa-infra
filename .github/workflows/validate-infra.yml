name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - 'scripts/raspberrypi-k3s/ansible/**'
      - 'k8s/apps/schwab/timescaledb/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - '**.yml'
      - '**.yaml'
      - '**.sh'
      - 'scripts/raspberrypi-k3s/ansible/**'
      - 'k8s/apps/schwab/timescaledb/migrations/**'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      shell: ${{ steps.filter.outputs.shell }}
      ansible: ${{ steps.filter.outputs.ansible }}
      release: ${{ steps.filter.outputs.release }}
      timescaledb: ${{ steps.filter.outputs.timescaledb }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            yaml:
              - '**.yml'
              - '**.yaml'
            shell:
              - '**.sh'
            ansible:
              - 'ansible/**'
            release:
              - '.github/workflows/release-reusable.yml'
              - 'scripts/ci-tests/release-detect-version-test.sh'
            timescaledb:
              - 'k8s/apps/schwab/timescaledb/**'
              - 'scripts/ci-tests/timescaledb-migrations-test.sh'

  release-workflow-test:
    name: Release Workflow Test
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test the version-detect step of release-reusable.yml
        run: |
          python3 -c 'import yaml' || pip install pyyaml
          git config --global init.defaultBranch main
          scripts/ci-tests/release-detect-version-test.sh

  timescaledb-migrations-test:
    name: TimescaleDB Migrations Test
    needs: changes
    if: needs.changes.outputs.timescaledb == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render the chart and check the migration Job script
        run: |
          python3 -c 'import yaml' || pip install pyyaml
          scripts/ci-tests/timescaledb-migrations-test.sh

  timescaledb-migrations-db-test:
    name: TimescaleDB Migrations DB Test
    needs: changes
    if: needs.changes.outputs.timescaledb == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in step with the extension version in the chart's postInitTemplateSQL;
        # the test asserts the installed version matches it.
        image: timescale/timescaledb:2.19.3-pg16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run the migrations against a real TimescaleDB
        run: |
          python3 -c 'import yaml' || pip install pyyaml
          scripts/ci-tests/timescaledb-migrations-db-test.sh

  yaml-lint:
    name: YAML Lint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint

      - name: Run yamllint
        run: yamllint .

  shell-check:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: .git
          severity: error

  ansible-lint:
    name: Ansible Lint
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned: ansible/.ansible-lint-ignore is the baseline of violations
      # that predate it (generated with this version); a new rule in a
      # newer release would turn every Ansible PR red again.
      - name: Install ansible-lint
        run: pip install ansible-lint==26.3.0 ansible-core==2.20.3

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint --profile production .

  ansible-syntax:
    name: Ansible Syntax Check
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible and collections
        working-directory: ansible
        run: |
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check — rolling restart
        working-directory: ansible
        run: ansible-playbook playbooks/k3s-rolling-restart.yml --syntax-check
        env:
          ANSIBLE_VAULT_PASSWORD: dummy

      - name: Syntax check — bootstrap
        working-directory: ansible
        run: ansible-playbook playbooks/bootstrap.yml --syntax-check
        env:
          ANSIBLE_VAULT_PASSWORD: dummy

      - name: Syntax check — wireguard
        working-directory: ansible
        run: ansible-playbook playbooks/wireguard.yml --syntax-check
        env:
          ANSIBLE_VAULT_PASSWORD: dummy
