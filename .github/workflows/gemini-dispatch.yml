name: '🔀 Gemini Dispatch'

# Cost guardrails bounding runaway spend on the triggers below:
#   1. `gemini-review.yml` / `gemini-triage.yml` set
#      `concurrency.cancel-in-progress: true` keyed on PR/issue number
#      + event_name, so back-to-back `synchronize` pushes cancel the
#      in-flight review and only the latest completes.
#   2. `vars.GEMINI_DISPATCH_ENABLED` (org var) is a hard kill switch —
#      the `dispatch` job gates on it (see the `if:` below). Flip to
#      `false` to halt all Gemini activity instantly.
#   3. `GeminiSpendHardCap` VMRule (k8s/platform/observability/templates/
#      gen-ai-alert-rules.yaml) pages when monthly spend exceeds the
#      configured dollar cap; the page playbook flips #2.
# Removing `synchronize` below without weighing these guardrails would
# force reviewer-iteration PRs back into the close+reopen workaround.
on:
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  debugger:
    if: |-
      ${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - name: 'Print context for debugging'
        env:
          DEBUG_event_name: '${{ github.event_name }}'
          DEBUG_event__action: '${{ github.event.action }}'
          DEBUG_event__comment__author_association: '${{ github.event.comment.author_association }}'
          DEBUG_event__issue__author_association: '${{ github.event.issue.author_association }}'
          DEBUG_event__pull_request__author_association: '${{ github.event.pull_request.author_association }}'
          DEBUG_event__review__author_association: '${{ github.event.review.author_association }}'
          DEBUG_event: '${{ toJSON(github.event) }}'
        run: |-
          env | grep '^DEBUG_'

  dispatch:
    # Gated by GEMINI_DISPATCH_ENABLED org var (default: undefined → enabled).
    # The GeminiSpendHardCap alert flips this to 'false' via repository-dispatch
    # to halt all Gemini activity across the org.
    #
    # For PRs: only if not from a fork
    # For issues: only on open/reopen
    # For comments: only if user types @gemini-cli and is OWNER/MEMBER/COLLABORATOR
    if: |-
      vars.GEMINI_DISPATCH_ENABLED != 'false' && (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        ) || (
          github.event_name == 'issues' &&
          contains(fromJSON('["opened", "reopened"]'), github.event.action)
        ) || (
          github.event.sender.type == 'User' &&
          startsWith(github.event.comment.body || github.event.review.body || github.event.issue.body, '@gemini-cli') &&
          contains(
            fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.comment.author_association ||
            github.event.review.author_association ||
            github.event.issue.author_association
          )
        )
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      request: '${{ steps.extract_command.outputs.request }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
      issue_number: '${{ github.event.pull_request.number || github.event.issue.number }}'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        # ratchet:actions/create-github-app-token@v2
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea' # ratchet:actions/github-script@v7
        env:
          EVENT_TYPE: '${{ github.event_name }}.${{ github.event.action }}'
          REQUEST: '${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}'
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST;
            core.setOutput('request', request);

            if (['pull_request.opened', 'pull_request.synchronize'].includes(eventType)) {
              core.setOutput('command', 'review');
            } else if (['issues.opened', 'issues.reopened'].includes(eventType)) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli /review")) {
              core.setOutput('command', 'review');
              const additionalContext = request.replace(/^@gemini-cli \/review/, '').trim();
              core.setOutput('additional_context', additionalContext);
            } else if (request.startsWith("@gemini-cli /triage")) {
              core.setOutput('command', 'triage');
            } else if (request.startsWith("@gemini-cli")) {
              const additionalContext = request.replace(/^@gemini-cli/, '').trim();
              core.setOutput('command', 'invoke');
              core.setOutput('additional_context', additionalContext);
            } else {
              core.setOutput('command', 'fallthrough');
            }

      - name: 'Acknowledge request'
        # Skip the ack on synchronize — reviewer-iteration pushes fire
        # this workflow frequently, and an ack per push would spam the
        # PR with bot comments. The dispatched review still runs; its
        # completion is visible in the checks panel.
        if: |-
          github.event.action != 'synchronize'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 Hi @${{ github.actor }}, I've received your request!
            Track progress: [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"

  # Phase-56 cost gate: for auto-triggered PR reviews (opened /
  # synchronize), skip the review if the PR is trivial (docs/lock-file
  # only, draft, sub-20-line) or opted out via the `skip-review`
  # label. Comment-invoked reviews (`@gemini-cli /review`) bypass
  # this job entirely — the operator's explicit request wins.
  #
  # Expected to eliminate ~30% of review runs based on review-cost
  # brief estimates (workstreams/ai-reviews/briefs/review-cost-strategy.md
  # in chalupa-brain). Pairs with the `pull_request_read` removal
  # in gemini-review.yml to cut both run volume and per-run tokens.
  filter_review:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'review' && github.event_name == 'pull_request' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 2
    permissions:
      contents: 'read'
      pull-requests: 'read'
    outputs:
      should_run: '${{ steps.decide.outputs.should_run }}'
      skip_reason: '${{ steps.decide.outputs.skip_reason }}'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6

      - name: 'Detect reviewable files'
        id: 'paths'
        # predicate-quantifier: every is required for negation
        # semantics. With the default 'some', a file matches if ANY
        # pattern matches — so `**` alone is enough to match
        # everything, and the `!...` exclusions are no-ops. With
        # 'every', a file must match ALL patterns: `**` AND each
        # negation (i.e., NOT in any exempt subtree) → filter output
        # is true iff at least one changed file is outside every
        # exempt glob.
        uses: 'dorny/paths-filter@v3'
        with:
          predicate-quantifier: 'every'
          filters: |-
            reviewable:
              - '**'
              - '!CHANGELOG.md'
              - '!**/CHANGELOG.md'
              - '!**/*.lock'
              - '!**/Chart.lock'
              - '!**/package-lock.json'
              - '!docs/**'
              - '!**/*.generated.go'
              - '!**/zz_generated_*.go'
              - '!.gitignore'
              - '!**/.gitignore'

      - name: 'Decide should_run'
        id: 'decide'
        env:
          PR_DRAFT: '${{ github.event.pull_request.draft }}'
          PR_ADDITIONS: '${{ github.event.pull_request.additions }}'
          PR_DELETIONS: '${{ github.event.pull_request.deletions }}'
          PR_LABELS: '${{ toJSON(github.event.pull_request.labels.*.name) }}'
          HAS_REVIEWABLE: '${{ steps.paths.outputs.reviewable }}'
        run: |-
          set -euo pipefail
          has_label() { jq -e --arg n "$1" 'any(.[]; . == $n)' <<<"$PR_LABELS" >/dev/null; }

          decide() {
            local reason="$1"
            printf 'should_run=false\n' >> "$GITHUB_OUTPUT"
            printf 'skip_reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
            printf '::notice::Skipping Gemini review: %s\n' "$reason"
            exit 0
          }

          # skip-review wins over everything, including force-review.
          if has_label 'skip-review'; then
            decide 'skip-review label'
          fi

          # force-review bypasses draft/size/path gates (but not skip-review).
          if has_label 'force-review'; then
            printf 'should_run=true\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Gemini review forced by force-review label\n'
            exit 0
          fi

          if [ "$PR_DRAFT" = 'true' ]; then
            decide 'draft PR (add force-review label to override)'
          fi

          # Path filter before size so a large docs-only PR reports
          # the path reason, not a misleading size reason. A small
          # docs-only PR could hit either gate — order makes the
          # messaging consistent.
          if [ "$HAS_REVIEWABLE" != 'true' ]; then
            decide 'no reviewable files changed (only docs/CHANGELOG/lock/generated)'
          fi

          ADDITIONS="${PR_ADDITIONS:-0}"
          DELETIONS="${PR_DELETIONS:-0}"
          SIZE=$(( ADDITIONS + DELETIONS ))
          if [ "$SIZE" -lt 20 ]; then
            decide "small PR ($SIZE lines; add force-review label to override)"
          fi

          printf 'should_run=true\n' >> "$GITHUB_OUTPUT"
          printf '::notice::Gemini review gated through: %d lines, reviewable files present\n' "$SIZE"

  review:
    needs:
      - 'dispatch'
      - 'filter_review'
    # Run if:
    #   - dispatch routed to 'review' AND
    #   - either the trigger is NOT a pull_request event (i.e., a
    #     comment-invoked `@gemini-cli /review` — operator explicit
    #     request bypasses filter_review, which is skipped for such
    #     events), OR
    #   - the filter_review job decided should_run=true.
    # !cancelled() lets this job run even though filter_review is
    # skipped on non-PR events (default GHA behavior would propagate
    # the skip here).
    if: |-
      !cancelled()
      && needs.dispatch.result == 'success'
      && needs.dispatch.outputs.command == 'review'
      && (
        github.event_name != 'pull_request'
        || needs.filter_review.outputs.should_run == 'true'
      )
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'triage' }}
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: |-
      ${{ needs.dispatch.outputs.command == 'invoke' }}
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  fallthrough:
    needs:
      - 'dispatch'
      - 'review'
      - 'triage'
      - 'invoke'
    if: |-
      ${{ always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough') }}
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        # ratchet:actions/create-github-app-token@v2
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Send failure comment'
        # Same rationale as 'Acknowledge request' — silence the
        # failure comment on synchronize so reviewer-iteration pushes
        # don't spam the PR. Check conclusions remain visible in the
        # checks panel.
        if: |-
          github.event.action != 'synchronize'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          MESSAGE: |-
            🤖 I'm sorry @${{ github.actor }}, I was unable to process your request.
            Please [see the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          REPOSITORY: '${{ github.repository }}'
        run: |-
          gh issue comment "${ISSUE_NUMBER}" \
            --body "${MESSAGE}" \
            --repo "${REPOSITORY}"
