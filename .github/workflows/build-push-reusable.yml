---
name: Reusable Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name under chalupa-tech org (e.g. go-notify)'
        required: true
        type: string
      platforms:
        description: 'Buildx platforms'
        required: false
        type: string
        default: 'linux/arm64,linux/amd64'
      build_args:
        description: 'Additional docker build args (newline-separated KEY=VALUE)'
        required: false
        type: string
        default: ''
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_CLIENT_SECRET:
        required: true
      GITEA_REGISTRY_USER:
        required: true
      GITEA_REGISTRY_PASSWORD:
        required: true
      GH_PAT:
        required: false

jobs:
  build-push:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join Tailscale network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.tailbecff0.ts.net
          username: ${{ secrets.GITEA_REGISTRY_USER }}
          password: ${{ secrets.GITEA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          # Version from tag (v1.2.3 -> 1.2.3) or empty
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tag list
        id: tags
        run: |
          REGISTRY="gitea.tailbecff0.ts.net/chalupa-tech/${{ inputs.image_name }}"
          TAGS="${REGISTRY}:${{ steps.meta.outputs.sha_short }}"
          TAGS="${TAGS},${REGISTRY}:latest"
          if [ "${{ steps.meta.outputs.has_version }}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY}:v${{ steps.meta.outputs.version }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            GITHUB_PAT=${{ secrets.GH_PAT }}
            ${{ inputs.build_args }}
          tags: ${{ steps.tags.outputs.tags }}
