---
name: Reusable Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image name under chalupa-tech org (e.g. go-notify)'
        required: true
        type: string
      version:
        description: 'Semantic version to tag (e.g. 0.5.0). Omit to auto-detect from GITHUB_REF.'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Buildx platforms'
        required: false
        type: string
        default: 'linux/arm64,linux/amd64'
      build_args:
        description: 'Additional docker build args (newline-separated KEY=VALUE)'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context path (relative to repo root)'
        required: false
        type: string
        default: '.'
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_CLIENT_SECRET:
        required: true
      GITEA_REGISTRY_USER:
        required: true
      GITEA_REGISTRY_PASSWORD:
        required: true
      GH_PAT:
        required: false

jobs:
  build-push:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Join Tailscale with --accept-dns=false so the host keeps public DNS
      # (Docker Hub, GitHub). BuildKit gets Tailscale DNS via explicit config.
      # See: https://github.com/tailscale/github-action/issues/101
      - name: Join Tailscale network
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          args: "--accept-dns=false"

      # Resolve Gitea hostname via Tailscale and add to /etc/hosts so
      # host-level tools (docker login) can reach it without MagicDNS.
      - name: Add Gitea to /etc/hosts
        run: |
          GITEA_IP=$(tailscale ip -4 gitea.tailbecff0.ts.net 2>/dev/null || tailscale status --json | jq -r '.Peer[] | select(.HostName=="gitea") | .TailscaleIPs[0]')
          echo "${GITEA_IP} gitea.tailbecff0.ts.net" | sudo tee -a /etc/hosts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # BuildKit uses host network + dual-stack DNS:
      # 100.100.100.100 = Tailscale MagicDNS (for gitea.tailbecff0.ts.net)
      # 8.8.8.8 = Google DNS fallback (for Docker Hub, GitHub)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [dns]
              nameservers=["100.100.100.100","8.8.8.8"]

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.tailbecff0.ts.net
          username: ${{ secrets.GITEA_REGISTRY_USER }}
          password: ${{ secrets.GITEA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | head -c 7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"

          # Version from explicit input, tag ref, or empty
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tag list
        id: tags
        run: |
          REGISTRY="gitea.tailbecff0.ts.net/chalupa-tech/${{ inputs.image_name }}"
          TAGS="${REGISTRY}:${{ steps.meta.outputs.sha_short }}"
          TAGS="${TAGS},${REGISTRY}:latest"
          if [ "${{ steps.meta.outputs.has_version }}" = "true" ]; then
            TAGS="${TAGS},${REGISTRY}:v${{ steps.meta.outputs.version }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: |
            GITHUB_PAT=${{ secrets.GH_PAT }}
            ${{ inputs.build_args }}
          tags: ${{ steps.tags.outputs.tags }}

      # Verify the version tag actually landed in Gitea. Catches the
      # bug class that bit sessions 68 (v0.3.0) and 100 (v0.6.0) where
      # a tag-path-filter mismatch silently dropped the push and
      # surfaced only as ImagePullBackOff alerts ~15 minutes later.
      # `crane manifest` checks the manifest without pulling layers.
      # Tailscale + /etc/hosts entries set up earlier in the job make
      # gitea.tailbecff0.ts.net reachable here.
      - name: Verify version tag landed in Gitea
        if: ${{ steps.meta.outputs.has_version == 'true' }}
        run: |
          set -euo pipefail
          IMAGE="gitea.tailbecff0.ts.net/chalupa-tech/${{ inputs.image_name }}:v${{ steps.meta.outputs.version }}"
          echo "Verifying $IMAGE is reachable..."
          go install github.com/google/go-containerregistry/cmd/crane@latest
          if ! "$HOME/go/bin/crane" manifest "$IMAGE" > /dev/null; then
            echo "::error::Image $IMAGE was NOT found in Gitea after push."
            echo "::error::This is the bug class that bit sessions 68 + 100."
            echo "::error::Manual recovery: re-run this workflow_call from the caller, or push the tag locally."
            exit 1
          fi
          echo "OK: $IMAGE is reachable in Gitea."
