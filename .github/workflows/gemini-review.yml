name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
    secrets:
      TELEMETRY_TOKEN:
        description: >-
          Bearer token for the vm-write / vlogs-write cluster ingresses.
          Provisioned as an org-level secret, minted by the
          gh-actions-telemetry-mint Job in the observability namespace
          (see docs/runbooks/gh-actions-telemetry-token-rotation.md).
          Optional — telemetry emit degrades to log-only when unset.
        required: false

concurrency:
  group: >-
    ${{ github.workflow }}-review-${{ github.event_name }}-${{
    github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  # Compose additional context from chalupa-brain workstream briefs +
  # per-repo review addenda + caller-supplied context. This is review-
  # specific — the reusable Gemini CLI job treats additional_context as
  # a single opaque string.
  compose_context:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 3
    permissions:
      contents: 'read'
      pull-requests: 'read'
    outputs:
      composed_context: ${{ steps.compose.outputs.context }}
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6

      - name: 'Detect workstream'
        id: 'detect_workstream'
        env:
          REPO_NAME: '${{ github.event.repository.name }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          set -euo pipefail
          WS=""
          CHANGED="$(gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only 2>/dev/null || true)"
          case "$REPO_NAME" in
            chalupa-infra)
              if printf '%s\n' "$CHANGED" | grep -qE '^k8s/apps/schwab/(go-paper-trader|watchlists)/'; then
                WS="paper-trading"
              fi
              ;;
          esac
          echo "workstream=$WS" >> "$GITHUB_OUTPUT"
          echo "Detected workstream: ${WS:-<none>}" >&2

      - name: 'Fetch workstream context'
        id: 'fetch_ws_context'
        if: steps.detect_workstream.outputs.workstream != ''
        env:
          WORKSTREAM: '${{ steps.detect_workstream.outputs.workstream }}'
          # Reuses the existing GOPRIVATE credential (org scope
          # Chalupa-Tech/*, read-only by convention). A dedicated
          # brain-read token or GH App is a future hygiene phase —
          # see docs/runbooks/github-token-provisioning.md.
          BRAIN_READ_TOKEN: '${{ secrets.GH_PAT }}'
        run: |-
          set -euo pipefail
          OUT=/tmp/ws_context.md
          : > "$OUT"
          if [ -z "${BRAIN_READ_TOKEN:-}" ]; then
            echo "::warning::BRAIN_READ_TOKEN not set — skipping workstream context injection for workstream=${WORKSTREAM}"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git clone --depth 1 --single-branch --quiet \
              "https://x-access-token:${BRAIN_READ_TOKEN}@github.com/Chalupa-Tech/chalupa-brain.git" \
              /tmp/brain; then
            echo "::warning::chalupa-brain clone failed — skipping workstream context injection"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CTX_DIR="/tmp/brain/workstreams/${WORKSTREAM}"
          if [ ! -d "$CTX_DIR" ]; then
            echo "::warning::workstream directory not found in chalupa-brain: ${WORKSTREAM}"
            rm -rf /tmp/brain
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "# Workstream context: ${WORKSTREAM}"
            echo
            if [ -f "$CTX_DIR/workstream.md" ]; then
              echo "## workstream.md"
              echo
              cat "$CTX_DIR/workstream.md"
              echo
            fi
            if [ -d "$CTX_DIR/briefs" ]; then
              for brief in "$CTX_DIR/briefs/"*.md; do
                [ -f "$brief" ] || continue
                # Skip archived briefs (frontmatter `status: archived`)
                if head -20 "$brief" | grep -qiE '^status:[[:space:]]*archived'; then
                  continue
                fi
                echo "---"
                echo "## brief: $(basename "$brief")"
                echo
                cat "$brief"
                echo
              done
            fi
          } > "$OUT"
          SIZE=$(wc -c <"$OUT")
          echo "Workstream context size: $SIZE bytes" >&2
          if [ "$SIZE" -gt 80000 ]; then
            echo "::warning::Workstream context exceeds 80K soft cap — consider archiving older briefs"
          fi
          rm -rf /tmp/brain
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Pre-inject PR title/body/author/state/base/head/labels/file-list
      # so Gemini has the metadata it would otherwise fetch via
      # `pull_request_read.{get, get_files}`. Phase-56c removed that
      # tool from includeTools — without this enriched pre-inject,
      # Gemini has no metadata source and routes to shell fallbacks
      # (phase-56a regression). See
      # docs/research/2026-04-22-pr-review-context-priming.md for the
      # "pre-inject + no MCP tool" pattern rationale.
      - name: 'Fetch PR metadata for pre-inject'
        id: 'fetch_pr_metadata'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPO: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          OUT=/tmp/pr_metadata.md
          : > "$OUT"
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No PR number — skipping metadata pre-inject" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RAW=/tmp/pr_metadata.json
          if ! gh pr view "$PR_NUMBER" --repo "$REPO" \
              --json title,body,author,state,labels,baseRefName,headRefName,createdAt,files \
              > "$RAW" 2>/tmp/pr_metadata.err; then
            echo "::warning::gh pr view failed — skipping metadata pre-inject:"
            sed 's/^/  /' /tmp/pr_metadata.err >&2 || true
            rm -f "$RAW"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Truncate body to 10KB to bound worst-case PR description.
          {
            echo
            echo "## PR Metadata"
            echo
            jq -r '
              "- **Title:** " + (.title // "(none)"),
              "- **Author:** " + (.author.login // "(unknown)"),
              "- **State:** " + (.state // "(unknown)"),
              "- **Base:** " + (.baseRefName // "(unknown)") + " → **Head:** " + (.headRefName // "(unknown)"),
              "- **Labels:** " + (if (.labels | length) > 0 then (.labels | map(.name) | join(", ")) else "none" end),
              "- **Created:** " + (.createdAt // "(unknown)")
            ' "$RAW"
            echo
            echo "### Body"
            echo
            jq -r '.body // "(empty)"' "$RAW" | head -c 10240
            echo
            echo
            echo "### Files changed"
            echo
            jq -r '.files // [] | .[] | "- `" + .path + "` (+" + (.additions | tostring) + "/-" + (.deletions | tostring) + ")"' "$RAW"
          } > "$OUT"
          rm -f "$RAW"
          echo "Wrote PR metadata ($(wc -c <"$OUT") bytes) to $OUT" >&2
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Pre-inject the PR diff so the review model has read context
      # up front. Even with MCP working, pre-inject avoids 10–20
      # tool-call round-trips (each re-ships the full system prompt)
      # at the cost of ~0.2 tokens per diff line. Net-positive up to
      # the 50k-line cap; beyond that the diff dominates context and
      # tool-based piecemeal reads are healthier.
      - name: 'Fetch PR diff for pre-inject'
        id: 'fetch_pr_diff'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPO: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          OUT=/tmp/pr_diff.md
          : > "$OUT"
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No PR number — skipping diff pre-inject" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RAW=/tmp/pr_raw.diff
          if ! gh pr diff "$PR_NUMBER" --repo "$REPO" > "$RAW" 2>/tmp/pr_diff.err; then
            echo "::warning::gh pr diff failed — skipping pre-inject:"
            sed 's/^/  /' /tmp/pr_diff.err >&2 || true
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LINES=$(wc -l <"$RAW")
          echo "PR diff line count: $LINES" >&2
          if [ "$LINES" -gt 50000 ]; then
            echo "::warning::PR diff exceeds 50k lines ($LINES) — skipping pre-inject; review will fall back to MCP tool calls"
            rm -f "$RAW"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo
            echo "## PR Diff"
            echo
            echo '```diff'
            cat "$RAW"
            echo '```'
          } > "$OUT"
          rm -f "$RAW"
          echo "Wrote PR diff ($LINES lines, $(wc -c <"$OUT") bytes) to $OUT" >&2
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Phase-67 fix for "diff-hunk myopia": the reviewer receives only
      # -U3 diff hunks and can't see conventions that live in unchanged
      # adjacent lines (PR #417's palette-classic false positive). Inject
      # full-file content for small JSON/YAML/TOML files — the format
      # class where no AST-aware widening helps (no enclosing function).
      # 1500-line threshold covers all current Grafana dashboards (largest:
      # 1368). 150KB aggregate budget bounds Lost-in-the-Middle degradation.
      # See workstreams/ai-reviews/prompts/phase-67-*.md.
      - name: 'Fetch full-file content for small changed files'
        id: 'fetch_pr_full_files'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN || github.token }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPO: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          OUT=/tmp/pr_full_files.md
          : > "$OUT"
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No PR number — skipping full-file pre-inject" >&2
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAX_LINES=1500
          BUDGET_BYTES=153600
          USED_BYTES=0
          INJECTED=0
          SKIPPED_SIZE=0
          SKIPPED_TYPE=0
          SKIPPED_BUDGET=0
          if ! gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only \
              > /tmp/changed_files.txt 2>/tmp/name_only.err; then
            echo "::warning::gh pr diff --name-only failed — skipping full-file pre-inject:"
            sed 's/^/  /' /tmp/name_only.err >&2 || true
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUFFER=/tmp/pr_full_files.buf
          : > "$BUFFER"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.json|*.yaml|*.yml|*.toml) ;;
              *) SKIPPED_TYPE=$((SKIPPED_TYPE+1)); continue ;;
            esac
            if [ ! -f "$f" ]; then
              continue
            fi
            lines=$(wc -l <"$f")
            if [ "$lines" -ge "$MAX_LINES" ]; then
              SKIPPED_SIZE=$((SKIPPED_SIZE+1))
              continue
            fi
            bytes=$(wc -c <"$f")
            if [ "$((USED_BYTES + bytes))" -gt "$BUDGET_BYTES" ]; then
              SKIPPED_BUDGET=$((SKIPPED_BUDGET+1))
              continue
            fi
            {
              echo "# FULL FILE (small, ${lines} lines): ${f}"
              cat "$f"
              echo "# END FULL FILE: ${f}"
              echo
            } >> "$BUFFER"
            USED_BYTES=$((USED_BYTES + bytes))
            INJECTED=$((INJECTED+1))
          done < /tmp/changed_files.txt
          if [ "$INJECTED" -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo
              echo "## Full File Content (small changed files)"
              echo
              echo "The following ${INJECTED} file(s) are under the 1500-line threshold for structured configs (.json/.yaml/.yml/.toml) and are injected in full. This block is authoritative — if a convention or required field is present in these files, do NOT flag it as missing based solely on the diff hunks."
              echo
              cat "$BUFFER"
            } > "$OUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Full-file injection: injected=${INJECTED} skipped_size=${SKIPPED_SIZE} skipped_type=${SKIPPED_TYPE} skipped_budget=${SKIPPED_BUDGET} bytes=${USED_BYTES}" >&2

      - name: 'Compose additional context'
        id: 'compose'
        env:
          INBOUND_CONTEXT: '${{ inputs.additional_context }}'
          REPO_NAME: '${{ github.event.repository.name }}'
          WS_CONTEXT_AVAILABLE: '${{ steps.fetch_ws_context.outputs.available }}'
          PR_METADATA_AVAILABLE: '${{ steps.fetch_pr_metadata.outputs.available }}'
          PR_DIFF_AVAILABLE: '${{ steps.fetch_pr_diff.outputs.available }}'
          PR_FULL_FILES_AVAILABLE: '${{ steps.fetch_pr_full_files.outputs.available }}'
        run: |-
          set -euo pipefail
          ADDENDUM_FILE=".github/commands/addenda/${REPO_NAME}-review.md"
          {
            if [ "${WS_CONTEXT_AVAILABLE:-false}" = "true" ] && [ -f /tmp/ws_context.md ]; then
              cat /tmp/ws_context.md
              echo
            fi
            if [ -f "$ADDENDUM_FILE" ]; then
              cat "$ADDENDUM_FILE"
            fi
            if [ -n "${INBOUND_CONTEXT:-}" ]; then
              echo
              echo "## Per-PR Additional Context"
              echo
              printf -- '%s\n' "$INBOUND_CONTEXT"
            fi
            # PR metadata before diff so the model reads title/body/files
            # to establish what the PR is about, then the diff as the
            # concrete artifact to review.
            if [ "${PR_METADATA_AVAILABLE:-false}" = "true" ] && [ -f /tmp/pr_metadata.md ]; then
              cat /tmp/pr_metadata.md
            fi
            if [ "${PR_DIFF_AVAILABLE:-false}" = "true" ] && [ -f /tmp/pr_diff.md ]; then
              cat /tmp/pr_diff.md
            fi
            # Full-file block immediately follows the diff so the model
            # reads it as "authoritative context for what you just saw
            # the diff of" rather than as generic repo material.
            if [ "${PR_FULL_FILES_AVAILABLE:-false}" = "true" ] && [ -f /tmp/pr_full_files.md ]; then
              cat /tmp/pr_full_files.md
            fi
          } > /tmp/composed_context.txt
          {
            echo 'context<<COMPOSED_EOF'
            cat /tmp/composed_context.txt
            echo 'COMPOSED_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Composed context size: $(wc -c </tmp/composed_context.txt) bytes" >&2

  review:
    needs: 'compose_context'
    uses: './.github/workflows/gemini-cli-reusable.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    secrets: 'inherit'
    with:
      workflow_name: 'gemini-review'
      prompt: '/gemini-review'
      mint_token: true
      # 8 minutes covers observed P95 wallclock with ~2min headroom.
      # Phase-55 telemetry (10 runs over 30d) showed turn counts 6–69
      # with mean ~29, and estimated wallclock up to 6min on 69-turn
      # runs — the prior 4min ceiling was timing out healthy runs.
      # 8min is still "fail loud if something is wrong" (industry
      # median bot is 2–3min; true happy path here is ~2m); it just
      # stops killing the tail of the distribution.
      timeout_minutes: 8
      mcp_preflight: true
      additional_context: ${{ needs.compose_context.outputs.composed_context }}
      # settings_json: maxSessionTurns=75 is calibrated against
      # phase-55 telemetry (10 runs over 30d) — observed max 69 turns,
      # so 75 has ~6 turns of headroom. Pairs with timeout_minutes=8:
      # at observed ~5s/turn, 75 turns × 5s = 375s, under the 480s
      # timeout. Raise both together if the ceiling starts biting.
      #
      # includeTools (phase-56c): `pull_request_read` is removed. The
      # compose_context job pre-injects title/body/author/state/base/
      # head/labels/files + full diff, and the .toml prompt directs
      # Gemini to treat that block as authoritative. Phase-56a tried
      # this removal with the prompt still pointing at the tool —
      # Gemini flailed to shell fallbacks (gh pr view, curl api.github,
      # cat $GITHUB_EVENT_PATH). Phase-56c ships the coordinated shape
      # (enriched pre-inject + positive-framing prompt + tool removed).
      # Rationale + citations: docs/research/2026-04-22-pr-review-
      # context-priming.md (brain repo).
      settings_json: |-
        {
          "model": {
            "maxSessionTurns": 75
          },
          "telemetry": {
            "enabled": true,
            "target": "otlp",
            "otlpEndpoint": "http://127.0.0.1:4318",
            "otlpProtocol": "http",
            "outfile": ".gemini/telemetry.log"
          },
          "mcpServers": {
            "github": {
              "command": "docker",
              "args": [
                "run",
                "-i",
                "--rm",
                "--network",
                "host",
                "-e",
                "GITHUB_PERSONAL_ACCESS_TOKEN",
                "ghcr.io/github/github-mcp-server:v0.27.0"
              ],
              "includeTools": [
                "add_comment_to_pending_review",
                "pull_request_review_write"
              ],
              "env": {
                "GITHUB_PERSONAL_ACCESS_TOKEN": "${GEMINI_MCP_GITHUB_TOKEN}"
              }
            }
          },
          "tools": {
            "core": [
              "run_shell_command(cat)",
              "run_shell_command(echo)",
              "run_shell_command(grep)",
              "run_shell_command(head)",
              "run_shell_command(tail)"
            ]
          }
        }
