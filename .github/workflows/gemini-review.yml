name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
    secrets:
      TELEMETRY_TOKEN:
        description: >-
          Bearer token for the vm-write / vlogs-write cluster ingresses.
          Provisioned as an org-level secret, minted by the
          gh-actions-telemetry-mint Job in the observability namespace
          (see docs/runbooks/gh-actions-telemetry-token-rotation.md).
          Optional — telemetry emit in phase-39c degrades to log-only
          when unset.
        required: false

# Write-only cluster endpoints for GitHub Actions telemetry. Auth is
# the TELEMETRY_TOKEN bearer declared above; path restriction is
# enforced at the Traefik IngressRoute. 39c wires the actual emit step.
env:
  VM_WRITE_URL: 'https://vm-write.chalupatech.com/api/v1/write'
  VLOGS_WRITE_URL: 'https://vlogs-write.chalupatech.com/insert/jsonline'

concurrency:
  group: >-
    ${{ github.workflow }}-review-${{ github.event_name }}-${{
    github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        # ratchet:actions/create-github-app-token@v2
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf'
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6

      - name: 'Detect workstream'
        id: 'detect_workstream'
        env:
          REPO_NAME: '${{ github.event.repository.name }}'
          PR_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          set -euo pipefail
          WS=""
          CHANGED="$(gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}" --name-only 2>/dev/null || true)"
          case "$REPO_NAME" in
            chalupa-infra)
              if printf '%s\n' "$CHANGED" | grep -qE '^k8s/apps/schwab/(go-paper-trader|watchlists)/'; then
                WS="paper-trading"
              fi
              ;;
          esac
          echo "workstream=$WS" >> "$GITHUB_OUTPUT"
          echo "Detected workstream: ${WS:-<none>}" >&2

      - name: 'Fetch workstream context'
        id: 'fetch_ws_context'
        if: steps.detect_workstream.outputs.workstream != ''
        env:
          WORKSTREAM: '${{ steps.detect_workstream.outputs.workstream }}'
          # Reuses the existing GOPRIVATE credential (org scope
          # Chalupa-Tech/*, read-only by convention). A dedicated
          # brain-read token or GH App is a future hygiene phase —
          # see docs/runbooks/github-token-provisioning.md.
          BRAIN_READ_TOKEN: '${{ secrets.GH_PAT }}'
        run: |-
          set -euo pipefail
          OUT=/tmp/ws_context.md
          : > "$OUT"
          if [ -z "${BRAIN_READ_TOKEN:-}" ]; then
            echo "::warning::BRAIN_READ_TOKEN not set — skipping workstream context injection for workstream=${WORKSTREAM}"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git clone --depth 1 --single-branch --quiet \
              "https://x-access-token:${BRAIN_READ_TOKEN}@github.com/Chalupa-Tech/chalupa-brain.git" \
              /tmp/brain; then
            echo "::warning::chalupa-brain clone failed — skipping workstream context injection"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CTX_DIR="/tmp/brain/workstreams/${WORKSTREAM}"
          if [ ! -d "$CTX_DIR" ]; then
            echo "::warning::workstream directory not found in chalupa-brain: ${WORKSTREAM}"
            rm -rf /tmp/brain
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "# Workstream context: ${WORKSTREAM}"
            echo
            if [ -f "$CTX_DIR/workstream.md" ]; then
              echo "## workstream.md"
              echo
              cat "$CTX_DIR/workstream.md"
              echo
            fi
            if [ -d "$CTX_DIR/briefs" ]; then
              for brief in "$CTX_DIR/briefs/"*.md; do
                [ -f "$brief" ] || continue
                # Skip archived briefs (frontmatter `status: archived`)
                if head -20 "$brief" | grep -qiE '^status:[[:space:]]*archived'; then
                  continue
                fi
                echo "---"
                echo "## brief: $(basename "$brief")"
                echo
                cat "$brief"
                echo
              done
            fi
          } > "$OUT"
          SIZE=$(wc -c <"$OUT")
          echo "Workstream context size: $SIZE bytes" >&2
          if [ "$SIZE" -gt 80000 ]; then
            echo "::warning::Workstream context exceeds 80K soft cap — consider archiving older briefs"
          fi
          rm -rf /tmp/brain
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: 'Compose additional context'
        id: 'compose_context'
        env:
          INBOUND_CONTEXT: '${{ inputs.additional_context }}'
          REPO_NAME: '${{ github.event.repository.name }}'
          WS_CONTEXT_AVAILABLE: '${{ steps.fetch_ws_context.outputs.available }}'
        run: |-
          set -euo pipefail
          ADDENDUM_FILE=".github/commands/addenda/${REPO_NAME}-review.md"
          {
            if [ "${WS_CONTEXT_AVAILABLE:-false}" = "true" ] && [ -f /tmp/ws_context.md ]; then
              cat /tmp/ws_context.md
              echo
            fi
            if [ -f "$ADDENDUM_FILE" ]; then
              cat "$ADDENDUM_FILE"
            fi
            if [ -n "${INBOUND_CONTEXT:-}" ]; then
              echo
              echo "## Per-PR Additional Context"
              echo
              printf -- '%s\n' "$INBOUND_CONTEXT"
            fi
          } > /tmp/composed_context.txt
          {
            echo 'context<<COMPOSED_EOF'
            cat /tmp/composed_context.txt
            echo 'COMPOSED_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "Composed context size: $(wc -c </tmp/composed_context.txt) bytes" >&2

      - name: 'Run Gemini pull request review'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ steps.compose_context.outputs.context }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(echo)",
                  "run_shell_command(grep)",
                  "run_shell_command(head)",
                  "run_shell_command(tail)"
                ]
              }
            }
          prompt: '/gemini-review'
