# scripts/dashboards/ is the source of truth for the paper-trading
# dashboard. Production JSON at
# k8s/apps/schwab/go-paper-trader/files/paper-trading.json is a
# generated artifact. This workflow:
#   1. Compiles the Go module.
#   2. Builds twice and verifies byte-identical output (determinism).
#   3. Re-runs build.sh and asserts no drift between source-rendered
#      output and the committed JSON. A PR that hand-edits the JSON
#      without updating Go sources fails this step; a PR that updates
#      Go sources without re-running build.sh also fails.
name: Validate Dashboards

on:
  pull_request:
    paths:
      - 'scripts/dashboards/**'
      - 'k8s/apps/schwab/go-paper-trader/files/paper-trading.json'
      - '.github/workflows/validate-dashboards.yml'

concurrency:
  group: validate-dashboards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build + determinism check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scripts/dashboards/go.mod
          cache-dependency-path: scripts/dashboards/go.sum

      - name: Compile
        working-directory: scripts/dashboards
        run: |
          go vet ./...
          go build ./...

      - name: Render twice and assert byte-identical output
        working-directory: scripts/dashboards
        run: |
          set -euo pipefail
          go run ./cmd/paper-trader > /tmp/render1.json
          go run ./cmd/paper-trader > /tmp/render2.json
          if ! diff -q /tmp/render1.json /tmp/render2.json; then
            echo "::error::Two consecutive renders produced different JSON. The build is non-deterministic."
            diff -u /tmp/render1.json /tmp/render2.json | head -40
            exit 1
          fi
          echo "Renders are byte-identical ($(wc -l < /tmp/render1.json) lines)."

      - name: Assert no drift between source and rendered JSON
        run: |
          set -euo pipefail
          bash scripts/dashboards/build.sh
          if ! git diff --exit-code k8s/apps/schwab/go-paper-trader/files/paper-trading.json; then
            echo "::error::scripts/dashboards/ source and committed paper-trading.json are out of sync."
            echo "::error::Run \`bash scripts/dashboards/build.sh\` and commit the regenerated JSON."
            exit 1
          fi
          echo "Source and committed JSON are in sync."
