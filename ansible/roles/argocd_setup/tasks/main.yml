---
- name: Check if Helm is installed
  ansible.builtin.command: helm version
  register: argocd_setup_helm_check
  ignore_errors: true
  changed_when: false

- name: Install Helm if missing
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: argocd_setup_helm_check.rc != 0
  changed_when: true

- name: Ensure argocd namespace exists
  ansible.builtin.command: kubectl create namespace argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_setup_ns_create
  failed_when: false
  changed_when: "'created' in argocd_setup_ns_create.stdout"

- name: Ensure cert-manager namespace exists
  ansible.builtin.command: kubectl create namespace cert-manager
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: argocd_setup_cm_ns_create
  failed_when: false
  changed_when: "'created' in argocd_setup_cm_ns_create.stdout"

- name: Create Cloudflare API Key secret for cert-manager
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create secret generic cloudflare-api-key-secret \
      --namespace cert-manager \
      --from-literal=api-key={{ cloudflare_api_key }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  no_log: true
  changed_when: true

- name: Add ArgoCD Helm repository
  ansible.builtin.shell: |
    helm repo add argo https://argoproj.github.io/argo-helm
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Retrieve existing ArgoCD OIDC client ID
  ansible.builtin.include_tasks: get_client_id.yml

- name: Template ArgoCD values
  ansible.builtin.template:
    src: argocd-values.yaml.j2
    dest: /tmp/argocd-values.yaml
    mode: "0644"

- name: Install ArgoCD via Helm
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd
    -f /tmp/argocd-values.yaml
    --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Template ArgoCD Traefik IngressRoute
  ansible.builtin.template:
    src: argocd-ingressroute.yaml
    dest: /tmp/argocd-ingressroute.yaml
    mode: "0644"

- name: Apply ArgoCD Traefik IngressRoute
  ansible.builtin.command: kubectl apply -f /tmp/argocd-ingressroute.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Get repository URL
  ansible.builtin.command: git remote get-url origin # noqa: command-instead-of-module
  delegate_to: localhost
  register: argocd_setup_repo_url_cmd
  become: false
  changed_when: false

- name: Set repository URL fact
  ansible.builtin.set_fact:
    argocd_repo_url: "{{ argocd_setup_repo_url_cmd.stdout }}"

- name: Copy observability CRD bootstrap script
  ansible.builtin.copy:
    src: ../../../../scripts/raspberrypi-k3s/local/observability/bootstrap_observability_crds.sh
    dest: /tmp/bootstrap_observability_crds.sh
    mode: "0755"

- name: Bootstrap observability CRDs
  ansible.builtin.command: /tmp/bootstrap_observability_crds.sh
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Cleanup CRD bootstrap script
  ansible.builtin.file:
    path: /tmp/bootstrap_observability_crds.sh
    state: absent
  when: not ansible_check_mode

- name: Template ApplicationSets
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: core-apps-appset.yaml.j2
      dest: core-apps-appset.yaml
    - src: user-apps-appset.yaml.j2
      dest: user-apps-appset.yaml

- name: Apply ApplicationSets to ArgoCD
  ansible.builtin.command: kubectl apply -f /tmp/{{ item }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop:
    - core-apps-appset.yaml
    - user-apps-appset.yaml
  changed_when: true

- name: Cleanup templated ApplicationSets
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - core-apps-appset.yaml
    - user-apps-appset.yaml
  when: not ansible_check_mode
