# ── AppRole: gitea-provisioner ───────────────────────────────────────────────
- name: Enable AppRole auth method (idempotent)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth/approle"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      type: approle
    status_code: [200, 204, 400]
    validate_certs: false
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Write gitea-provisioner policy
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/policies/acl/gitea-provisioner"
    method: PUT
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      policy: |
        path "secret/data/gitea/*" {
          capabilities = ["read", "create", "update"]
        }
    status_code: [200, 204]
    validate_certs: false
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Create gitea-provisioner AppRole
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/approle/role/gitea-provisioner"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      policies: ["gitea-provisioner"]
      token_ttl: "1h"
      secret_id_ttl: "0"   # never expire (rotated by playbook)
      secret_id_num_uses: 0
    status_code: [200, 204]
    validate_certs: false
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Fetch AppRole role-id
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/approle/role/gitea-provisioner/role-id"
    method: GET
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    validate_certs: false
  register: gitea_setup_bao_role_id_resp
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Generate AppRole secret-id
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/approle/role/gitea-provisioner/secret-id"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body: {}
    validate_certs: false
  register: gitea_setup_bao_secret_id_resp
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Set AppRole credentials as facts (available to docker1)
  ansible.builtin.set_fact:
    gitea_setup_bao_role_id: "{{ gitea_setup_bao_role_id_resp.json.data.role_id }}"
    gitea_setup_bao_secret_id: "{{ gitea_setup_bao_secret_id_resp.json.data.secret_id }}"
  no_log: true
