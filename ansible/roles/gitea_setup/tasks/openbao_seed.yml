---
# Runs on the k3s control node (delegated from docker1).
# Seeds gitea secret paths in OpenBao KV and creates an AppRole so
# docker1 can authenticate without a long-lived root token.

- name: Check for OpenBao init data file on k3s control node
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/openbao_init_data.json
  register: gitea_setup_bao_init_stat
  delegate_to: "{{ k3s_control_node }}"
  become: true

- name: Read OpenBao init data from k3s control node (first boot)
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/openbao_init_data.json
  register: gitea_setup_bao_init_raw
  delegate_to: "{{ k3s_control_node }}"
  become: true
  no_log: true
  when: gitea_setup_bao_init_stat.stat.exists

- name: Set OpenBao root token fact from init file (first boot)
  ansible.builtin.set_fact:
    gitea_setup_bao_root_token: >-
      {{ (gitea_setup_bao_init_raw.content | b64decode | from_json).root_token }}
  no_log: true
  when: gitea_setup_bao_init_stat.stat.exists

- name: Set OpenBao root token fact from Ansible Vault (subsequent runs)
  ansible.builtin.set_fact:
    gitea_setup_bao_root_token: "{{ openbao_root_token }}"
  no_log: true
  when: not gitea_setup_bao_init_stat.stat.exists

- name: Enable KV v2 secrets engine (idempotent)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/mounts/secret"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204, 400]  # 400 = already mounted
    validate_certs: false
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

# ── Seed gitea/db ────────────────────────────────────────────────────────────
- name: Check if gitea/db secret already exists
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/db"
    method: GET
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: gitea_setup_bao_db_check
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Seed gitea/db password (first-time only)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/db"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      data:
        password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    status_code: [200, 204]
    validate_certs: false
  when: gitea_setup_bao_db_check.status == 404
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

# ── Seed gitea/admin ─────────────────────────────────────────────────────────
- name: Check if gitea/admin secret already exists
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/admin"
    method: GET
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: gitea_setup_bao_admin_check
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

- name: Seed gitea/admin password (first-time only)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/admin"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_root_token }}"
    body_format: json
    body:
      data:
        password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
    status_code: [200, 204]
    validate_certs: false
  when: >
    gitea_setup_bao_admin_check.status == 404 or
    (gitea_setup_bao_admin_check.status == 200 and
     gitea_setup_bao_admin_check.json.data.data.get('password', '') == '')
  delegate_to: "{{ k3s_control_node }}"
  no_log: true

