---
# Runs after Gitea is booted. Uses Gitea CLI and REST API to:
#   - Create the gitea-admin user (idempotent, password from Ansible Vault)
#   - Create ci-deploy and ci-read service accounts
#   - Create organizations for container registry (list-driven)
#   - Generate API tokens for each CI account
#   - Store tokens back to OpenBao
#   - Register OpenBao as OIDC authentication provider (idempotent)

# ── Admin user ────────────────────────────────────────────────────────────────
- name: Wait for Gitea to finish initialization
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/version"
    status_code: 200
    validate_certs: false
  register: gitea_init_ready
  retries: 30
  delay: 5
  until: gitea_init_ready.status == 200

- name: Check if gitea-admin user already exists
  ansible.builtin.command: >
    docker exec -u git gitea
    gitea admin user list --admin
  register: gitea_admin_list
  changed_when: false
  no_log: false

- name: Create Gitea admin user (first-time only)
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user create
    --username gitea-admin
    --email admin@gitea.local
    --password {{ gitea_admin_password }}
    --admin
    --must-change-password=false
  when: "'gitea-admin' not in gitea_admin_list.stdout"
  changed_when: true
  no_log: true

- name: Sync gitea-admin password and clear must-change flag
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user change-password
    --username gitea-admin
    --password {{ gitea_admin_password }}
    --must-change-password=false
  no_log: true
  changed_when: true

- name: Ensure gitea-admin must-change-password flag is cleared
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user must-change-password
    --unset gitea-admin
  changed_when: true

# ── ci-deploy user ────────────────────────────────────────────────────────────
# REST API user creation is blocked by DISABLE_REGISTRATION even with admin auth.
# Use the Gitea CLI inside the container instead (bypasses the setting).
- name: Check if ci-deploy user exists
  ansible.builtin.command: docker exec -u git gitea gitea admin user list
  register: gitea_all_users
  changed_when: false

- name: Create ci-deploy service account via CLI
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user create
    --username ci-deploy
    --email ci-deploy@gitea.local
    --password {{ gitea_ci_deploy_password }}
    --must-change-password=false
  when: "'ci-deploy' not in gitea_all_users.stdout"
  changed_when: true
  no_log: true

# ── ci-read user ──────────────────────────────────────────────────────────────
- name: Create ci-read service account via CLI
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user create
    --username ci-read
    --email ci-read@gitea.local
    --password {{ gitea_ci_read_password }}
    --must-change-password=false
  when: "'ci-read' not in gitea_all_users.stdout"
  changed_when: true
  no_log: true

# ── Orphan token cleanup ────────────────────────────────────────────────────
# Manually created tokens from debugging sessions. DELETE is idempotent (204/404).
- name: Remove orphaned tokens
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/users/{{ item.user }}/tokens/{{ item.token }}"
    method: DELETE
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    return_content: false
    status_code: [204, 404, 422]
    validate_certs: false
  loop:
    - {user: ci-deploy, token: ci-deploy-registry}
    - {user: ci-read, token: ci-read-registry}
  loop_control:
    label: "{{ item.user }}/{{ item.token }}"
  no_log: true

# ── Organizations ────────────────────────────────────────────────────────────
# Create orgs and add service accounts as members so they can push container
# images to gitea.tailbecff0.ts.net/<org>/<image>.
- name: Check if organization exists
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/orgs/{{ item.name }}"
    method: GET
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    return_content: false
    status_code: [200, 404]
    validate_certs: false
  register: org_check
  loop: "{{ gitea_organizations }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create organization
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/orgs"
    method: POST
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    return_content: false
    body_format: json
    body:
      username: "{{ item.item.name }}"
      description: "{{ item.item.description | default('') }}"
      visibility: "private"
    status_code: [201]
    validate_certs: false
  when: item.status == 404
  loop: "{{ org_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Gitea manages org membership through teams, not direct member endpoints.
# Every org has a default "Owners" team. We look up its ID, then add members.
# Ref: https://gitea.com/api/swagger#/organization/orgListTeams
- name: Get Owners team for organization
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/orgs/{{ item.name }}/teams"
    method: GET
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    return_content: true
    status_code: [200]
    validate_certs: false
  register: org_teams
  loop: "{{ gitea_organizations }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build org-to-team-id mapping
  ansible.builtin.set_fact:
    org_owner_team_ids: >-
      {{ org_owner_team_ids | default({}) | combine({
        item.item.name: (item.json | selectattr('name', 'equalto', 'Owners') | first).id
      }) }}
  loop: "{{ org_teams.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Add members to organization teams
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/teams/{{ org_owner_team_ids[item.0.name] }}/members/{{ item.1 }}"
    method: PUT
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    return_content: false
    status_code: [204, 404]
    validate_certs: false
  register: team_member_result
  loop: "{{ gitea_organizations | subelements('members') }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1 }}"
  no_log: true

- name: Warn about users not yet in Gitea
  ansible.builtin.debug:
    msg: "User '{{ item.item.1 }}' not found in Gitea — they need to log in via OIDC first"
  loop: "{{ team_member_result.results }}"
  loop_control:
    label: "{{ item.item.1 }}"
  when: item.status == 404

# ── API tokens ────────────────────────────────────────────────────────────────
# Idempotent token management: check OpenBao first, rotate if missing.
# The Gitea CLI can create tokens but not delete them, so we use the REST API
# (with admin basic auth) to delete stale tokens before regenerating.
# Looped over gitea_service_accounts (defined in defaults/main.yml).

- name: Ensure Gitea service account tokens are in OpenBao
  ansible.builtin.include_tasks: rotate_token.yml
  loop: "{{ gitea_service_accounts }}"
  loop_control:
    loop_var: svc_account
# ── OpenBao OIDC authentication source ───────────────────────────────────────
- name: Check if OpenBao OAuth2 auth source exists in Gitea
  ansible.builtin.command: docker exec -u git gitea gitea admin auth list
  register: gitea_auth_list
  changed_when: false

- name: Register OpenBao as OIDC login provider in Gitea
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin auth add-oauth
    --name "OpenBao"
    --provider openidConnect
    --key "{{ gitea_oidc_client_id }}"
    --secret "{{ gitea_oidc_client_secret }}"
    --auto-discover-url "https://pi-k3s.chalupatech.com/v1/identity/oidc/provider/default/.well-known/openid-configuration"
    --scopes "openid user"
  when: "'OpenBao' not in gitea_auth_list.stdout"
  changed_when: true
  no_log: true
