---
# Runs after Gitea is booted. Uses Gitea CLI and REST API to:
#   - Create the gitea-admin user (idempotent, password from Ansible Vault)
#   - Create ci-deploy and ci-read service accounts
#   - Generate API tokens for each CI account
#   - Store tokens back to OpenBao
#   - Register OpenBao as OIDC authentication provider (idempotent)

# ── Admin user ────────────────────────────────────────────────────────────────
- name: Wait for Gitea to finish initialization
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/version"
    status_code: 200
    validate_certs: false
  register: gitea_init_ready
  retries: 30
  delay: 5
  until: gitea_init_ready.status == 200

- name: Check if gitea-admin user already exists
  ansible.builtin.command: >
    docker exec -u git gitea
    gitea admin user list --admin
  register: gitea_admin_list
  changed_when: false
  no_log: false

- name: Create Gitea admin user (first-time only)
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin user create
    --username gitea-admin
    --email admin@gitea.local
    --password {{ gitea_admin_password }}
    --admin
    --must-change-password=false
  when: "'gitea-admin' not in gitea_admin_list.stdout"
  no_log: true

# ── ci-deploy user ────────────────────────────────────────────────────────────
- name: Create ci-deploy service account via Gitea REST API
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/admin/users"
    method: POST
    force_basic_auth: true
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    body_format: json
    body:
      email: "ci-deploy@gitea.local"
      full_name: "CI Deploy"
      login_name: "ci-deploy"
      must_change_password: false
      password: "{{ gitea_ci_deploy_password }}"
      send_notify: false
      source_id: 0
      username: "ci-deploy"
      visibility: "private"
    status_code: [201, 422]  # 422 = user already exists
    validate_certs: false
  no_log: true

# ── ci-read user ──────────────────────────────────────────────────────────────
- name: Create ci-read service account via Gitea REST API
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/admin/users"
    method: POST
    force_basic_auth: true
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    body_format: json
    body:
      email: "ci-read@gitea.local"
      full_name: "CI Read"
      login_name: "ci-read"
      must_change_password: false
      password: "{{ gitea_ci_read_password }}"
      send_notify: false
      source_id: 0
      username: "ci-read"
      visibility: "private"
    status_code: [201, 422]
    validate_certs: false
  no_log: true

# ── API tokens ────────────────────────────────────────────────────────────────
- name: Check if ci-deploy API token exists
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/users/ci-deploy/tokens"
    method: GET
    force_basic_auth: true
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    headers:
      Sudo: "ci-deploy"
    status_code: 200
  register: existing_ci_deploy_tokens
  no_log: true

- name: Check if ci-read API token exists
  ansible.builtin.uri:
    url: "http://localhost:{{ gitea_http_port }}/api/v1/users/ci-read/tokens"
    method: GET
    force_basic_auth: true
    user: gitea-admin
    password: "{{ gitea_admin_password }}"
    headers:
      Sudo: "ci-read"
    status_code: 200
  register: existing_ci_read_tokens
  no_log: true

- name: Generate API token for ci-deploy via CLI
  ansible.builtin.shell: >
    docker exec -u git gitea gitea admin user generate-access-token
    --username ci-deploy --token-name ci-deploy-token
  register: cli_deploy_token_raw
  when: >
    "ci-deploy-token" not in (existing_ci_deploy_tokens.json | map(attribute='name') | list)
  no_log: true

- name: Extract ci-deploy token
  ansible.builtin.set_fact:
    gitea_ci_deploy_token_val: "{{ cli_deploy_token_raw.stdout | regex_search('.*: (.*)', '\\1') | first | default('') }}"
  when: cli_deploy_token_raw is not skipped
  no_log: true

- name: Generate API token for ci-read via CLI
  ansible.builtin.shell: >
    docker exec -u git gitea gitea admin user generate-access-token
    --username ci-read --token-name ci-read-token
  register: cli_read_token_raw
  when: >
    "ci-read-token" not in (existing_ci_read_tokens.json | map(attribute='name') | list)
  no_log: true

- name: Extract ci-read token
  ansible.builtin.set_fact:
    gitea_ci_read_token_val: "{{ cli_read_token_raw.stdout | regex_search('.*: (.*)', '\\1') | first | default('') }}"
  when: cli_read_token_raw is not skipped
  no_log: true

# Store tokens only when freshly created
- name: Store ci-deploy API token to OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/ci-deploy-token"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_login.json.auth.client_token }}"
    body_format: json
    body:
      data:
        token: "{{ gitea_ci_deploy_token_val }}"
    status_code: [200, 204]
    validate_certs: false
  when: cli_deploy_token_raw is not skipped and cli_deploy_token_raw.rc == 0
  no_log: true

- name: Store ci-read API token to OpenBao
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/secret/data/gitea/ci-read-token"
    method: POST
    headers:
      X-Vault-Token: "{{ gitea_setup_bao_login.json.auth.client_token }}"
    body_format: json
    body:
      data:
        token: "{{ gitea_ci_read_token_val }}"
    status_code: [200, 204]
    validate_certs: false
  when: cli_read_token_raw is not skipped and cli_read_token_raw.rc == 0
  no_log: true
# ── OpenBao OIDC authentication source ───────────────────────────────────────
- name: Check if OpenBao OAuth2 auth source exists in Gitea
  ansible.builtin.command: docker exec -u git gitea gitea admin auth list
  register: gitea_auth_list
  changed_when: false

- name: Register OpenBao as OIDC login provider in Gitea
  ansible.builtin.command: >
    docker exec -u git gitea gitea admin auth add-oauth
    --name "OpenBao"
    --provider openidConnect
    --key "{{ gitea_oidc_client_id }}"
    --secret "{{ gitea_oidc_client_secret }}"
    --auto-discover-url "https://pi-k3s.chalupatech.com/v1/identity/oidc/provider/default/.well-known/openid-configuration"
    --scopes "openid user"
  when: "'OpenBao' not in gitea_auth_list.stdout"
  no_log: true
