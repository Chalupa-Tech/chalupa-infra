---
# Data root on the host for all Gitea-related volumes
gitea_data_dir: /opt/gitea

# Internal HTTP port Gitea listens on (also published on host)
gitea_http_port: 3000

# SSH port for Gitea's built-in SSH server
gitea_ssh_port: 2222

# Docker network name shared by all containers
gitea_docker_network: infra_network

# Gitea app name shown in the UI
gitea_app_name: "Chalupa Gitea Registry"

# Organizations provisioned in Gitea's container registry.
# Each org gets created via REST API with admin auth, and listed
# members are added to the Owners team. Add a line to add a member.
gitea_organizations:
  - name: chalupa-tech
    description: "Chalupa Tech container images"
    members:
      - ci-deploy
      - ci-read
      - ddowell
      - tbigelow

# Service accounts with API tokens managed in OpenBao.
# Adding a new entry here auto-provisions the token on next playbook run.
gitea_service_accounts:
  - username: ci-deploy
    token_name: ci-deploy-token
    vault_path: gitea/ci-deploy-token
  - username: ci-read
    token_name: ci-read-token
    vault_path: gitea/ci-read-token
