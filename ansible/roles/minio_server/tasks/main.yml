---
# Configures MinIO S3-compatible object storage on fw1.
# Manages: NAS mount (fstab), MinIO environment, service restart.
# MinIO binary assumed pre-installed.

- name: Ensure NAS mountpoint exists
  ansible.builtin.file:
    path: "{{ minio_nas_mountpoint }}"
    state: directory
    mode: "0755"

- name: Configure NAS mount in fstab
  ansible.posix.mount:
    path: "{{ minio_nas_mountpoint }}"
    src: "{{ minio_nas_source }}"
    fstype: "{{ minio_nas_fstype }}"
    opts: "{{ minio_nas_opts }}"
    state: mounted

- name: Write MinIO environment file
  ansible.builtin.template:
    src: minio-env.j2
    dest: /etc/default/minio
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart minio

- name: Ensure MinIO service is enabled and running
  ansible.builtin.systemd:
    name: minio
    state: started
    enabled: true

- name: Restart MinIO now if its environment changed
  ansible.builtin.meta: flush_handlers

- name: Wait for the MinIO API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ minio_api_port }}"
    timeout: 60

- name: Configure buckets and scoped users
  ansible.builtin.include_tasks: access.yml
  tags: [minio, minio-access]
