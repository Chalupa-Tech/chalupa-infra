---
# Manages /etc/rancher/k3s/config.yaml and ensures the systemd unit is clean
# (no stale CLI flags that would override config.yaml).

- name: Detect Tailscale IP (fallback when k3s_node_ip not set)
  ansible.builtin.command: tailscale ip -4
  register: k3s_config_ts_ip
  changed_when: false
  when: k3s_node_ip is not defined or k3s_node_ip == ''

- name: Set node IP fact (Tailscale fallback)
  ansible.builtin.set_fact:
    k3s_node_ip: "{{ k3s_config_ts_ip.stdout | trim }}"
  when: k3s_node_ip is not defined or k3s_node_ip == ''

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template stable resolv.conf for CoreDNS upstream
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/rancher/k3s/resolv.conf
    owner: root
    group: root
    mode: "0644"

- name: Template K3s config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: k3s_config_changed

- name: Disable rp_filter for flannel-wg (prevents cross-node pod traffic drops)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "0"
    sysctl_file: /etc/sysctl.d/90-flannel-wg.conf
    reload: true
  loop:
    - net.ipv4.conf.all.rp_filter
    - net.ipv4.conf.default.rp_filter

- name: Clear Tailscale subnet route advertisements (prevents pod CIDR hijacking)
  ansible.builtin.command: tailscale set --advertise-routes=
  changed_when: false

- name: Check current systemd unit for stale CLI flags
  ansible.builtin.shell: >
    grep -cE '\-\-flannel-iface|\-\-flannel-backend|\-\-node-ip|\-\-node-external-ip|\-\-node-label|\-\-node-taint|\-\-disable-network-policy|\-\-tls-san|\-\-cluster-init'
    /etc/systemd/system/{{ k3s_service_name }}.service || true
  register: k3s_stale_flags
  changed_when: false

- name: Refresh systemd unit to remove stale CLI flags
  when: k3s_stale_flags.stdout | int > 0
  block:
    - name: Determine K3s exec command
      ansible.builtin.set_fact:
        k3s_exec_role: >-
          {{ 'server' if k3s_install_role in ['server', 'ha-server'] else 'agent' }}

    - name: Re-run K3s installer (config-only, no download, no start)
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io | sh -s - {{ k3s_exec_role }}
      environment: >-
        {{
          {'INSTALL_K3S_SKIP_DOWNLOAD': 'true',
           'INSTALL_K3S_SKIP_START': 'true',
           'K3S_TOKEN': k3s_token}
          | combine(
              {'K3S_URL': 'https://' + k3s_server_url + ':6443'}
              if k3s_install_role != 'server' else {}
            )
        }}
      register: k3s_installer_refresh

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true
