---
# etcd snapshot S3 offload (platform phase-94).
# Each server snapshots every 12h and keeps 14 locally and 14 in MinIO
# (k3s prunes both), so each node holds 7 days. A snapshot is ~120 MB.
# The MinIO user can read and write the etcd-snapshots bucket only; it and
# the bucket are created by the minio_server role (playbooks/minio.yml).
k3s_etcd_snapshot_enabled: true
k3s_etcd_snapshot_schedule: "0 */12 * * *"
k3s_etcd_snapshot_retention: 14
k3s_etcd_s3_endpoint: "192.168.2.51:9000"
k3s_etcd_s3_bucket: "etcd-snapshots"
k3s_etcd_s3_access_key: "{{ minio_etcd_access_key }}"
k3s_etcd_s3_secret_key: "{{ minio_etcd_secret_key }}"
k3s_etcd_s3_insecure: true
