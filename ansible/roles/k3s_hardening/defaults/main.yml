---
# etcd snapshot S3 offload
k3s_etcd_snapshot_enabled: true
k3s_etcd_snapshot_schedule: "0 */6 * * *"
k3s_etcd_snapshot_retention: 10
k3s_etcd_s3_endpoint: "192.168.2.51:9000"
k3s_etcd_s3_bucket: "etcd-snapshots"
k3s_etcd_s3_access_key: "{{ minio_access_key }}"
k3s_etcd_s3_secret_key: "{{ minio_secret_key }}"
k3s_etcd_s3_insecure: true
