---
- name: Check if K3s is already installed and running
  ansible.builtin.systemd:
    name: k3s{{ (k3s_install_role in ['agent', 'ha-server']) | ternary('-' + k3s_install_role, '') }}
  register: k3s_service_state
  failed_when: false
  changed_when: false

- name: Copy K3s install script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../remote/install.sh"
    dest: /tmp/install.sh
    mode: "0755"
  when: k3s_service_state.status.ActiveState | default('inactive') != 'active'

- name: Run K3s installation
  ansible.builtin.shell: >
    /tmp/install.sh
    {{ (k3s_install_role == 'ha-server') | ternary('server', k3s_install_role) }}
    {{ k3s_install_server_ip | default('') }}
  environment:
    TS_AUTHKEY: "{{ ts_authkey }}"
    K3S_TOKEN: "{{ k3s_install_token | default('') }}"
    TS_SERVICE_NAME: "{{ ts_service_name | default('svc:chalupa-k3s') }}"
  args:
    executable: /bin/bash
  register: k3s_install_result
  changed_when: true
  when: k3s_service_state.status.ActiveState | default('inactive') != 'active'

- name: Display K3s installation output
  ansible.builtin.debug:
    var: k3s_install_result.stdout_lines
  when: k3s_install_result is not skipped

- name: Remove install script
  ansible.builtin.file:
    path: /tmp/install.sh
    state: absent
