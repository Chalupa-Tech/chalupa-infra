---
- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed_version
  changed_when: false
  when: k3s_binary.stat.exists

- name: Parse installed K3s version string
  ansible.builtin.set_fact:
    k3s_current_version: "{{ k3s_installed_version.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"
  when: k3s_binary.stat.exists

- name: Determine if install is needed
  ansible.builtin.set_fact:
    k3s_install_needed: "{{ not k3s_binary.stat.exists or (k3s_current_version != k3s_version) }}"

- name: Skip install — version matches
  ansible.builtin.debug:
    msg: "K3s {{ k3s_version }} already installed — skipping."
  when: not k3s_install_needed

- name: Version mismatch detected
  ansible.builtin.debug:
    msg: "K3s version mismatch: installed={{ k3s_current_version | default('none') }}, expected={{ k3s_version }}. Proceeding with install."
  when: k3s_install_needed and k3s_binary.stat.exists

- name: Copy K3s install script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../remote/install.sh"
    dest: /tmp/install.sh
    mode: "0755"
  when: k3s_install_needed

- name: Run K3s installation
  ansible.builtin.shell: >
    /tmp/install.sh
    {{ (k3s_install_role == 'ha-server') | ternary('server', k3s_install_role) }}
    {{ k3s_install_server_ip | default('') }}
  environment:
    TS_AUTHKEY: "{{ ts_authkey }}"
    K3S_TOKEN: "{{ k3s_install_token | default('') }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    executable: /bin/bash
  register: k3s_install_result
  changed_when: true
  when: k3s_install_needed

- name: Display K3s installation output
  ansible.builtin.debug:
    var: k3s_install_result.stdout_lines
  when: k3s_install_result is not skipped

- name: Remove install script
  ansible.builtin.file:
    path: /tmp/install.sh
    state: absent
  when: k3s_install_needed
