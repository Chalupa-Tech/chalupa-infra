---
- name: Copy K3s install script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../remote/install.sh"
    dest: /tmp/install.sh
    mode: "0755"

- name: Run K3s installation
  ansible.builtin.shell: >
    /tmp/install.sh
    {{ (k3s_install_role == 'ha-server') | ternary('server', k3s_install_role) }}
    {{ k3s_install_server_ip | default('') }}
  environment:
    TS_AUTHKEY: "{{ ts_authkey }}"
    K3S_TOKEN: "{{ k3s_install_token | default('') }}"
  args:
    executable: /bin/bash
  register: k3s_install_result
  changed_when: true

- name: Display K3s installation output
  ansible.builtin.debug:
    var: k3s_install_result.stdout_lines

- name: Remove install script
  ansible.builtin.file:
    path: /tmp/install.sh
    state: absent
