---
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true

- name: Template WireGuard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart wg-quick

- name: Enable and start wg-quick service
  ansible.builtin.systemd:
    name: "wg-quick@{{ wg_interface }}"
    state: started
    enabled: true

- name: Ensure iptables-persistent is installed (OCI)
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  when: "'k3s_oci_servers' in group_names"

- name: Remove OCI default REJECT rules (VCN security list is the perimeter)
  ansible.builtin.iptables:
    chain: "{{ item }}"
    jump: REJECT
    reject_with: icmp-host-prohibited
    state: absent
  loop:
    - INPUT
    - FORWARD
  when: "'k3s_oci_servers' in group_names"
  notify: Save iptables
