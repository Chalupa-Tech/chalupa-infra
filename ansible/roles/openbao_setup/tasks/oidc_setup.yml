---
# Sets up OIDC clients in OpenBao for Grafana, ArgoCD, and Gitea.
# Each operation is a discrete, idempotent Ansible task — no shell script pipelines,
# no stdout parsing. If a run fails mid-way, re-running picks up cleanly.
#
# Structure:
#   1. Create OIDC key + assignment + client for each service (idempotent writes)
#   2. Read back client_id / client_secret via URI tasks
#   3. Update the OIDC provider's allowed_client_ids
#   4. Write K8s Secrets / patch ArgoCD config as separate clean tasks

# ── Ensure observability namespace exists ─────────────────────────────────────
- name: Ensure observability namespace exists
  ansible.builtin.command: kubectl create namespace observability
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_obs_ns_create
  failed_when: false
  changed_when: "'created' in openbao_setup_obs_ns_create.stdout"

# ── Get userpass accessor (needed for entity aliases) ─────────────────────────
- name: Get userpass auth accessor
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth/userpass"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    validate_certs: false
  register: openbao_setup_userpass_auth
  no_log: true

- name: Set userpass accessor fact
  ansible.builtin.set_fact:
    openbao_setup_userpass_accessor: "{{ openbao_setup_userpass_auth.json.accessor }}"
  no_log: true

# ── Create/Update OIDC scope (shared, multi-tenant) ─────────────────────────
- name: Upsert OIDC user scope (preferred_username, email, groups)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/scope/user"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      template: "{{ openbao_oidc_user_scope_template }}"
      description: "User scope — preferred_username, email, groups (multi-tenant)"
    status_code: [200, 204]
    validate_certs: false
  no_log: true
  # Note: no failed_when: false — we want to know if scope update fails

# ── Create/update entities and aliases for managed users ──────────────────────
# Entity metadata.email is required by the OIDC user scope template:
#   {{identity.entity.metadata.email}} → "user@domain.com" (auto-JSON-quoted)
- name: Upsert identity entity with email metadata for each managed user
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/entity/name/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      name: "{{ item.name }}"
      metadata:
        email: "{{ item.email }}"
      policies:
        - "user-{{ item.name }}-policy"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ managed_users }}"
  register: openbao_setup_entities
  no_log: true

- name: Read entity IDs for managed users
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/entity/name/{{ item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    status_code: 200
    validate_certs: false
  loop: "{{ managed_users }}"
  register: openbao_setup_entity_reads
  no_log: true

- name: Create entity aliases (userpass → entity)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/entity-alias"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      name: "{{ item.item.name }}"
      canonical_id: "{{ item.json.data.id }}"
      mount_accessor: "{{ openbao_setup_userpass_accessor }}"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ openbao_setup_entity_reads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
  failed_when: false  # Alias may already exist

- name: Set entity IDs fact (for assignments)
  ansible.builtin.set_fact:
    openbao_setup_entity_ids: >-
      {{ openbao_setup_entity_reads.results | map(attribute='json.data.id') | list | join(',') }}
  no_log: true

# ── Helper macro: create OIDC key, assignment, and client ─────────────────────
# We loop over each service definition
- name: Create OIDC keys
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/key/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      allowed_client_ids: ["*"]
      rotation_period: "24h"
      verification_ttl: "24h"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ openbao_oidc_clients }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create OIDC assignments
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/assignment/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      entity_ids: "{{ openbao_setup_entity_ids.split(',') }}"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ openbao_oidc_clients }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create OIDC clients
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/client/{{ item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      key: "{{ item.name }}"
      redirect_uris: "{{ item.redirect_uris }}"
      assignments: ["{{ item.name }}"]
      id_token_ttl: "24h"
      access_token_ttl: "24h"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ openbao_oidc_clients }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# ── Read back client IDs and secrets ─────────────────────────────────────────
- name: Read OIDC client credentials
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/client/{{ item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    status_code: 200
    validate_certs: false
  loop: "{{ openbao_oidc_clients }}"
  loop_control:
    label: "{{ item.name }}"
  register: openbao_setup_client_reads
  no_log: true

- name: Set OIDC client credential facts
  ansible.builtin.set_fact:
    openbao_oidc_creds: >-
      {{
        openbao_oidc_creds | default({}) | combine({
          item.item.name: {
            'client_id': item.json.data.client_id,
            'client_secret': item.json.data.client_secret
          }
        })
      }}
  loop: "{{ openbao_setup_client_reads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true

# ── Update OIDC provider allowed_client_ids ───────────────────────────────────
- name: Update OIDC provider with all client IDs
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/oidc/provider/default"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      allowed_client_ids: >-
        {{ openbao_oidc_creds.values() | map(attribute='client_id') | list }}
      issuer_host: "https://openbao.chalupatech.com"
      scopes_supported: ["user"]
    status_code: [200, 204]
    validate_certs: false
  no_log: true

# ── Write K8s Secret for Grafana ──────────────────────────────────────────────
- name: Write Grafana OIDC K8s Secret
  ansible.builtin.command: >
    kubectl create secret generic grafana-oidc-secret
    -n observability
    --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_ID={{ openbao_oidc_creds.grafana.client_id }}
    --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET={{ openbao_oidc_creds.grafana.client_secret }}
    --dry-run=client -o yaml
  register: openbao_setup_grafana_secret_yaml
  changed_when: false
  no_log: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply Grafana OIDC K8s Secret
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ openbao_setup_grafana_secret_yaml.stdout }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── Patch ArgoCD secret and ConfigMap ─────────────────────────────────────────
- name: Patch ArgoCD secret with OIDC credentials
  ansible.builtin.command: >
    kubectl patch secret argocd-secret -n argocd --type merge
    -p={{ argocd_oidc_patch | to_json | quote }}
  vars:
    argocd_oidc_patch:
      data:
        oidc.openbao.clientID: "{{ openbao_oidc_creds.argocd.client_id | b64encode }}"
        oidc.openbao.clientSecret: "{{ openbao_oidc_creds.argocd.client_secret | b64encode }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  no_log: true
  changed_when: true

- name: Patch ArgoCD ConfigMap with OIDC config
  ansible.builtin.command: >
    kubectl patch cm argocd-cm -n argocd --type merge
    -p={{ argocd_cm_patch | to_json | quote }}
  vars:
    argocd_cm_patch:
      data:
        oidc.config: |
          name: OpenBao
          issuer: https://openbao.chalupatech.com/v1/identity/oidc/provider/default
          clientID: {{ openbao_oidc_creds.argocd.client_id }}
          clientSecret: $oidc.openbao.clientSecret
          requestedScopes: ["openid", "user"]
          requestedIDTokenClaims: {"preferred_username": {"essential": true}, "email": {"essential": true}}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  no_log: true
  changed_when: true

- name: Restart ArgoCD server to pick up OIDC config
  ansible.builtin.command: kubectl rollout restart deploy/argocd-server -n argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── Write K8s Secret for Gitea ────────────────────────────────────────────────
- name: Write Gitea OIDC K8s Secret
  ansible.builtin.command: >
    kubectl create secret generic gitea-oidc-secret
    -n openbao
    --from-literal=client_id={{ openbao_oidc_creds.gitea.client_id }}
    --from-literal=client_secret={{ openbao_oidc_creds.gitea.client_secret }}
    --dry-run=client -o yaml
  register: openbao_setup_gitea_secret_yaml
  changed_when: false
  no_log: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Apply Gitea OIDC K8s Secret
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ openbao_setup_gitea_secret_yaml.stdout }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

# ── Enable and configure OIDC auth method for CLI self-service ─────────────
# Allows `bao login -method=oidc` — OpenBao authenticates against its own
# OIDC provider. Users with an active browser session get seamless CLI login.

- name: Enable OIDC auth method
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth/oidc"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      type: oidc
    status_code: [200, 204]
    validate_certs: false
  failed_when: false  # May already be enabled
  no_log: true

- name: Configure OIDC auth method (self-referencing provider)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/oidc/config"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      oidc_discovery_url: "{{ openbao_url }}/v1/identity/oidc/provider/default"
      oidc_client_id: "{{ openbao_oidc_creds.cli.client_id }}"
      oidc_client_secret: "{{ openbao_oidc_creds.cli.client_secret }}"
      default_role: "default"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

- name: Create default OIDC auth role
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/oidc/role/default"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      user_claim: "preferred_username"
      oidc_scopes: ["openid", "user"]
      allowed_redirect_uris: ["http://localhost:8250/oidc/callback"]
      token_policies: ["default"]
      token_ttl: "24h"
      token_max_ttl: "24h"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

# ── Create OIDC entity aliases so CLI tokens map to existing entities ──────
- name: Get OIDC auth accessor
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/auth/oidc"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    validate_certs: false
  register: openbao_setup_oidc_auth
  no_log: true

- name: Set OIDC accessor fact
  ansible.builtin.set_fact:
    openbao_setup_oidc_accessor: "{{ openbao_setup_oidc_auth.json.accessor }}"
  no_log: true

- name: Create OIDC entity aliases (oidc auth → existing entity)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/identity/entity-alias"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      name: "{{ item.item.name }}"
      canonical_id: "{{ item.json.data.id }}"
      mount_accessor: "{{ openbao_setup_oidc_accessor }}"
    status_code: [200, 204]
    validate_certs: false
  loop: "{{ openbao_setup_entity_reads.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
  failed_when: false  # Alias may already exist
