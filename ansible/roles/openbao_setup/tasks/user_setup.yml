---
- name: Ensure K8s namespace exists for {{ user_item.name }}
  ansible.builtin.command: kubectl create namespace {{ user_item.name }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_ns_create
  failed_when: false
  changed_when: "'created' in openbao_setup_ns_create.stdout"

- name: Ensure K8s test namespace exists for {{ user_item.name }}
  ansible.builtin.command: kubectl create namespace {{ user_item.name }}_test
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_test_ns_create
  failed_when: false
  changed_when: "'created' in openbao_setup_test_ns_create.stdout"

- name: Ensure ServiceAccount exists for {{ user_item.name }}
  ansible.builtin.command: >
    kubectl create serviceaccount {{ user_item.name }}-sa -n {{ user_item.name }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_sa_create
  failed_when: false
  changed_when: "'created' in openbao_setup_sa_create.stdout"

- name: Ensure test ServiceAccount exists for {{ user_item.name }}
  ansible.builtin.command: >
    kubectl create serviceaccount {{ user_item.name }}-test-sa -n {{ user_item.name }}_test
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_test_sa_create
  failed_when: false
  changed_when: "'created' in openbao_setup_test_sa_create.stdout"

# ── Policies (via URI — no shell escaping) ─────────────────────────────────
- name: Write user policy for {{ user_item.name }}
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/policies/acl/user-{{ user_item.name }}-policy"
    method: PUT
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      policy: "{{ lookup('template', 'policy-user.hcl.j2') }}"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

- name: Write SA policy for {{ user_item.name }}
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/policies/acl/user-{{ user_item.name }}-sa-policy"
    method: PUT
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      policy: "{{ lookup('template', 'policy-user-sa.hcl.j2') }}"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

- name: Write tailscale-operator policy for {{ user_item.name }}
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/sys/policies/acl/user-{{ user_item.name }}-tailscale-operator-policy"
    method: PUT
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      policy: "{{ lookup('template', 'policy-user-tailscale.hcl.j2') }}"
    status_code: [200, 204]
    validate_certs: false
  no_log: true

# ── Userpass account (shell only for initial password — no heredoc needed) ──
- name: Check if userpass account exists for {{ user_item.name }}
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/userpass/users/{{ user_item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    status_code: [200, 404]
    validate_certs: false
  register: openbao_userpass_check
  no_log: true

- name: Create userpass account for {{ user_item.name }} (first run only)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/userpass/users/{{ user_item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      password: "OpenBao123!"
      token_policies: ["user-{{ user_item.name }}-policy"]
    status_code: [200, 204]
    validate_certs: false
  when: openbao_userpass_check.status == 404
  no_log: true

- name: Sync userpass account policies for {{ user_item.name }} (idempotent)
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/userpass/users/{{ user_item.name }}"
    method: POST
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    body_format: json
    body:
      token_policies: ["user-{{ user_item.name }}-policy"]
    status_code: [200, 204]
    validate_certs: false
  when: openbao_userpass_check.status == 200
  no_log: true

# ── Kubernetes auth roles (simple shell — single-line, no heredoc) ──────────
- name: Write Kubernetes auth roles for {{ user_item.name }}
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    BAO_TOKEN={{ openbao_setup_root_token }}

    kubectl exec -n openbao openbao-0 -- sh -c "
      BAO_TOKEN={{ openbao_setup_root_token }} bao write auth/kubernetes/role/{{ user_item.name }}-role \
        bound_service_account_names={{ user_item.name }}-sa \
        bound_service_account_namespaces={{ user_item.name }} \
        policies=user-{{ user_item.name }}-sa-policy \
        ttl=1h

      BAO_TOKEN={{ openbao_setup_root_token }} bao write auth/kubernetes/role/{{ user_item.name }}-test-role \
        bound_service_account_names={{ user_item.name }}-test-sa \
        bound_service_account_namespaces={{ user_item.name }}_test \
        policies=user-{{ user_item.name }}-sa-policy \
        ttl=1h

      BAO_TOKEN={{ openbao_setup_root_token }} bao write auth/kubernetes/role/{{ user_item.name }}-external-secrets-role \
        bound_service_account_names=external-secrets \
        bound_service_account_namespaces={{ user_item.name }} \
        policies=user-{{ user_item.name }}-tailscale-operator-policy \
        ttl=1h
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true

- name: Verify userpass account exists for {{ user_item.name }}
  ansible.builtin.uri:
    url: "{{ openbao_url }}/v1/auth/userpass/users/{{ user_item.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ openbao_setup_root_token }}"
    status_code: [200]
    validate_certs: false
  no_log: true
