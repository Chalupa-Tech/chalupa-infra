---
- name: Setup Shared OpenBao Namespace
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n openbao openbao-0 -- sh -c "
      BAO_TOKEN={{ openbao_setup_root_token }} bao namespace create shared || true
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
