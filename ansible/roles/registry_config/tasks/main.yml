---
# Configures K3s containerd to authenticate to the Gitea container registry.
# The ci-read password is sourced from Ansible Vault (bootstrap-tier secret),
# not fetched from OpenBao at runtime.

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Template K3s registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s

- name: Verify registries.yaml was written
  ansible.builtin.stat:
    path: /etc/rancher/k3s/registries.yaml
  register: registry_config_stat
  failed_when: not registry_config_stat.stat.exists
