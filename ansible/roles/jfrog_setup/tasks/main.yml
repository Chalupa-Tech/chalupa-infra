---
- name: Create JFrog group
  group:
    name: jfrog
    gid: 1030
    state: present

- name: Create JFrog user
  user:
    name: jfrog
    uid: 1030
    group: jfrog
    shell: /sbin/nologin
    state: present

- name: Create JFrog data directory
  file:
    path: /opt/jfrog/artifactory/var
    state: directory
    owner: jfrog
    group: jfrog
    mode: '0755'
    recurse: yes

- name: Create Postgres data directory
  file:
    path: /opt/jfrog/postgres/data
    state: directory
    owner: "999"
    group: "999"

- name: Create Docker network with Tailscale-compatible MTU
  docker_network:
    name: infra_network
    driver: bridge
    driver_options:
      com.docker.network.driver.mtu: "1280"

- name: Deploy Postgres Docker Container
  docker_container:
    name: jfrog-postgres
    image: postgres:14-alpine
    state: started
    restart_policy: unless-stopped
    env:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: artifactory_password
    volumes:
      - "/opt/jfrog/postgres/data:/var/lib/postgresql/data:Z"
    networks:
      - name: infra_network

- name: Deploy JFrog Docker Container
  docker_container:
    name: jfrog-artifactory
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:latest
    state: started
    restart_policy: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - "/opt/jfrog/artifactory/var:/var/opt/jfrog/artifactory:Z"
    env:
      JF_SHARED_DATABASE_TYPE: postgresql
      JF_SHARED_DATABASE_DRIVER: org.postgresql.Driver
      JF_SHARED_DATABASE_URL: jdbc:postgresql://jfrog-postgres:5432/artifactory
      JF_SHARED_DATABASE_USERNAME: artifactory
      JF_SHARED_DATABASE_PASSWORD: artifactory_password
    user: "1030:1030"
    networks:
      - name: infra_network

- name: Create Nginx config directory
  file:
    path: /opt/jfrog/nginx/conf
    state: directory
    mode: '0755'

- name: Create Nginx SSL directory
  file:
    path: /opt/jfrog/nginx/ssl
    state: directory
    mode: '0755'

- name: Template Nginx proxy configuration
  template:
    src: artifactory-ssl.conf.j2
    dest: /opt/jfrog/nginx/conf/artifactory-ssl.conf
    mode: '0644'
  notify: Restart Nginx

- name: Clear exiting Tailscale Serve configs
  ansible.builtin.shell: tailscale serve --https=443 off
  ignore_errors: true
  changed_when: false

- name: Generate Tailscale TLS Certificate for Nginx
  ansible.builtin.shell: tailscale cert --cert-file /opt/jfrog/nginx/ssl/artifactory.crt --key-file /opt/jfrog/nginx/ssl/artifactory.key {{ tailscale_hostname }}
  args:
    creates: /opt/jfrog/nginx/ssl/artifactory.crt

- name: Deploy JFrog Nginx Proxy
  docker_container:
    name: jfrog-nginx-proxy
    image: nginx:alpine
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/opt/jfrog/nginx/conf/artifactory-ssl.conf:/etc/nginx/conf.d/default.conf:ro"
      - "/opt/jfrog/nginx/ssl:/etc/nginx/ssl:ro"
    networks:
      - name: infra_network

- name: Expose Nginx via Tailscale TCP proxy
  ansible.builtin.shell: tailscale serve --bg --tcp 443 tcp://localhost:443
  changed_when: false
