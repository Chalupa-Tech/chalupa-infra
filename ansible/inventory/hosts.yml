---
all:
  children:
    k3s_servers:
      hosts:
        dpi2:
          ansible_host: dpi2.tailbecff0.ts.net
          pi_prepare_disable_wifi: true
    k3s_ha_servers:
      hosts:
        dpi3:
          ansible_host: dpi3.tailbecff0.ts.net
          pi_prepare_disable_wifi: true
    k3s_oci_servers:
      vars:
        ansible_user: ubuntu
      hosts:
        oracle1:
          ansible_host: oracle1.tailbecff0.ts.net
    k3s_agents:
      hosts:
        tpi1:
          ansible_host: tpi1.tailbecff0.ts.net
          pi_prepare_disable_wifi: true
        tpi3:
          ansible_host: tpi3.tailbecff0.ts.net
          pi_prepare_disable_wifi: true
        dpi1:
          ansible_host: dpi1.tailbecff0.ts.net
    # tpi2 removed — unreachable after wireguard-native migration.
    # Catch script on tpi1 will disable K3s when SSH recovers.
    # To re-add: use promote-agent.yml after reinstalling as agent.
    k3s_vm_agents:
      hosts:
        fw1:
          ansible_host: fw1.tailbecff0.ts.net
    docker_nodes:
      vars:
        enforce_arm64: false
        enforce_debian: false
      hosts:
        docker1:
          ansible_host: 15.204.88.41
          tailscale_auth_key: "{{ ts_docker_authkey }}"
          tailscale_short_hostname: gitea
          tailscale_hostname: gitea.tailbecff0.ts.net
          tailscale_advertise_routes: "172.17.0.0/16,172.18.0.0/16"
          tailscale_tags: "tag:docker"

    # Site groupings (for WireGuard cross-site routing)
    site_dustin:
      hosts:
        dpi1:
        dpi2:
        dpi3:
        fw1:
    site_tayven:
      hosts:
        tpi1:
        tpi2:
        tpi3:
    site_oracle:
      hosts:
        oracle1:

    # WireGuard gateway nodes (full-mesh tunnel endpoints)
    wg_gateways:
      hosts:
        dpi2:
        tpi2:
        oracle1:
