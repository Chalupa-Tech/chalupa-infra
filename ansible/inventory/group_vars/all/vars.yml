---
# Users to configure on all nodes
managed_users:
  - name: ddowell
    email: dowell.dustin@gmail.com
    pubkey_file: "{{ playbook_dir }}/../ssh_keys/ddowell.pub"
    argocd_admin: true
  - name: tbigelow
    email: gwathruoko@gmail.com
    pubkey_file: "{{ playbook_dir }}/../ssh_keys/tbigelow.pub"
    argocd_admin: true
  - name: ci
    email: github-actions-ci@localhost
    pubkey_file: "{{ playbook_dir }}/../ssh_keys/ci.pub"

# Application workloads deployed to K3s via ArgoCD.
# Each entry gets: K8s namespace, OpenBao policy, Kubernetes auth role.
# Namespace = service-group + tenant (e.g. schwab-ddowell).
# Multiple services share a namespace and its secrets.
managed_apps:
  - name: schwab-ddowell
    auth_service: true
    auth_sa: go-schwab-auth

# Secrets (Now managed via Ansible Vault: vault.yml)
gitea_ci_read_password: "{{ vault_gitea_ci_read_password }}"
ts_authkey: "{{ vault_ts_authkey }}"
k3s_token: "{{ vault_k3s_token }}"
ts_docker_authkey: "{{ vault_ts_docker_authkey }}"
ts_operator_client_id: "{{ vault_ts_operator_client_id }}"
ts_operator_client_secret: "{{ vault_ts_operator_client_secret }}"
cloudflare_api_key: "{{ vault_cloudflare_api_key }}"
ts_service_name: "{{ vault_ts_service_name | default('svc:chalupa-k3s') }}"
tailscale_api_key: "{{ vault_tailscale_api_key }}"

# Tags to ensure exist in the Tailscale ACL tagOwners
tailscale_required_tag_owners:
  tag:k3-node: []
  tag:docker: []

# OpenBao bootstrap credentials (sourced from Ansible Vault)
openbao_root_token: "{{ vault_openbao_root_token }}"
openbao_unseal_key: "{{ vault_openbao_unseal_key }}"

# Journald configuration
journald_system_max_use: "2G"
journald_system_keep_free: "10G"
journald_max_file_sec: "1day"
journald_max_retention_sec: "7day"

# OpenBao / Gitea integration
openbao_url: "https://openbao.chalupatech.com"
gitea_url: "https://gitea.tailbecff0.ts.net"
k3s_control_node: dpi2

# Gitea admin break-glass credential (Ansible Vault — NOT OpenBao, to preserve
# independence from the secrets backend this account protects)
gitea_admin_password: "{{ vault_gitea_admin_password }}"

# OpenBao OIDC clients provisioned by openbao_setup/oidc_setup.yml
# Each entry creates: OIDC key, assignment, client, and K8s Secret
openbao_oidc_clients:
  - name: grafana
    redirect_uris:
      - "https://grafana.chalupatech.com/login/generic_oauth"
  - name: argocd
    redirect_uris:
      - "https://argocd.chalupatech.com/auth/callback"
      - "http://localhost:8085/auth/callback"
  - name: gitea
    redirect_uris:
      - "https://gitea.tailbecff0.ts.net/user/oauth2/OpenBao/callback"
  - name: cli
    redirect_uris:
      - "http://localhost:8250/oidc/callback"

# Go-template string for the OpenBao OIDC 'user' scope.
# Defined here to prevent Ansible/Jinja2 from interpreting the {{ }} delimiters.
#
# IMPORTANT: Do NOT add "..." around {{...}} placeholders.
# The OpenBao template engine auto-JSON-quotes string values:
#   {{identity.entity.name}}           → "ddowell"    (already JSON-quoted)
#   {{identity.entity.metadata.email}} → "user@..."   (already JSON-quoted)
#   {{identity.entity.groups.names}}   → ["g1","g2"]  (already a JSON array)
#
# Email is stored as entity metadata via managed_users[].email in vars.yml.
# This is the correct multi-tenant pattern: each entity has its own real email.
openbao_oidc_user_scope_template: !unsafe '{"preferred_username":{{identity.entity.name}},"username":{{identity.entity.name}},"email":{{identity.entity.metadata.email}},"groups":{{identity.entity.groups.names}}}'
