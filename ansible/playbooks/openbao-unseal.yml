---
# Unseal all OpenBao pods.
#
# OpenBao loses unseal state on every pod restart (Shamir seal by design).
# This playbook unseals all running pods using the key from Ansible Vault.
#
# Handles three pod states:
#   - Initialized + sealed: unseal only
#   - Uninitialized (fresh PVC): raft join to leader, then unseal
#   - Already unsealed: skip
#
# Usage:
#   ansible-playbook playbooks/openbao-unseal.yml

- name: Unseal OpenBao cluster
  hosts: k3s_servers
  become: true
  gather_facts: false
  tasks:
    - name: Get OpenBao pod names
      ansible.builtin.command: >
        k3s kubectl get pods -n openbao
        -l app.kubernetes.io/name=openbao,component=server
        --field-selector=status.phase=Running
        --no-headers
        -o custom-columns=NAME:.metadata.name
      register: openbao_pods_raw
      changed_when: false

    - name: Check seal status of each pod
      ansible.builtin.command: >
        k3s kubectl exec {{ item }} -n openbao -- bao status -format=json
      loop: "{{ openbao_pods_raw.stdout_lines }}"
      register: seal_status
      changed_when: false
      failed_when: false

    - name: Classify pods by state
      ansible.builtin.set_fact:
        initialized_sealed_pods: >-
          {{ seal_status.results
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'ne', '')
             | selectattr('stdout', 'search', '"initialized":\s*true')
             | selectattr('stdout', 'search', '"sealed":\s*true')
             | map(attribute='item')
             | list }}
        uninitialized_pods: >-
          {{ seal_status.results
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'ne', '')
             | selectattr('stdout', 'search', '"initialized":\s*false')
             | map(attribute='item')
             | list }}
        already_unsealed_pods: >-
          {{ seal_status.results
             | selectattr('stdout', 'defined')
             | selectattr('stdout', 'ne', '')
             | selectattr('stdout', 'search', '"sealed":\s*false')
             | map(attribute='item')
             | list }}

    - name: Show pod classification
      ansible.builtin.debug:
        msg:
          initialized_sealed: "{{ initialized_sealed_pods }}"
          uninitialized: "{{ uninitialized_pods }}"
          already_unsealed: "{{ already_unsealed_pods }}"

    - name: Unseal initialized pods first (establishes Raft leader)
      ansible.builtin.command: >
        k3s kubectl exec {{ item }} -n openbao --
        bao operator unseal {{ openbao_unseal_key }}
      loop: "{{ initialized_sealed_pods }}"
      register: leader_unseal
      changed_when: true
      failed_when: false
      no_log: true

    - name: Wait for leader election
      ansible.builtin.pause:
        seconds: 5
      when: initialized_sealed_pods | length > 0 and uninitialized_pods | length > 0

    - name: Determine Raft leader address
      ansible.builtin.set_fact:
        raft_leader_pod: >-
          {{ (initialized_sealed_pods + already_unsealed_pods) | first | default('openbao-0') }}

    - name: Raft join for uninitialized pods
      ansible.builtin.command: >
        k3s kubectl exec {{ item }} -n openbao --
        bao operator raft join http://{{ raft_leader_pod }}.openbao-internal:8200
      loop: "{{ uninitialized_pods }}"
      failed_when: false
      changed_when: true

    - name: Unseal newly joined pods
      ansible.builtin.command: >
        k3s kubectl exec {{ item }} -n openbao --
        bao operator unseal {{ openbao_unseal_key }}
      loop: "{{ uninitialized_pods }}"
      register: unseal_results
      changed_when: true
      failed_when: false
      no_log: true

    - name: Verify final status
      ansible.builtin.command: >
        k3s kubectl exec {{ item }} -n openbao -- bao status -format=json
      loop: "{{ openbao_pods_raw.stdout_lines }}"
      register: final_status
      changed_when: false
      failed_when: false

    - name: Show final seal status
      ansible.builtin.debug:
        msg: >-
          {{ item.item }}:
          {{ 'unsealed' if (item.stdout | default('') | from_json).sealed is defined
             and not (item.stdout | from_json).sealed
             else 'sealed/unavailable' }}
      loop: "{{ final_status.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout is defined and item.stdout != ''
