---
# Drift detection: verify all K3s nodes run the expected version.
#
# Usage:
#   ansible-playbook playbooks/k3s-version-check.yml --ask-vault-pass

- name: Check K3s version across all nodes
  hosts: k3s_servers:k3s_ha_servers:k3s_oci_servers:k3s_agents:k3s_vm_agents
  become: true
  gather_facts: false
  tasks:
    - name: Get installed K3s version
      ansible.builtin.command: k3s --version
      register: k3s_version_output
      changed_when: false

    - name: Parse version string
      ansible.builtin.set_fact:
        k3s_installed: "{{ k3s_version_output.stdout | regex_search('v[0-9]+\\.[0-9]+\\.[0-9]+\\+k3s[0-9]+') }}"

    - name: Report version status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: installed={{ k3s_installed }},
          expected={{ k3s_version }},
          status={{ 'OK' if k3s_installed == k3s_version else 'MISMATCH' }}

    - name: Fail on version mismatch
      ansible.builtin.fail:
        msg: >-
          Version mismatch on {{ inventory_hostname }}:
          installed={{ k3s_installed }}, expected={{ k3s_version }}.
          Run the k3s_install role to remediate.
      when: k3s_installed != k3s_version
