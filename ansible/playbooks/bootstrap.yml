---
- name: Provision Primary K3s Server
  hosts: k3s_servers
  become: true
  vars:
    tailscale_services_list:
      - "svc:chalupa-k3s:6443"
  roles:
    - preflight
    - user_setup
    - pi_prepare
    - k3s_config
    - k3s_install
    - tailscale_services
  post_tasks:
    - name: Register Primary Server Tailscale IP
      ansible.builtin.set_fact:
        primary_server_ip: "{{ ansible_facts['tailscale0']['ipv4']['address'] }}"
      run_once: true  # noqa: run-once

    - name: Extract K3s Token from output
      ansible.builtin.set_fact:
        captured_k3s_token: "{{ k3s_install_result.stdout | regex_search('K10.*::server:[a-f0-9]+') }}"
      when: k3s_install_result.stdout is defined
      run_once: true  # noqa: run-once

- name: Provision K3s HA Servers
  hosts: k3s_ha_servers
  become: true
  vars:
    tailscale_services_list:
      - "svc:chalupa-k3s:6443"
  roles:
    - preflight
    - user_setup
    - pi_prepare
    - k3s_config
    - role: k3s_install
      vars:
        k3s_install_server_ip: >-
          {{ hostvars[groups['k3s_servers'][0]]['primary_server_ip'] |
             default('chalupa-k3s.tailbecff0.ts.net') }}
        k3s_install_token: "{{ hostvars[groups['k3s_servers'][0]]['captured_k3s_token'] }}"
    - tailscale_services

- name: Provision K3s OCI Servers (Non-Scheduling Tiebreaker)
  hosts: k3s_oci_servers
  become: true
  pre_tasks:
    - name: Configure persistent journald logging with size limits
      ansible.builtin.lineinfile:
        path: /etc/systemd/journald.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - {regexp: "^#?Storage=", line: "Storage=persistent"}
        - {regexp: "^#?SystemMaxUse=", line: "SystemMaxUse={{ journald_system_max_use }}"}
        - {regexp: "^#?SystemKeepFree=", line: "SystemKeepFree={{ journald_system_keep_free }}"}
        - {regexp: "^#?MaxFileSec=", line: "MaxFileSec={{ journald_max_file_sec }}"}
        - {regexp: "^#?MaxRetentionSec=", line: "MaxRetentionSec={{ journald_max_retention_sec }}"}
      notify: Restart journald

    - name: Install vnstat for egress monitoring
      ansible.builtin.apt:
        name: vnstat
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure vnstat service is running
      ansible.builtin.systemd:
        name: vnstat
        state: started
        enabled: true
  roles:
    - preflight
    - user_setup
    - k3s_config
    - role: k3s_install
      vars:
        k3s_install_server_ip: "chalupa-k3s.tailbecff0.ts.net"
        k3s_install_token: >-
          {{ hostvars[groups['k3s_servers'][0]]['captured_k3s_token']
             | default(k3s_token) }}
  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted
        daemon_reload: true

- name: Provision K3s Agents
  hosts: k3s_agents
  become: true
  roles:
    - preflight
    - user_setup
    - pi_prepare
    - k3s_config
    - role: k3s_install
      vars:
        k3s_install_server_ip: >-
          {{ hostvars[groups['k3s_servers'][0]]['primary_server_ip'] |
             default('chalupa-k3s.tailbecff0.ts.net') }}
        k3s_install_token: "{{ hostvars[groups['k3s_servers'][0]]['captured_k3s_token'] }}"

- name: Provision K3s VM Agents
  hosts: k3s_vm_agents
  become: true
  roles:
    - preflight
    - user_setup
    - pi_prepare
    - k3s_config
    - role: k3s_install
      vars:
        k3s_install_server_ip: >-
          {{ hostvars[groups['k3s_servers'][0]]['primary_server_ip'] |
             default('chalupa-k3s.tailbecff0.ts.net') }}
        k3s_install_token: "{{ hostvars[groups['k3s_servers'][0]]['captured_k3s_token'] }}"

- name: Finalize Cluster Configuration (ArgoCD, OpenBao & HA Hardening)
  hosts: k3s_servers
  become: true
  roles:
    - k3s_hardening
    - argocd_setup
    - openbao_setup

- name: Configure Container Registry on All K3s Nodes
  hosts: k3s_servers:k3s_ha_servers:k3s_oci_servers:k3s_agents:k3s_vm_agents
  become: true
  roles:
    - registry_config
