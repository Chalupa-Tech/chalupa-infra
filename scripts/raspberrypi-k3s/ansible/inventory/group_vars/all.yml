---
# Users to configure on all nodes
managed_users:
  - name: ddowell
    pubkey_file: "{{ playbook_dir }}/../../ssh_keys/ddowell.pub"
    argocd_admin: true
  - name: tbigelow
    pubkey_file: "{{ playbook_dir }}/../../ssh_keys/tbigelow.pub"
    argocd_admin: true

# Secrets (prefers environment variables, falls back to .env file)
ts_authkey: >-
  {{ lookup('env', 'TS_AUTHKEY') |
     default(lookup('ini', 'TS_AUTHKEY type=properties file=' ~ playbook_dir ~ '/../.env'), true) }}
k3s_token: >-
  {{ lookup('env', 'K3S_TOKEN') |
     default(lookup('ini', 'K3S_TOKEN type=properties file=' ~ playbook_dir ~ '/../.env'), true) }}
ts_service_name: >-
  {{ lookup('env', 'TS_SERVICE_NAME') |
     default(lookup('ini', 'TS_SERVICE_NAME type=properties file=' ~ playbook_dir ~ '/../.env') |
     default('svc:chalupa-k3s', true), true) }}

# Journald configuration
journald_system_max_use: "2G"
journald_system_keep_free: "10G"
journald_max_file_sec: "1day"
journald_max_retention_sec: "7day"
