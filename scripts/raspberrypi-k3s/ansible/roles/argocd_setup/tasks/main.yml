---
- name: Check if Helm is installed
  command: helm version
  register: helm_check
  ignore_errors: yes
  changed_when: false

- name: Install Helm if missing
  shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0

- name: Ensure argocd namespace exists
  command: kubectl create namespace argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: ns_create
  failed_when: false
  changed_when: "'created' in ns_create.stdout"

- name: Add ArgoCD Helm repository
  shell: helm repo add argo https://argoproj.github.io/argo-helm && helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Template ArgoCD values
  template:
    src: argocd-values.yaml.j2
    dest: /tmp/argocd-values.yaml
    mode: "0644"

- name: Install ArgoCD via Helm
  shell: helm upgrade --install argocd argo/argo-cd --namespace argocd -f /tmp/argocd-values.yaml --wait
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Set initial passwords for managed users
  shell: |
    kubectl patch secret argocd-secret -n argocd -p '{"stringData": {"accounts.{{ item.name }}.password": "$2a$12$WkgbDDM51Gb5Mk76L77b.un3xGE8XkBdn0Jdr78P0DXJFwaqHdZs6", "accounts.{{ item.name }}.passwordMtime": "{{ ansible_facts.date_time.iso8601 }}"}}'
    touch /var/lib/rancher/k3s/server/argocd_passwords_initialized_{{ item.name }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  loop: "{{ managed_users }}"
  changed_when: true
  args:
    creates: /var/lib/rancher/k3s/server/argocd_passwords_initialized_{{ item.name }}

- name: Restart ArgoCD Server to pick up password changes
  shell: kubectl rollout restart deployment argocd-server -n argocd
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true

- name: Create temporary directory for core apps bootstrap
  file:
    path: /tmp/argocd-bootstrap
    state: directory
    mode: "0755"

- name: Copy core apps bootstrap files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop:
    - {
        src: "../../../../scripts/deploy-core-apps.sh",
        dest: "/tmp/argocd-bootstrap/deploy-core-apps.sh",
        mode: "0755",
      }
    - {
        src: "../../../../k8s/platform/core-apps-appset.yaml",
        dest: "/tmp/argocd-bootstrap/core-apps-appset.yaml",
      }
    - {
        src: "../../../../k8s/apps/example-app-appset.yaml",
        dest: "/tmp/argocd-bootstrap/example-app-appset.yaml",
      }
    - {
        src: "../../local/observability/bootstrap_observability_crds.sh",
        dest: "/tmp/argocd-bootstrap/bootstrap_observability_crds.sh",
        mode: "0755",
      }

- name: Get repository URL
  shell: git remote get-url origin
  delegate_to: localhost
  register: repo_url_cmd
  become: no
  changed_when: false

- name: Deploy core applications via ArgoCD
  shell: ./deploy-core-apps.sh
  args:
    chdir: /tmp/argocd-bootstrap
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    REPO_URL: "{{ repo_url_cmd.stdout }}"
    APPSET_FILE: "/tmp/argocd-bootstrap/core-apps-appset.yaml"
    EXAMPLE_APPSET_FILE: "/tmp/argocd-bootstrap/example-app-appset.yaml"
    CRD_BOOTSTRAP_SCRIPT: "/tmp/argocd-bootstrap/bootstrap_observability_crds.sh"
  changed_when: true

- name: Cleanup bootstrap files
  file:
    path: /tmp/argocd-bootstrap
    state: absent
