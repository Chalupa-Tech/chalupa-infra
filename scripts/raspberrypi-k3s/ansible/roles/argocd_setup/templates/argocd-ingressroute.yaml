---
# Traefik IngressRoute for ArgoCD
# Routes pi-k3s.chalupatech.com/argocd → argocd-server service
# ArgoCD is configured with server.rootpath=/argocd and server.insecure=true
# so it handles the sub-path natively — no prefix stripping needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pi-k3s.chalupatech.com`) && PathPrefix(`/argocd`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
