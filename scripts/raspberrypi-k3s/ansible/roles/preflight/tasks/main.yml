---
- name: Verify OS is Debian-based (Ubuntu/Raspbian)
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == "Debian"
    fail_msg: "This playbook only supports Debian-based systems."

- name: Verify architecture is 64-bit ARM
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == "aarch64"
    fail_msg: "K3s setup in this project targets 64-bit ARM (aarch64)."

- name: Check if Tailscale is installed
  ansible.builtin.command: tailscale version
  register: ts_version
  ignore_errors: true
  changed_when: false

- name: Warn if Tailscale is missing
  ansible.builtin.debug:
    msg: "Tailscale is not installed. The k3s_install role will attempt to install it."
  when: ts_version.rc != 0
