---
- name: Ensure K8s namespace exists for {{ user_item.name }}
  ansible.builtin.command: kubectl create namespace {{ user_item.name }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_ns_create
  failed_when: false
  changed_when: "'created' in openbao_setup_ns_create.stdout"

- name: Ensure ServiceAccount exists for {{ user_item.name }}
  ansible.builtin.command: >
    kubectl create serviceaccount {{ user_item.name }}-sa -n {{ user_item.name }}
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_sa_create
  failed_when: false
  changed_when: "'created' in openbao_setup_sa_create.stdout"

- name: Setup OpenBao for {{ user_item.name }}
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n openbao openbao-0 -- sh -c "
      BAO_TOKEN={{ openbao_setup_root_token }} bao namespace create {{ user_item.name }} || true

      # Create policy for user (full access within their namespace)
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao policy write -namespace={{ user_item.name }} user-policy - <<EOF
      path \"*\" {
        capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\", \"sudo\"]
      }
    EOF

      # Create isolated policy for Tailscale Operator external-secrets synchronization
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao policy write -namespace={{ user_item.name }} tailscale-operator-policy - <<EOF
      path \"secret/data/{{ user_item.name }}/tailscale-operator\" {
        capabilities = [\"read\"]
      }
    EOF

      # Setup userpass user
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao write -namespace={{ user_item.name }} auth/userpass/users/{{ user_item.name }} \
        password=OpenBao123! \
        policies=user-policy

      # Setup Kubernetes auth role for normal user access
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao write -namespace={{ user_item.name }} auth/kubernetes/role/{{ user_item.name }}-role \
        bound_service_account_names={{ user_item.name }}-sa \
        bound_service_account_namespaces={{ user_item.name }} \
        policies=user-policy \
        ttl=1h

      # Setup Kubernetes auth role for tenant's external-secrets SecretStore
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao write -namespace={{ user_item.name }} auth/kubernetes/role/external-secrets-role \
        bound_service_account_names=external-secrets \
        bound_service_account_namespaces={{ user_item.name }} \
        policies=tailscale-operator-policy \
        ttl=1h
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true

- name: Verify OpenBao setup for {{ user_item.name }}
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n openbao openbao-0 -- sh -c "
      BAO_TOKEN={{ openbao_setup_root_token }} bao namespace list | grep -q '{{ user_item.name }}/' && \
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao read -namespace={{ user_item.name }} auth/userpass/users/{{ user_item.name }}
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: openbao_setup_verify
  failed_when: openbao_setup_verify.rc != 0
  changed_when: false
  no_log: true
