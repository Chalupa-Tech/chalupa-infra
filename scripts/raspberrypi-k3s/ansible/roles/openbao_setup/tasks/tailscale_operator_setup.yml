---
- name: Setup OpenBao for Cluster-Level Tailscale Operator (External Secrets)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n openbao openbao-0 -- sh -c "
      # Create policy for the cluster-level tailscale-operator
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao policy write cluster-tailscale-operator-policy - <<EOF
      path \"secret/data/platform/tailscale-operator\" {
        capabilities = [\"read\"]
      }
    EOF

      # Setup Kubernetes auth role for external-secrets to read cluster-level tailscale credentials
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao write auth/kubernetes/role/cluster-external-secrets-role \
        bound_service_account_names=external-secrets \
        bound_service_account_namespaces=external-secrets \
        policies=cluster-tailscale-operator-policy \
        ttl=1h
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true
