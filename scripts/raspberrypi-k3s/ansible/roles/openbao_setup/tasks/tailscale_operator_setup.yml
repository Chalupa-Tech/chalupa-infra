---
- name: Setup OpenBao for Tailscale Operator (External Secrets)
  ansible.builtin.shell: |
    set -o pipefail
    kubectl exec -n openbao openbao-0 -- sh -c "
      # Create policy for the tailscale-operator
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao policy write tailscale-operator - <<EOF
      path \"secret/data/platform/tailscale-operator\" {
        capabilities = [\"read\"]
      }
    EOF

      # Setup Kubernetes auth role for external-secrets
      BAO_TOKEN={{ openbao_setup_root_token }} \
        bao write auth/kubernetes/role/external-secrets-role \
        bound_service_account_names=external-secrets \
        bound_service_account_namespaces=external-secrets \
        policies=tailscale-operator \
        ttl=1h
    "
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: true
  no_log: true
