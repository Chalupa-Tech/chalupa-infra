apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: schwab-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: schwab-secrets
    creationPolicy: Owner
  data:
    - secretKey: SCHWAB_API_KEY
      remoteRef:
        key: secret/data/{{ .Release.Namespace }}/schwab
        property: api_key
    - secretKey: SCHWAB_API_SECRET
      remoteRef:
        key: secret/data/{{ .Release.Namespace }}/schwab
        property: api_secret
    - secretKey: SCHWAB_REFRESH_TOKEN
      remoteRef:
        key: secret/data/{{ .Release.Namespace }}/schwab
        property: refresh_token
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: secret/data/{{ .Release.Namespace }}/discord
        property: webhook_url
