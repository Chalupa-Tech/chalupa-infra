apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-notify-subscriber
  labels:
    app: go-notify-subscriber
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-notify-subscriber
  strategy:
    canary:
      analysis:
        templates:
          - templateName: go-notify-subscriber-canary
        args:
          - name: pod-hash
            valueFrom:
              podTemplateHashValue: Latest
        startingStep: 0
      steps:
        - pause: { duration: 60s }
        - pause: { duration: 60s }
        - pause: { duration: 60s }
  template:
    metadata:
      labels:
        app: go-notify-subscriber
    spec:
      containers:
        - name: go-notify-subscriber
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: RUN_MODE
              value: "subscriber"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: SCHWAB_REGISTRATION
              value: {{ .Values.schwab.registration | quote }}
            - name: SCHWAB_AUTH_URL
              value: "https://schwab-auth.chalupatech.com/auth/start"
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: VAULT_KUBE_ROLE
              value: {{ .Values.vault.kubeRole | quote }}
            - name: VAULT_SECRET_PATH
              value: {{ .Values.vault.secretPath | quote }}
            - name: VAULT_TOKEN_PATH
              value: {{ .Values.vault.tokenPath | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          envFrom:
            - secretRef:
                name: schwab-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
