apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: go-notify-subscriber-canary
  labels:
    app: go-notify-subscriber
spec:
  args:
    - name: pod-hash
  metrics:
    # Canary pod must be responding to health probes (admin server alive).
    # VictoriaMetrics always returns vector type — use len() guard + result[0] indexing.
    - name: health-check
      interval: 60s
      count: 3
      failureLimit: 1
      provider:
        prometheus:
          address: http://vmsingle-vmstack.observability.svc.cluster.local:8428
          query: |
            min(up{job="go-notify-subscriber", namespace="schwab-ddowell"})
      successCondition: "len(result) > 0 && result[0] >= 1"
      failureCondition: "len(result) == 0 || result[0] < 1"

    # No crash loops — canary pod restarts must be zero.
    - name: no-restarts
      interval: 60s
      count: 3
      failureLimit: 0
      provider:
        prometheus:
          address: http://vmsingle-vmstack.observability.svc.cluster.local:8428
          query: |
            max(
              kube_pod_container_status_restarts_total{
                namespace="schwab-ddowell",
                pod=~"go-notify-subscriber-.*-{{`{{args.pod-hash}}`}}.*"
              }
            )
      successCondition: "len(result) == 0 || result[0] == 0"
      failureCondition: "len(result) > 0 && result[0] > 0"
