apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-notify-subscriber
  labels:
    app: go-notify-subscriber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-notify-subscriber
  template:
    metadata:
      labels:
        app: go-notify-subscriber
    spec:
      containers:
        - name: go-notify-subscriber
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: RUN_MODE
              value: "subscriber"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: schwab-secrets
                  key: DISCORD_WEBHOOK_URL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
