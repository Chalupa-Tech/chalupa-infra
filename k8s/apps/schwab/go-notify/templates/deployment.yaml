apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-notify-subscriber
  labels:
    app: go-notify-subscriber
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-notify-subscriber
  template:
    metadata:
      labels:
        app: go-notify-subscriber
    spec:
      containers:
        - name: go-notify-subscriber
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: RUN_MODE
              value: "subscriber"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: SCHWAB_REGISTRATION
              value: {{ .Values.schwab.registration | quote }}
          envFrom:
            - secretRef:
                name: schwab-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
