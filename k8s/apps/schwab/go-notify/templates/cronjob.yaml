apiVersion: batch/v1
kind: CronJob
metadata:
  name: go-notify
  labels:
    app: go-notify
spec:
  schedule: "{{ .Values.schedule }}"
  timeZone: "{{ .Values.timeZone }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 1
      # Cap any single Job at 5 min. Reports normally run ~1-2 min;
      # this guards against a stuck Schwab API call or retry loop
      # blocking the next scheduled run.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: go-notify
        spec:
          restartPolicy: Never
          containers:
            - name: go-notify
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              env:
                - name: APP_VERSION
                  value: {{ .Values.image.tag | quote }}
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://$(HOST_IP):4317"
                - name: SCHWAB_REGISTRATION
                  value: {{ .Values.schwab.registration | quote }}
                - name: SCHWAB_AUTH_URL
                  value: "https://schwab-auth.chalupatech.com/auth/start"
                - name: VAULT_ADDR
                  value: {{ .Values.vault.addr | quote }}
                - name: VAULT_KUBE_ROLE
                  value: {{ .Values.vault.kubeRole | quote }}
                - name: VAULT_SECRET_PATH
                  value: {{ .Values.vault.secretPath | quote }}
                - name: VAULT_TOKEN_PATH
                  value: {{ .Values.vault.tokenPath | quote }}
              envFrom:
                - secretRef:
                    name: schwab-secrets
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
