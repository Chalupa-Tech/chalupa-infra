---
schedule: "30 14 * * 1-5"
timeZone: "America/Denver"

image:
  registry: gitea.tailbecff0.ts.net
  repository: chalupa-tech/go-notify
  tag: v0.8.0

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"
  # Replica count for the JetStream stream this service declares (NATS_STREAM_REPLICAS).
  # 3 = one per NATS member, so the stream survives losing one member.
  # go-schwab-auth and go-notify both declare SCHWAB_TOKENS; keep them equal.
  streamReplicas: 3

metrics:
  port: 9090

schwab:
  registration: "ddowell-individual"

vault:
  addr: "http://openbao.openbao.svc.cluster.local:8200"
  kubeRole: "schwab-ddowell-role"
  secretPath: "secret/data/schwab-ddowell/schwab"
  tokenPath: "secret/data/schwab-ddowell/tokens/individual"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
