---
# Pulls the papertrader DB password from OpenBao into a k8s Secret
# the Deployment mounts via secretKeyRef. Uses vault-backend
# SecretStore from k8s/apps/schwab/base.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: papertrader-db-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: papertrader-db-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: APP_PASSWORD
