---
# Renders books.yaml from .Values.paperTrader.books. Mounted at
# /etc/paper-trader/books.yaml in the go-paper-trader container;
# the binary's --config flag defaults to that path.
#
# Phase-5: replaces the scalar --strategy / --symbol / --qty CLI
# flags with per-book entries. Each entry becomes one SimAdapter in
# the process with its own cash pool, position map, and order_id
# sequence.
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-paper-trader-books
  labels:
    app: go-paper-trader
data:
  books.yaml: |
    books:
{{- range .Values.paperTrader.books }}
      - bookID: {{ .bookID | quote }}
        strategy: {{ .strategy | quote }}
        quantity: {{ .quantity }}
{{- if .alternatorCadence }}
        alternatorCadence: {{ .alternatorCadence | quote }}
{{- end }}
{{- if .smaFast }}
        smaFast: {{ .smaFast | quote }}
{{- end }}
{{- if .smaSlow }}
        smaSlow: {{ .smaSlow | quote }}
{{- end }}
{{- if .offsetBps }}
        offsetBps: {{ .offsetBps }}
{{- end }}
{{- if .maxRestDuration }}
        maxRestDuration: {{ .maxRestDuration | quote }}
{{- end }}
{{- if .rebalanceBps }}
        rebalanceBps: {{ .rebalanceBps }}
{{- end }}
        startingCash: {{ .startingCash }}
{{- if .session }}
        session: {{ .session | quote }}
{{- end }}
{{- if .fillModel }}
        fillModel:
          extraSlippageBps: {{ default 0 .fillModel.extraSlippageBps }}
          latencyMs: {{ default 0 .fillModel.latencyMs }}
{{- end }}
{{- if hasKey . "maxDailyLossUSD" }}
        maxDailyLossUSD: {{ .maxDailyLossUSD }}
{{- end }}
{{- if .risk }}
        risk:
{{- if hasKey .risk "maxOrderQty" }}
          maxOrderQty: {{ .risk.maxOrderQty }}
{{- end }}
{{- if hasKey .risk "maxNotionalPerOrderUSD" }}
          maxNotionalPerOrderUSD: {{ .risk.maxNotionalPerOrderUSD }}
{{- end }}
{{- if hasKey .risk "maxPositionQtyPerSymbol" }}
          maxPositionQtyPerSymbol: {{ .risk.maxPositionQtyPerSymbol }}
{{- end }}
{{- if hasKey .risk "requireSufficientBuyingPower" }}
          requireSufficientBuyingPower: {{ .risk.requireSufficientBuyingPower }}
{{- end }}
{{- end }}
        symbols:
{{- range .symbols }}
          - {{ . | quote }}
{{- end }}
{{- end }}
