---
image:
  registry: gitea.tailbecff0.ts.net
  repository: chalupa-tech/go-paper-trader
  tag: "v0.10.0"
  pullPolicy: IfNotPresent

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

# paper-trader connects to the cluster TimescaleDB with a dedicated
# role (papertrader) that has INSERT, SELECT on paper_fills and
# paper_positions only. No other table access, no Schwab Trader
# credentials.
database:
  host: "timescaledb.schwab-ddowell.svc.cluster.local"
  port: 5432
  name: market
  user: papertrader

# OpenBao path for the papertrader DB credentials. Seeded manually
# pre-merge with:
#   bao kv put secret/schwab-ddowell/timescaledb/papertrader \
#     APP_PASSWORD=$(openssl rand -base64 24)
vault:
  secretPath: "secret/data/schwab-ddowell/timescaledb/papertrader"

metrics:
  port: 9090

# Pod-level cadences — apply to every book.
paperTrader:
  maxQuoteAge: 30s
  mtmInterval: 5s
  snapshotInterval: 60s

  # books is the list of isolated (strategy, cash, positions,
  # order_id) pools this pod runs concurrently. Phase-5 turns the
  # paper-trader from a single-book deployment into a research
  # utility where each book's cumulative P&L is directly comparable
  # against its siblings on shared Grafana panels.
  #
  # Each entry becomes one SimAdapter in the process. book_ids must
  # be globally unique across every paper-trader pod writing to the
  # same Timescale DB — they are the discriminator on paper_fills /
  # paper_positions / paper_cash.
  #
  # The two-book default is the phase-5 research question:
  # "does tighter alternator cadence pay?" — ddowell-alt-30s vs
  # ddowell-alt-60s on the same 24-symbol watchlist.
  #
  # Phase-5a.2 (2026-04-19) converged books[].symbols with
  # go-schwab-feed feed.watchlist. Source-of-truth catalog lives at
  # k8s/apps/schwab/watchlists/ddowell-individual.yaml.
  # Every symbol below must be in that catalog and in the feed's
  # watchlist — enforced by
  # .github/workflows/paper-trader-symbol-coverage-lint.yml.
  #
  # Phase-5b may curate per-book subsets for research reproducibility;
  # the ⊆ constraint (not ==) in the lint allows this without
  # template changes.
  #
  # Historical pre-phase-5 fills live under the sentinel
  # `ddowell-alt-v03` (applied by the one-shot schema migration's
  # DEFAULT clause; the clause is then dropped so future INSERTs
  # must specify book_id explicitly).
  books:
    # paper-trading-realism phase-6: per-book daily max-loss halt. When
    # omitted, each book takes the binary-level default (500 USD, 5% of
    # $10k starting cash). Set to 0 to disable the guard entirely —
    # paper-trading is sandboxed so "no guard" is a reasonable operator
    # choice for research runs; the default is belt-and-suspenders
    # against runaway strategy bugs that would otherwise invalidate the
    # day's research window. Override per-book with `maxDailyLossUSD:`
    # below if the operator wants a tighter or looser ceiling.
    - bookID: ddowell-alt-30s
      strategy: alternator
      quantity: 1
      alternatorCadence: 30s
      startingCash: 10000
      # paper-trading-realism phase-2: reject orders outside 09:30-16:00 ET
      # M-F (ex US holidays). Was unbounded pre-phase-2 — the 30s cadence
      # fired 384 fills in the 2026-04-20 post-close window, differentially
      # biasing the 30s-vs-60s comparison against its 60s sibling.
      session: regular
      # paper-trading-realism phase-4: ask-on-BUY / bid-on-SELL fill model
      # with 100ms constant submit-to-fill latency. extraSlippageBps=0
      # means the quoted spread IS the only slippage — no hidden cushion.
      # The 30s book fills more often, so it is the more sensitive side
      # of the 30s-vs-60s comparison to any model change here.
      fillModel:
        extraSlippageBps: 0
        latencyMs: 100
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING
    - bookID: ddowell-alt-60s
      strategy: alternator
      quantity: 1
      alternatorCadence: 60s
      startingCash: 10000
      # Same rationale as ddowell-alt-30s; both books must be gated
      # identically for the cadence comparison to be apples-to-apples.
      session: regular
      # Same fill model as ddowell-alt-30s — the whole point of the
      # cadence comparison is that everything except cadence is equal.
      fillModel:
        extraSlippageBps: 0
        latencyMs: 100
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING
    # paper-trading-realism phase-5: SMA-crossover book — the first
    # non-alternator strategy deployed. Gives the dashboard's
    # $strategy dropdown a second value and makes cross-strategy
    # comparisons meaningful on the same 24-symbol catalog.
    #
    # SMA implementation at pkg/strategy/sma/sma.go: long-only,
    # single-position-per-symbol, edge-triggered on sign change of
    # (fast - slow). 5m / 20m windows on 10s market-hours quote
    # cadence = 30 samples fast, 120 samples slow — long enough to
    # smooth noise, short enough that crossovers fire on intraday
    # swings.
    - bookID: ddowell-sma-5x20
      strategy: sma
      quantity: 1
      smaFast: 5m
      smaSlow: 20m
      startingCash: 10000
      session: regular
      fillModel:
        extraSlippageBps: 0
        latencyMs: 100
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING
    # paper-trading-realism phase-10b: first LIMIT-using shipping
    # strategy. Place / cancel / replace lifecycle exercised against
    # one symbol so the phase-10 "Working orders" dashboard row
    # populates with real working orders during market hours and the
    # EOD-cancel path sees live traffic. Single-book by design — the
    # goal is exercising the LIMIT lifecycle, not multi-book research
    # (multi-symbol limit_example is phase-12+).
    #
    # Knobs:
    #   offsetBps: 10       — place 10bps below ask (BUY) / above bid (SELL)
    #   maxRestDuration: 5m — cancel and re-post if unfilled for 5min
    #   rebalanceBps: 5     — replace if intended price drifts >5bps
    #                          from the working LIMIT
    - bookID: ddowell-limit-example
      strategy: limit_example
      quantity: 5
      offsetBps: 10
      maxRestDuration: 5m
      rebalanceBps: 5
      startingCash: 5000
      session: regular
      fillModel:
        extraSlippageBps: 0
        latencyMs: 100
      symbols:
        - AMD
    # paper-trading-realism phase-11c: passive benchmark book.
    # buy_and_hold is a one-shot equal-dollar allocator: on the first
    # observed quote per symbol, it places a single MARKET BUY for
    # floor((startingCash / numSymbols) / ask) shares; once a symbol is
    # allocated it never trades that symbol again. The strategy's
    # mark-to-market equity therefore tracks the watchlist's underlying
    # performance — that is the entire point. Cash + watchlist match
    # ddowell-alt-30s / ddowell-alt-60s / ddowell-sma-5x20 so the
    # equity-multiple panel comparison is apples-to-apples.
    #
    # session=regular gates the first BUY to 09:30 ET market open.
    # No quantity / cadence / window knobs — sizing is derived from
    # StartingCash and the symbol set.
    - bookID: ddowell-buy-and-hold
      strategy: buy_and_hold
      startingCash: 10000
      session: regular
      fillModel:
        extraSlippageBps: 0
        latencyMs: 100
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 96Mi
