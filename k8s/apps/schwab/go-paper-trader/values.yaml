---
image:
  registry: gitea.tailbecff0.ts.net
  repository: chalupa-tech/go-paper-trader
  tag: "v0.5.0"
  pullPolicy: IfNotPresent

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

# paper-trader connects to the cluster TimescaleDB with a dedicated
# role (papertrader) that has INSERT, SELECT on paper_fills and
# paper_positions only. No other table access, no Schwab Trader
# credentials.
database:
  host: "timescaledb.schwab-ddowell.svc.cluster.local"
  port: 5432
  name: market
  user: papertrader

# OpenBao path for the papertrader DB credentials. Seeded manually
# pre-merge with:
#   bao kv put secret/schwab-ddowell/timescaledb/papertrader \
#     APP_PASSWORD=$(openssl rand -base64 24)
vault:
  secretPath: "secret/data/schwab-ddowell/timescaledb/papertrader"

metrics:
  port: 9090

# Pod-level cadences — apply to every book.
paperTrader:
  maxQuoteAge: 30s
  mtmInterval: 5s
  snapshotInterval: 60s

  # books is the list of isolated (strategy, cash, positions,
  # order_id) pools this pod runs concurrently. Phase-5 turns the
  # paper-trader from a single-book deployment into a research
  # utility where each book's cumulative P&L is directly comparable
  # against its siblings on shared Grafana panels.
  #
  # Each entry becomes one SimAdapter in the process. book_ids must
  # be globally unique across every paper-trader pod writing to the
  # same Timescale DB — they are the discriminator on paper_fills /
  # paper_positions / paper_cash.
  #
  # The two-book default is the phase-5 research question:
  # "does tighter alternator cadence pay?" — ddowell-alt-30s vs
  # ddowell-alt-60s on the same 24-symbol watchlist.
  #
  # Phase-5a.2 (2026-04-19) converged books[].symbols with
  # go-schwab-feed feed.watchlist. Source-of-truth catalog lives at
  # k8s/apps/schwab/watchlists/ddowell-individual.yaml.
  # Every symbol below must be in that catalog and in the feed's
  # watchlist — enforced by
  # .github/workflows/paper-trader-symbol-coverage-lint.yml.
  #
  # Phase-5b may curate per-book subsets for research reproducibility;
  # the ⊆ constraint (not ==) in the lint allows this without
  # template changes.
  #
  # Historical pre-phase-5 fills live under the sentinel
  # `ddowell-alt-v03` (applied by the one-shot schema migration's
  # DEFAULT clause; the clause is then dropped so future INSERTs
  # must specify book_id explicitly).
  books:
    - bookID: ddowell-alt-30s
      strategy: alternator
      quantity: 1
      alternatorCadence: 30s
      startingCash: 10000
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING
    - bookID: ddowell-alt-60s
      strategy: alternator
      quantity: 1
      alternatorCadence: 60s
      startingCash: 10000
      symbols:
        - AMD
        - AMZN
        - BNTX
        - BRK.B
        - DDOG
        - GE
        - GEHC
        - GEV
        - GMED
        - GOOG
        - GRMN
        - GTBIF
        - MDB
        - NU
        - NVDA
        - PANW
        - RNMBY
        - TEVA
        - TEX
        - U
        - UNH
        - UPS
        - V
        - WING

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 96Mi
