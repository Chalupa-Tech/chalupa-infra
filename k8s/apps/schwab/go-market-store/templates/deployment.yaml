apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-market-store
  labels:
    app: go-market-store
spec:
  replicas: 1
  progressDeadlineSeconds: 120
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: go-market-store
  template:
    metadata:
      labels:
        app: go-market-store
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until PGPASSWORD="$DB_PASSWORD" psql -h {{ .Values.database.host }} -p {{ .Values.database.port }} -U {{ .Values.database.user }} -d {{ .Values.database.name }} -c 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for database connectivity..."
                sleep 3
              done
              echo "database ready"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secrets
                  key: APP_PASSWORD
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: go-market-store
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secrets
                  key: APP_PASSWORD
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.database.user }}:$(DB_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=disable"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
