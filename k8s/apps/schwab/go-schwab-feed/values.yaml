---
image:
  registry: gitea.tailbecff0.ts.net
  repository: chalupa-tech/go-schwab-feed
  tag: v0.8.0

nats:
  url: "nats://nats.nats.svc.cluster.local:4222"

schwab:
  registration: "ddowell-individual"

vault:
  addr: "http://openbao.openbao.svc.cluster.local:8200"
  kubeRole: "schwab-ddowell-role"
  secretPath: "secret/data/schwab-ddowell/schwab"
  tokenPath: "secret/data/schwab-ddowell/tokens/individual"

metrics:
  port: 9090

feed:
  rateLimit: "100"
  quoteInterval: "10s"
  offHoursQuoteInterval: "5m"
  optionsInterval: "30m"
  positionInterval: "15m"
  historyInterval: "24h"
  intradayInterval: "30m"
  # Frozen 2026-04-19 (phase-5a.2). Source-of-truth is the catalog at
  # k8s/apps/schwab/watchlists/ddowell-individual.yaml — this string
  # must match the catalog's symbols list, enforced by
  # .github/workflows/paper-trader-symbol-coverage-lint.yml.
  # Paper-trader books[].symbols must be a subset of this list.
  watchlist: "AMD,AMZN,BNTX,BRK.B,DDOG,GE,GEHC,GEV,GMED,GOOG,GRMN,GTBIF,MDB,NU,NVDA,PANW,QQQ,RNMBY,SPY,TEVA,TEX,U,UNH,UPS,V,WING"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Daily history backfill CronJob (templates/backfill-cronjob.yaml).
# Requires image.tag >= v0.9.0.
backfill:
  enabled: true
  # After the extended session ends (20:00 ET), so the day's bars are
  # final. The binary also refuses to run while the market is open.
  schedule: "30 21 * * 1-5"
  timeZone: "America/New_York"
  # Requests per minute, separate from the live poller's feed.rateLimit.
  # The live poller is on its off-hours interval when this runs.
  rateLimit: "20"
  frequencies: "1d,30m,5m"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
