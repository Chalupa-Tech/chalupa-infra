{{- if .Values.backfill.enabled }}
# Daily history backfill: runs the feed image in its one-shot `backfill`
# mode, which requests the maximum history Schwab serves for every
# watchlist symbol and publishes it through the normal market.history
# path. go-market-store's upsert skips rows it already holds, so each
# run only writes new bars, plus re-adjusted history after a split.
#
# Requires go-schwab-feed >= v0.9.0. An older image ignores the
# `backfill` argument and would start a second full poller.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: go-schwab-feed-backfill
  labels:
    app: go-schwab-feed-backfill
spec:
  schedule: {{ .Values.backfill.schedule | quote }}
  timeZone: {{ .Values.backfill.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      # A failed run is retried once; the run is idempotent.
      backoffLimit: 1
      # A full run is about 370 Schwab requests; at 20 per minute that
      # is under 20 minutes. One hour bounds a stuck run.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: go-schwab-feed-backfill
        spec:
          restartPolicy: Never
          containers:
            - name: backfill
              image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              command: ["./main", "backfill"]
              env:
                - name: APP_VERSION
                  value: {{ .Values.image.tag | quote }}
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: "http://$(HOST_IP):4317"
                - name: NATS_URL
                  value: {{ .Values.nats.url | quote }}
                - name: SCHWAB_REGISTRATION
                  value: {{ .Values.schwab.registration | quote }}
                - name: VAULT_ADDR
                  value: {{ .Values.vault.addr | quote }}
                - name: VAULT_KUBE_ROLE
                  value: {{ .Values.vault.kubeRole | quote }}
                - name: VAULT_SECRET_PATH
                  value: {{ .Values.vault.secretPath | quote }}
                - name: VAULT_TOKEN_PATH
                  value: {{ .Values.vault.tokenPath | quote }}
                - name: RATE_LIMIT
                  value: {{ .Values.backfill.rateLimit | quote }}
                - name: BACKFILL_SYMBOLS
                  value: {{ .Values.feed.watchlist | quote }}
                - name: BACKFILL_FREQUENCIES
                  value: {{ .Values.backfill.frequencies | quote }}
              envFrom:
                - secretRef:
                    name: schwab-secrets
              resources:
                {{- toYaml .Values.backfill.resources | nindent 16 }}
{{- end }}
