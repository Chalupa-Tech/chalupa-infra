apiVersion: v1
kind: Service
metadata:
  name: go-schwab-auth
  labels:
    app: go-schwab-auth
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: go-schwab-auth
