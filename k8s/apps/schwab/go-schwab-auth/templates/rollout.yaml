apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-schwab-auth
  labels:
    app: go-schwab-auth
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-schwab-auth
  strategy:
    canary:
      analysis:
        templates:
          - templateName: go-schwab-auth-canary
        args:
          - name: pod-hash
            valueFrom:
              podTemplateHashValue: Latest
        startingStep: 0
      steps:
        - pause: { duration: 60s }
        - pause: { duration: 60s }
        - pause: { duration: 60s }
  template:
    metadata:
      labels:
        app: go-schwab-auth
    spec:
      serviceAccountName: go-schwab-auth
      containers:
        - name: go-schwab-auth
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
            - containerPort: {{ .Values.metrics.port }}
              name: metrics
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: VAULT_ROLE
              value: "{{ .Release.Namespace }}-auth-role"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: EXTERNAL_URL
              value: "https://schwab-auth.chalupatech.com"
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
