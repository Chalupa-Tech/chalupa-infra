apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-schwab-auth
  labels:
    app: go-schwab-auth
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: go-schwab-auth
  template:
    metadata:
      labels:
        app: go-schwab-auth
    spec:
      serviceAccountName: go-schwab-auth
      containers:
        - name: go-schwab-auth
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
            - name: VAULT_ROLE
              value: "{{ .Release.Namespace }}-auth-role"
            - name: NATS_URL
              value: {{ .Values.nats.url | quote }}
            - name: EXTERNAL_URL
              value: "https://schwab-auth.chalupatech.com"
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
