---
# Compatibility service — CloudNativePG creates timescaledb-rw, timescaledb-ro,
# timescaledb-r. This keeps the original "timescaledb" name working for
# go-market-store and Grafana without requiring downstream changes.
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
spec:
  type: ExternalName
  externalName: timescaledb-rw.{{ .Release.Namespace }}.svc.cluster.local
