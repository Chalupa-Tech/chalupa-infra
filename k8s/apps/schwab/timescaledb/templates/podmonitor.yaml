{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: timescaledb
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: timescaledb
  podMetricsEndpoints:
    - port: metrics
{{- end }}
