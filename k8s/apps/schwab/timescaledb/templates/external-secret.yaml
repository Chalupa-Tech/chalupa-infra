apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: postgres_password
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
    - secretKey: GRAFANA_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: grafana_password
