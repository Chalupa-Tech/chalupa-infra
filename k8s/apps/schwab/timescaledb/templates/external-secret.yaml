---
# App user secret — used by CloudNativePG managed role (needs "password" key)
# and by go-market-store (reads "APP_PASSWORD" key for backward compat).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-secrets
    creationPolicy: Merge
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
---
# Bootstrap SQL — creates roles with passwords during initdb. Managed roles
# reconciliation runs AFTER all bootstrap SQL, so roles must be created here
# for any GRANTs in schema.sql to succeed. Managed roles then take over
# ongoing password reconciliation after bootstrap completes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-init-roles
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-init-roles
    creationPolicy: Merge
    template:
      data:
        init-roles.sql: |
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.database.appUser }}') THEN
              CREATE ROLE {{ .Values.database.appUser }} WITH LOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.database.grafanaUser }}') THEN
              CREATE ROLE {{ .Values.database.grafanaUser }} WITH LOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.database.papertraderUser }}') THEN
              CREATE ROLE {{ .Values.database.papertraderUser }} WITH LOGIN;
            END IF;
          END $$;
          {{`{{- $appPw := .app_password | replace "'" "''" -}}`}}
          {{`{{- $grafanaPw := .grafana_password | replace "'" "''" -}}`}}
          {{`{{- $papertraderPw := .papertrader_password | replace "'" "''" -}}`}}
          ALTER ROLE {{ .Values.database.appUser }} WITH PASSWORD '{{`{{ $appPw }}`}}';
          ALTER ROLE {{ .Values.database.grafanaUser }} WITH PASSWORD '{{`{{ $grafanaPw }}`}}';
          ALTER ROLE {{ .Values.database.papertraderUser }} WITH PASSWORD '{{`{{ $papertraderPw }}`}}';
          GRANT pg_read_all_data, pg_write_all_data TO {{ .Values.database.appUser }};
          GRANT pg_read_all_data TO {{ .Values.database.grafanaUser }};
          -- papertrader owns what it creates (paper_fills, paper_positions,
          -- paper_cash) via EnsureSchema; only needs CREATE + USAGE on
          -- schema public. No per-table grants here — those tables don't
          -- exist at initdb time. See phase-4a retro for rationale.
          GRANT CREATE, USAGE ON SCHEMA public TO {{ .Values.database.papertraderUser }};
  data:
    - secretKey: app_password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
    - secretKey: grafana_password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: grafana_password
    - secretKey: papertrader_password
      remoteRef:
        key: {{ .Values.vault.papertraderSecretPath }}
        property: APP_PASSWORD
---
# Grafana read-only user secret — used by CloudNativePG managed role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-grafana-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-grafana-secret
    creationPolicy: Merge
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: grafana_password
---
# Papertrader user secret — used by CloudNativePG managed role for
# ongoing password reconciliation after bootstrap. The same password
# is projected into the go-paper-trader Deployment via its own
# ExternalSecret (papertrader-db-secrets in the go-paper-trader chart),
# which reads from the same vault path so both sides stay in sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-papertrader-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    # Owner (not Merge): this ExternalSecret was added after initial
    # cluster install, so the target Secret has never existed — Merge
    # would refuse to create it and UpdateFailed forever. The two
    # sibling ExternalSecrets (timescaledb-secrets, timescaledb-
    # grafana-secret) function today despite also spec'ing Merge only
    # because ESO originally created them under Owner at install time
    # and the policy flipped later. Owner here avoids that initial-
    # bootstrap dependency entirely; CNPG's managed-role flow only
    # reads the `password` key, which ESO populates fully.
    name: timescaledb-papertrader-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.papertraderSecretPath }}
        property: APP_PASSWORD
