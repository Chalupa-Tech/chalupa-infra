---
# App user secret — used by CloudNativePG managed role (needs "password" key)
# and by go-market-store (reads "APP_PASSWORD" key for backward compat).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: app_password
---
# Grafana read-only user secret — used by CloudNativePG managed role.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-grafana-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-grafana-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: grafana_password
