apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init-sql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  schema.sql: |
    -- Multi-frequency OHLCV candle data from Schwab price history API
    CREATE TABLE IF NOT EXISTS candles (
        time      TIMESTAMPTZ      NOT NULL,
        symbol    TEXT             NOT NULL,
        frequency TEXT             NOT NULL DEFAULT '1d',
        open      DOUBLE PRECISION,
        high      DOUBLE PRECISION,
        low       DOUBLE PRECISION,
        close     DOUBLE PRECISION,
        volume    BIGINT,
        source    TEXT DEFAULT 'schwab'
    );
    -- One-year chunks: daily bars go back decades (go-schwab-feed backfill),
    -- and the 7-day default would cut that history into thousands of
    -- near-empty chunks. The live database was switched on 2026-11-12 with
    -- set_chunk_time_interval; its 2026 chunks created before then stay 7-day.
    SELECT create_hypertable('candles', 'time', chunk_time_interval => INTERVAL '1 year', if_not_exists => TRUE);
    DROP INDEX IF EXISTS idx_candles_unique_3col;
    CREATE UNIQUE INDEX IF NOT EXISTS idx_candles_unique ON candles (time, symbol, frequency, source);
    CREATE INDEX IF NOT EXISTS idx_candles_symbol_freq_time ON candles (symbol, frequency, time DESC);

    -- Migration: widen unique constraint to include source (idempotent)
    -- Safe: existing rows all have source='schwab', so no duplicates
    DO $$ BEGIN
      -- Drop old 3-column unique index by any known name
      IF EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE tablename = 'candles'
        AND indexdef LIKE '%time%symbol%frequency%'
        AND indexdef NOT LIKE '%source%'
      ) THEN
        EXECUTE 'DROP INDEX IF EXISTS ' || (
          SELECT indexname FROM pg_indexes
          WHERE tablename = 'candles'
          AND indexdef LIKE '%time%symbol%frequency%'
          AND indexdef NOT LIKE '%source%'
          LIMIT 1
        );
      END IF;
      -- Recreate with 4 columns if needed
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE indexname = 'idx_candles_unique'
        AND indexdef LIKE '%source%'
      ) THEN
        CREATE UNIQUE INDEX idx_candles_unique ON candles (time, symbol, frequency, source);
      END IF;
    END $$;

    ALTER TABLE candles SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'symbol, frequency',
        timescaledb.compress_orderby = 'time DESC'
    );
    SELECT add_compression_policy('candles', INTERVAL '30 days', if_not_exists => true);

    -- Intraday quote snapshots (append-only, 30-day retention)
    CREATE TABLE IF NOT EXISTS quotes (
        time       TIMESTAMPTZ      NOT NULL,
        symbol     TEXT             NOT NULL,
        price      DOUBLE PRECISION,
        open_price DOUBLE PRECISION,
        high_price DOUBLE PRECISION,
        low_price  DOUBLE PRECISION,
        volume     BIGINT,
        change_pct DOUBLE PRECISION,
        bid        DOUBLE PRECISION,
        ask        DOUBLE PRECISION,
        source     TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('quotes', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_quotes_symbol_time ON quotes (symbol, time DESC);
    SELECT add_retention_policy('quotes', INTERVAL '30 days', if_not_exists => TRUE);

    ALTER TABLE quotes SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'symbol',
        timescaledb.compress_orderby = 'time DESC'
    );
    SELECT add_compression_policy('quotes', INTERVAL '7 days', if_not_exists => true);

    -- papertrader reads recorded quotes and stored candles to warm bar
    -- strategies at start-up (strategy-research phase 3b). SELECT on these
    -- two tables only: no pg_read_all_data, no views, no write.
    -- A grant on a hypertable covers its existing and future chunks.
    -- The role exists here because timescaledb-init-roles runs first.
    GRANT SELECT ON quotes, candles TO {{ .Values.database.papertraderUser }};

    -- No retention on candles: every frequency is kept forever.
    -- Intraday bars are research history that Schwab only serves for a
    -- limited lookback, so deleted rows cannot be re-fetched
    -- (strategy-research phase 2). The former cleanup_old_candles job
    -- (5m > 90 days, 1h > 1 year) was removed from the live database
    -- with delete_job + DROP FUNCTION; do not reintroduce it.

    -- Continuous aggregate: derive 5-minute candles from quote snapshots
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_from_quotes
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('5 minutes', time) AS time,
      symbol,
      '5m'::text AS frequency,
      first(price, time) AS open,
      max(price) AS high,
      min(price) AS low,
      last(price, time) AS close,
      max(volume) - min(volume) AS volume,
      'quote'::text AS source
    FROM quotes
    WHERE price > 0
    GROUP BY 1, 2
    WITH NO DATA;

    SELECT add_continuous_aggregate_policy('candles_from_quotes',
      start_offset => INTERVAL '1 day',
      end_offset => INTERVAL '5 minutes',
      schedule_interval => INTERVAL '5 minutes',
      if_not_exists => TRUE);

    -- Enable real-time aggregation (queries see data beyond last refresh)
    ALTER MATERIALIZED VIEW candles_from_quotes SET (timescaledb.materialized_only = false);

    -- Hierarchical continuous aggregate: 1-hour candles from 5-minute candles
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_1h
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 hour', time) AS time,
      symbol,
      '1h'::text AS frequency,
      first(open, time) AS open,
      max(high) AS high,
      min(low) AS low,
      last(close, time) AS close,
      sum(volume) AS volume,
      'quote'::text AS source
    FROM candles_from_quotes
    GROUP BY 1, 2
    WITH NO DATA;

    ALTER MATERIALIZED VIEW candles_1h SET (timescaledb.materialized_only = false);

    SELECT add_continuous_aggregate_policy('candles_1h',
      start_offset => INTERVAL '3 days',
      end_offset => INTERVAL '1 hour',
      schedule_interval => INTERVAL '1 hour',
      if_not_exists => TRUE);

    -- Hierarchical continuous aggregate: 1-day candles from 1-hour candles
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_1d
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 day', time) AS time,
      symbol,
      '1d'::text AS frequency,
      first(open, time) AS open,
      max(high) AS high,
      min(low) AS low,
      last(close, time) AS close,
      sum(volume) AS volume,
      'quote'::text AS source
    FROM candles_1h
    GROUP BY 1, 2
    WITH NO DATA;

    ALTER MATERIALIZED VIEW candles_1d SET (timescaledb.materialized_only = false);

    SELECT add_continuous_aggregate_policy('candles_1d',
      start_offset => INTERVAL '7 days',
      end_offset => INTERVAL '1 day',
      schedule_interval => INTERVAL '1 day',
      if_not_exists => TRUE);

    -- Periodic job: merge quote-derived candles into main candles table
    -- Drop zero-arg overload if it exists (prevents "function is not unique" when job scheduler invokes with jsonb config)
    DROP FUNCTION IF EXISTS merge_quote_candles();
    DROP FUNCTION IF EXISTS merge_quote_candles(jsonb);
    CREATE OR REPLACE FUNCTION merge_quote_candles(job_id INT, config JSONB) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_from_quotes
      WHERE time > now() - INTERVAL '1 day'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles', INTERVAL '5 minutes');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Periodic job: merge 1-hour quote-derived candles into main candles table
    DROP FUNCTION IF EXISTS merge_quote_candles_1h();
    DROP FUNCTION IF EXISTS merge_quote_candles_1h(jsonb);
    CREATE OR REPLACE FUNCTION merge_quote_candles_1h(job_id INT, config JSONB) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_1h
      WHERE time > now() - INTERVAL '3 days'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles_1h', INTERVAL '1 hour');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Periodic job: merge 1-day quote-derived candles into main candles table
    DROP FUNCTION IF EXISTS merge_quote_candles_1d();
    DROP FUNCTION IF EXISTS merge_quote_candles_1d(jsonb);
    CREATE OR REPLACE FUNCTION merge_quote_candles_1d(job_id INT, config JSONB) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_1d
      WHERE time > now() - INTERVAL '7 days'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles_1d', INTERVAL '1 day');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Order history from Schwab API
    CREATE TABLE IF NOT EXISTS orders (
        time           TIMESTAMPTZ      NOT NULL,
        order_id       BIGINT           NOT NULL,
        symbol         TEXT             NOT NULL,
        side           TEXT,
        order_type     TEXT,
        status         TEXT,
        quantity       DOUBLE PRECISION,
        filled_qty     DOUBLE PRECISION,
        price          DOUBLE PRECISION,
        filled_price   DOUBLE PRECISION,
        entered_time   TIMESTAMPTZ,
        filled_time    TIMESTAMPTZ,
        source         TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('orders', 'time', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS idx_orders_unique ON orders (order_id, time);
    CREATE INDEX IF NOT EXISTS idx_orders_symbol_time ON orders (symbol, time DESC);
    SELECT add_retention_policy('orders', INTERVAL '1 year', if_not_exists => TRUE);

    -- Transaction history from Schwab API
    CREATE TABLE IF NOT EXISTS transactions (
        time             TIMESTAMPTZ      NOT NULL,
        transaction_id   BIGINT           NOT NULL,
        symbol           TEXT,
        type             TEXT,
        amount           DOUBLE PRECISION,
        net_amount       DOUBLE PRECISION,
        description      TEXT,
        trade_date       TIMESTAMPTZ,
        settle_date      TIMESTAMPTZ,
        source           TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('transactions', 'time', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS idx_transactions_unique ON transactions (transaction_id, time);
    SELECT add_retention_policy('transactions', INTERVAL '2 years', if_not_exists => TRUE);
    -- Top movers by index from Schwab API
    CREATE TABLE IF NOT EXISTS movers (
        time          TIMESTAMPTZ      NOT NULL,
        index_symbol  TEXT             NOT NULL,
        symbol        TEXT             NOT NULL,
        description   TEXT,
        direction     TEXT,
        change        DOUBLE PRECISION,
        change_pct    DOUBLE PRECISION,
        volume        BIGINT,
        source        TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('movers', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_movers_index_time ON movers (index_symbol, time DESC);
    SELECT add_retention_policy('movers', INTERVAL '90 days', if_not_exists => TRUE);

    -- Reconciliation view: compare quote-derived vs historical candles
    -- Computes relative variance for close, high, low where both sources overlap
    CREATE OR REPLACE VIEW candle_source_variance AS
    SELECT
      h.time,
      h.symbol,
      h.frequency,
      h.close  AS hist_close,
      q.close  AS quote_close,
      h.high   AS hist_high,
      q.high   AS quote_high,
      h.low    AS hist_low,
      q.low    AS quote_low,
      CASE WHEN h.close != 0 THEN ABS(h.close - q.close) / ABS(h.close) ELSE NULL END AS close_variance,
      CASE WHEN h.high  != 0 THEN ABS(h.high  - q.high)  / ABS(h.high)  ELSE NULL END AS high_variance,
      CASE WHEN h.low   != 0 THEN ABS(h.low   - q.low)   / ABS(h.low)   ELSE NULL END AS low_variance
    FROM candles h
    JOIN candles q
      ON h.time = q.time
      AND h.symbol = q.symbol
      AND h.frequency = q.frequency
    WHERE h.source = 'ddowell-individual'
      AND q.source = 'quote';

    -- Backfill gap detection: 5m quote candles with no matching historical data
    -- Scoped to 5m only — ddowell-individual has no 1h data, and 1d buckets differ
    -- between sources (see candle_backfill_gaps_1d below for the 1d version).
    -- Uses `q.source = 'quote'` only (authoritative). `quote-derived` is excluded
    -- because derived rows can be flawed and would inflate false-positive gap counts.
    CREATE OR REPLACE VIEW candle_backfill_gaps AS
    SELECT
      q.time,
      q.symbol,
      q.frequency,
      q.close AS quote_close,
      now() - q.time AS age
    FROM candles q
    LEFT JOIN candles h
      ON q.time = h.time
      AND q.symbol = h.symbol
      AND q.frequency = h.frequency
      AND h.source = 'ddowell-individual'
    WHERE q.source = 'quote'
      AND q.frequency = '5m'
      AND h.time IS NULL
      AND q.time < now() - INTERVAL '4 hours'
      -- A quote candle with zero volume is how the quote side fills an interval
      -- with no trades; the historical source omits such intervals, so only a
      -- candle with volume can be a missing historical row. (Not high <> low:
      -- trades at a single price also give a flat candle.)
      AND COALESCE(q.volume, 0) > 0
      -- Only report gaps on trading days: some historical 5m row (any symbol)
      -- must exist on the same America/Chicago day. Weekends, holidays and days
      -- the historical backfill has not reached yet are not gaps.
      AND EXISTS (
        SELECT 1 FROM candles hd
        WHERE hd.frequency = '5m'
          AND hd.source = 'ddowell-individual'
          AND hd.time >= date_trunc('day', q.time AT TIME ZONE 'America/Chicago') AT TIME ZONE 'America/Chicago'
          AND hd.time <  (date_trunc('day', q.time AT TIME ZONE 'America/Chicago') + INTERVAL '1 day') AT TIME ZONE 'America/Chicago'
      );

    -- Bucket-aligned 1d reconciliation (phase-12).
    -- Historical 1d candles are anchored at local midnight America/Chicago
    -- (05:00 UTC in CDT, 06:00 UTC in CST); quote 1d candles at 00:00 UTC.
    -- No timestamps ever match, so join on the calendar date of each side:
    -- historical date = Chicago date, quote date = UTC date.
    -- Do NOT use time_bucket(..., 'America/New_York') on the quote side: 00:00 UTC
    -- is 19:00/20:00 ET the previous day, which shifts every pair by one day.
    -- Quote candles on weekends and holidays have no historical counterpart and
    -- drop out of the inner join, as intended.
    CREATE OR REPLACE VIEW candle_source_variance_1d AS
    SELECT
      h.time,
      h.symbol,
      h.frequency,
      h.close  AS hist_close,
      q.close  AS quote_close,
      h.high   AS hist_high,
      q.high   AS quote_high,
      h.low    AS hist_low,
      q.low    AS quote_low,
      CASE WHEN h.close != 0 THEN ABS(h.close - q.close) / ABS(h.close) ELSE NULL END AS close_variance,
      CASE WHEN h.high  != 0 THEN ABS(h.high  - q.high)  / ABS(h.high)  ELSE NULL END AS high_variance,
      CASE WHEN h.low   != 0 THEN ABS(h.low   - q.low)   / ABS(h.low)   ELSE NULL END AS low_variance
    FROM candles h
    JOIN candles q
      ON h.symbol = q.symbol
      AND h.frequency = q.frequency
      AND (h.time AT TIME ZONE 'America/Chicago')::date = (q.time AT TIME ZONE 'UTC')::date
    WHERE h.frequency = '1d'
      AND h.source = 'ddowell-individual'
      AND q.source = 'quote';

    -- 1d backfill gaps: a quote 1d candle whose trading day has historical rows
    -- for other symbols but none for this one. Weekends, holidays and days the
    -- historical backfill has not reached yet have no historical rows for any
    -- symbol, so they are not reported as gaps.
    CREATE OR REPLACE VIEW candle_backfill_gaps_1d AS
    SELECT
      q.time,
      q.symbol,
      q.frequency,
      q.close AS quote_close,
      now() - q.time AS age
    FROM candles q
    WHERE q.source = 'quote'
      AND q.frequency = '1d'
      -- Give the daily historical backfill two days before judging a day.
      AND q.time < now() - INTERVAL '2 days'
      AND EXISTS (
        SELECT 1 FROM candles hd
        WHERE hd.frequency = '1d'
          AND hd.source = 'ddowell-individual'
          AND (hd.time AT TIME ZONE 'America/Chicago')::date = (q.time AT TIME ZONE 'UTC')::date
      )
      AND NOT EXISTS (
        SELECT 1 FROM candles h
        WHERE h.symbol = q.symbol
          AND h.frequency = '1d'
          AND h.source = 'ddowell-individual'
          AND (h.time AT TIME ZONE 'America/Chicago')::date = (q.time AT TIME ZONE 'UTC')::date
      );

    -- Bucket-aligned 1h reconciliation (phase-12).
    -- ddowell-individual has no 1h candles (Schwab pricehistory offers minute
    -- frequencies 1, 5, 10, 15 and 30 only), so build the historical hour from
    -- its two 30m candles and compare it with the quote 1h candle. Both sides
    -- start on the UTC hour, so they join on time. Hours with only one 30m
    -- candle are skipped: their high, low and close would cover half an hour.
    CREATE OR REPLACE VIEW candle_source_variance_1h AS
    WITH h AS (
      SELECT
        symbol,
        time_bucket('1 hour', time) AS hr,
        MAX(high) AS high,
        MIN(low) AS low,
        (array_agg(close ORDER BY time DESC))[1] AS close
      FROM candles
      WHERE frequency = '30m'
        AND source = 'ddowell-individual'
      GROUP BY symbol, time_bucket('1 hour', time)
      HAVING COUNT(*) = 2
    )
    SELECT
      q.time,
      q.symbol,
      q.frequency,
      h.close  AS hist_close,
      q.close  AS quote_close,
      h.high   AS hist_high,
      q.high   AS quote_high,
      h.low    AS hist_low,
      q.low    AS quote_low,
      CASE WHEN h.close != 0 THEN ABS(h.close - q.close) / ABS(h.close) ELSE NULL END AS close_variance,
      CASE WHEN h.high  != 0 THEN ABS(h.high  - q.high)  / ABS(h.high)  ELSE NULL END AS high_variance,
      CASE WHEN h.low   != 0 THEN ABS(h.low   - q.low)   / ABS(h.low)   ELSE NULL END AS low_variance
    FROM h
    JOIN candles q
      ON q.symbol = h.symbol
      AND q.time = h.hr
    WHERE q.frequency = '1h'
      AND q.source = 'quote';

    -- 1h backfill gaps: a quote 1h candle with volume, in an hour where other
    -- symbols have 30m historical candles but this one has none. Zero-volume
    -- quote candles are the quote side's fill for no trades and are not gaps.
    CREATE OR REPLACE VIEW candle_backfill_gaps_1h AS
    SELECT
      q.time,
      q.symbol,
      q.frequency,
      q.close AS quote_close,
      now() - q.time AS age
    FROM candles q
    WHERE q.source = 'quote'
      AND q.frequency = '1h'
      AND COALESCE(q.volume, 0) > 0
      AND q.time < now() - INTERVAL '4 hours'
      AND EXISTS (
        SELECT 1 FROM candles hd
        WHERE hd.frequency = '30m'
          AND hd.source = 'ddowell-individual'
          AND hd.time >= q.time
          AND hd.time <  q.time + INTERVAL '1 hour'
      )
      AND NOT EXISTS (
        SELECT 1 FROM candles h
        WHERE h.symbol = q.symbol
          AND h.frequency = '30m'
          AND h.source = 'ddowell-individual'
          AND h.time >= q.time
          AND h.time <  q.time + INTERVAL '1 hour'
      );
