apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init-sql
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  schema.sql: |
    -- Multi-frequency OHLCV candle data from Schwab price history API
    CREATE TABLE IF NOT EXISTS candles (
        time      TIMESTAMPTZ      NOT NULL,
        symbol    TEXT             NOT NULL,
        frequency TEXT             NOT NULL DEFAULT '1d',
        open      DOUBLE PRECISION,
        high      DOUBLE PRECISION,
        low       DOUBLE PRECISION,
        close     DOUBLE PRECISION,
        volume    BIGINT,
        source    TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('candles', 'time', if_not_exists => TRUE);
    DROP INDEX IF EXISTS idx_candles_unique_3col;
    CREATE UNIQUE INDEX IF NOT EXISTS idx_candles_unique ON candles (time, symbol, frequency, source);
    CREATE INDEX IF NOT EXISTS idx_candles_symbol_freq_time ON candles (symbol, frequency, time DESC);

    -- Migration: widen unique constraint to include source (idempotent)
    -- Safe: existing rows all have source='schwab', so no duplicates
    DO $$ BEGIN
      -- Drop old 3-column unique index by any known name
      IF EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE tablename = 'candles'
        AND indexdef LIKE '%time%symbol%frequency%'
        AND indexdef NOT LIKE '%source%'
      ) THEN
        EXECUTE 'DROP INDEX IF EXISTS ' || (
          SELECT indexname FROM pg_indexes
          WHERE tablename = 'candles'
          AND indexdef LIKE '%time%symbol%frequency%'
          AND indexdef NOT LIKE '%source%'
          LIMIT 1
        );
      END IF;
      -- Recreate with 4 columns if needed
      IF NOT EXISTS (
        SELECT 1 FROM pg_indexes
        WHERE indexname = 'idx_candles_unique'
        AND indexdef LIKE '%source%'
      ) THEN
        CREATE UNIQUE INDEX idx_candles_unique ON candles (time, symbol, frequency, source);
      END IF;
    END $$;

    ALTER TABLE candles SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'symbol, frequency',
        timescaledb.compress_orderby = 'time DESC'
    );
    SELECT add_compression_policy('candles', INTERVAL '30 days', if_not_exists => true);

    -- Intraday quote snapshots (append-only, 30-day retention)
    CREATE TABLE IF NOT EXISTS quotes (
        time       TIMESTAMPTZ      NOT NULL,
        symbol     TEXT             NOT NULL,
        price      DOUBLE PRECISION,
        open_price DOUBLE PRECISION,
        high_price DOUBLE PRECISION,
        low_price  DOUBLE PRECISION,
        volume     BIGINT,
        change_pct DOUBLE PRECISION,
        bid        DOUBLE PRECISION,
        ask        DOUBLE PRECISION,
        source     TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('quotes', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_quotes_symbol_time ON quotes (symbol, time DESC);
    SELECT add_retention_policy('quotes', INTERVAL '30 days', if_not_exists => TRUE);

    ALTER TABLE quotes SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'symbol',
        timescaledb.compress_orderby = 'time DESC'
    );
    SELECT add_compression_policy('quotes', INTERVAL '7 days', if_not_exists => true);

    -- Frequency-based retention (daily candles kept forever)
    CREATE OR REPLACE FUNCTION cleanup_old_candles(config jsonb DEFAULT NULL) RETURNS void AS $$
    BEGIN
        DELETE FROM candles WHERE frequency = '5m' AND time < now() - INTERVAL '90 days';
        DELETE FROM candles WHERE frequency = '1h' AND time < now() - INTERVAL '1 year';
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('cleanup_old_candles', INTERVAL '1 day');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Continuous aggregate: derive 5-minute candles from quote snapshots
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_from_quotes
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('5 minutes', time) AS time,
      symbol,
      '5m'::text AS frequency,
      first(price, time) AS open,
      max(price) AS high,
      min(price) AS low,
      last(price, time) AS close,
      max(volume) - min(volume) AS volume,
      'quote'::text AS source
    FROM quotes
    WHERE price > 0
    GROUP BY 1, 2
    WITH NO DATA;

    SELECT add_continuous_aggregate_policy('candles_from_quotes',
      start_offset => INTERVAL '1 day',
      end_offset => INTERVAL '5 minutes',
      schedule_interval => INTERVAL '5 minutes',
      if_not_exists => TRUE);

    -- Enable real-time aggregation (queries see data beyond last refresh)
    ALTER MATERIALIZED VIEW candles_from_quotes SET (timescaledb.materialized_only = false);

    -- Hierarchical continuous aggregate: 1-hour candles from 5-minute candles
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_1h
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 hour', time) AS time,
      symbol,
      '1h'::text AS frequency,
      first(open, time) AS open,
      max(high) AS high,
      min(low) AS low,
      last(close, time) AS close,
      sum(volume) AS volume,
      'quote'::text AS source
    FROM candles_from_quotes
    GROUP BY 1, 2
    WITH NO DATA;

    ALTER MATERIALIZED VIEW candles_1h SET (timescaledb.materialized_only = false);

    SELECT add_continuous_aggregate_policy('candles_1h',
      start_offset => INTERVAL '3 days',
      end_offset => INTERVAL '1 hour',
      schedule_interval => INTERVAL '1 hour',
      if_not_exists => TRUE);

    -- Hierarchical continuous aggregate: 1-day candles from 1-hour candles
    CREATE MATERIALIZED VIEW IF NOT EXISTS candles_1d
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 day', time) AS time,
      symbol,
      '1d'::text AS frequency,
      first(open, time) AS open,
      max(high) AS high,
      min(low) AS low,
      last(close, time) AS close,
      sum(volume) AS volume,
      'quote'::text AS source
    FROM candles_1h
    GROUP BY 1, 2
    WITH NO DATA;

    ALTER MATERIALIZED VIEW candles_1d SET (timescaledb.materialized_only = false);

    SELECT add_continuous_aggregate_policy('candles_1d',
      start_offset => INTERVAL '7 days',
      end_offset => INTERVAL '1 day',
      schedule_interval => INTERVAL '1 day',
      if_not_exists => TRUE);

    -- Periodic job: merge quote-derived candles into main candles table
    -- Drop zero-arg overload if it exists (prevents "function is not unique" when job scheduler invokes with jsonb config)
    DROP FUNCTION IF EXISTS merge_quote_candles();
    CREATE OR REPLACE FUNCTION merge_quote_candles(config jsonb DEFAULT NULL) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_from_quotes
      WHERE time > now() - INTERVAL '1 day'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles', INTERVAL '5 minutes');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Periodic job: merge 1-hour quote-derived candles into main candles table
    DROP FUNCTION IF EXISTS merge_quote_candles_1h();
    CREATE OR REPLACE FUNCTION merge_quote_candles_1h(config jsonb DEFAULT NULL) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_1h
      WHERE time > now() - INTERVAL '3 days'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles_1h', INTERVAL '1 hour');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Periodic job: merge 1-day quote-derived candles into main candles table
    DROP FUNCTION IF EXISTS merge_quote_candles_1d();
    CREATE OR REPLACE FUNCTION merge_quote_candles_1d(config jsonb DEFAULT NULL) RETURNS void AS $$
    BEGIN
      INSERT INTO candles (time, symbol, frequency, open, high, low, close, volume, source)
      SELECT time, symbol, frequency, open, high, low, close, volume, source
      FROM candles_1d
      WHERE time > now() - INTERVAL '7 days'
      ON CONFLICT (time, symbol, frequency, source) DO UPDATE SET
        open = EXCLUDED.open, high = EXCLUDED.high, low = EXCLUDED.low,
        close = EXCLUDED.close, volume = EXCLUDED.volume;
    END;
    $$ LANGUAGE plpgsql;
    DO $$ BEGIN
      PERFORM add_job('merge_quote_candles_1d', INTERVAL '1 day');
    EXCEPTION WHEN duplicate_object THEN NULL;
    END $$;

    -- Order history from Schwab API
    CREATE TABLE IF NOT EXISTS orders (
        time           TIMESTAMPTZ      NOT NULL,
        order_id       BIGINT           NOT NULL,
        symbol         TEXT             NOT NULL,
        side           TEXT,
        order_type     TEXT,
        status         TEXT,
        quantity       DOUBLE PRECISION,
        filled_qty     DOUBLE PRECISION,
        price          DOUBLE PRECISION,
        filled_price   DOUBLE PRECISION,
        entered_time   TIMESTAMPTZ,
        filled_time    TIMESTAMPTZ,
        source         TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('orders', 'time', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS idx_orders_unique ON orders (order_id, time);
    CREATE INDEX IF NOT EXISTS idx_orders_symbol_time ON orders (symbol, time DESC);
    SELECT add_retention_policy('orders', INTERVAL '1 year', if_not_exists => TRUE);

    -- Transaction history from Schwab API
    CREATE TABLE IF NOT EXISTS transactions (
        time             TIMESTAMPTZ      NOT NULL,
        transaction_id   BIGINT           NOT NULL,
        symbol           TEXT,
        type             TEXT,
        amount           DOUBLE PRECISION,
        net_amount       DOUBLE PRECISION,
        description      TEXT,
        trade_date       TIMESTAMPTZ,
        settle_date      TIMESTAMPTZ,
        source           TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('transactions', 'time', if_not_exists => TRUE);
    CREATE UNIQUE INDEX IF NOT EXISTS idx_transactions_unique ON transactions (transaction_id, time);
    SELECT add_retention_policy('transactions', INTERVAL '2 years', if_not_exists => TRUE);
    -- Top movers by index from Schwab API
    CREATE TABLE IF NOT EXISTS movers (
        time          TIMESTAMPTZ      NOT NULL,
        index_symbol  TEXT             NOT NULL,
        symbol        TEXT             NOT NULL,
        description   TEXT,
        direction     TEXT,
        change        DOUBLE PRECISION,
        change_pct    DOUBLE PRECISION,
        volume        BIGINT,
        source        TEXT DEFAULT 'schwab'
    );
    SELECT create_hypertable('movers', 'time', if_not_exists => TRUE);
    CREATE INDEX IF NOT EXISTS idx_movers_index_time ON movers (index_symbol, time DESC);
    SELECT add_retention_policy('movers', INTERVAL '90 days', if_not_exists => TRUE);
