# Password for the `migrator` managed role (superuser, used only by the
# timescaledb-migrate Job). The operator writes this OpenBao key before the
# first sync; until it exists this ExternalSecret is unhealthy and the sync
# waits. Owner, not Merge: the target Secret has never existed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: timescaledb-migrator-secret
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: timescaledb-migrator-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vault.migratorSecretPath }}
        property: password
