apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-telemetry-mesh
  namespace: go-telemetry-mesh
  labels:
    app: go-telemetry-mesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-telemetry-mesh
  template:
    metadata:
      labels:
        app: go-telemetry-mesh
    spec:
      containers:
      - name: mesh
        image: registry.chalupa.local:5000/go-telemetry-mesh:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://observability-collector.observability.svc.cluster.local:4317"
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-telemetry-mesh
  namespace: go-telemetry-mesh
  labels:
    app: go-telemetry-mesh
spec:
  selector:
    app: go-telemetry-mesh
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
