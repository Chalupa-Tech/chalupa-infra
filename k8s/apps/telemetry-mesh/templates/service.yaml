apiVersion: v1
kind: Service
metadata:
  name: telemetry-mesh
  labels:
    app: telemetry-mesh
spec:
  clusterIP: None
  ports:
    - name: grpc
      port: {{ .Values.grpcPort }}
      targetPort: {{ .Values.grpcPort }}
      protocol: TCP
    - name: http
      port: {{ .Values.httpPort }}
      targetPort: {{ .Values.httpPort }}
      protocol: TCP
  selector:
    app: telemetry-mesh
