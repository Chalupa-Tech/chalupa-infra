victoria-logs-single:
  server:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    persistentVolume:
      enabled: true
      size: 10Gi
      storageClassName: longhorn-single

    retentionPeriod: 14d

    # Stateful: keep the pod and its Longhorn volume in site-dpi, never on tpi1.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [site-dpi]
                - key: compute-class
                  operator: In
                  values: [pi5]
