nats:
  config:
    cluster:
      enabled: true
      replicas: 3

    jetstream:
      enabled: true
      fileStore:
        enabled: true
        dir: /data
        pvc:
          enabled: true
          size: 1Gi
          # Must match the live StatefulSet: volumeClaimTemplates is immutable,
          # and a different class here (longhorn-single, 2026-04 to 2026-11)
          # makes every ArgoCD diff fail, so the app never syncs. Changing the
          # class means recreating the StatefulSet with --cascade=orphan.
          storageClassName: longhorn
        maxSize: 1Gi

  container:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi

  podTemplate:
    # One member per node. No zone spread: the JetStream volumes are Longhorn and
    # must stay in site-dpi (2026-11-17 incident), so all three members share a zone.
    topologySpreadConstraints:
      kubernetes.io/hostname:
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
    merge:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: topology.kubernetes.io/zone
                      operator: In
                      values: [site-dpi]
                    - key: compute-class
                      operator: In
                      values: [pi5]

  reloader:
    enabled: true

  # Disable nats-box in production; use for debugging only.
  natsBox:
    enabled: false

  # ClusterIP only — no external exposure. Add auth when threat model changes.
  service:
    enabled: true
    ports:
      nats:
        enabled: true
