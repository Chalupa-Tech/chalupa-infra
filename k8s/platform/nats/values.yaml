nats:
  config:
    cluster:
      enabled: true
      replicas: 3

    jetstream:
      enabled: true
      fileStore:
        enabled: true
        dir: /data
        pvc:
          enabled: true
          size: 1Gi
          storageClassName: longhorn
        maxSize: 1Gi

  container:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi

  podTemplate:
    topologySpreadConstraints:
      topology.kubernetes.io/zone:
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway
      kubernetes.io/hostname:
        maxSkew: 1
        whenUnsatisfiable: ScheduleAnyway

  reloader:
    enabled: true

  # Disable nats-box in production; use for debugging only.
  natsBox:
    enabled: false

  # ClusterIP only — no external exposure. Add auth when threat model changes.
  service:
    enabled: true
    ports:
      nats:
        enabled: true
