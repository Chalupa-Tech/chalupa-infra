victoria-metrics-k8s-stack:
  # Required for correct service discovery when deployed via ArgoCD ApplicationSet
  argocdReleaseOverride: "observability"
  # Shorten resource names — default includes full chart name which exceeds
  # the 63-char K8s name limit (e.g. observability-victoria-metrics-k8s-stack-kube-controller-manager)
  fullnameOverride: "vmstack"

  ## VMSingle — replaces Prometheus
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "14d"
      replicaCount: 1
      extraArgs:
        search.maxConcurrentRequests: "4"
        search.maxQueueDuration: "30s"
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-single
        resources:
          requests:
            storage: 20Gi

  ## VMOperator — converts ServiceMonitor CRDs to VM scrape configs
  victoria-metrics-operator:
    enabled: true
    operator:
      disable_prometheus_converter: false
    admissionWebhooks:
      certManager:
        enabled: true
    nodeSelector:
      compute-class: pi5

  ## Grafana
  grafana:
    enabled: true
    replicas: 1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    persistence:
      enabled: false
    # Pin admin credentials to OpenBao-backed Secret so Grafana resets its
    # SQLite admin hash from env vars on every pod boot. See
    # docs/service-account-framework.md Appendix A and ADR-008.
    admin:
      existingSecret: grafana-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 30
      periodSeconds: 30
    sidecar:
      dashboards:
        enabled: true
        # Skip the reload API call — Grafana's file provisioner watches
        # the dashboard directory and reloads on file changes automatically.
        # The sidecar reload was failing with 401 due to admin password
        # drift between the Helm secret and Grafana's SQLite DB.
        skipReload: true
    plugins:
      - victoriametrics-logs-datasource
      - victoriametrics-metrics-datasource
      - yesoreyeram-infinity-datasource
    envFromSecret: "grafana-oidc-secret"
    env:
      GF_DEFAULT_APP_TITLE: "Chalupa Infra"
    grafana.ini:
      # NOTE: plugins.preinstall_sync is handled by the Helm chart's `plugins:`
      # list above — it sets GF_PLUGINS_PREINSTALL_SYNC env var automatically.
      # Do NOT add a [plugins] section here; grafana.ini `preinstall` puts
      # plugins in the ASYNC queue which conflicts with the sync env var.
      # Disable bundled plugins that require Tempo/Loki backends
      "plugin.grafana-exploretraces-app":
        enabled: false
      "plugin.grafana-lokiexplore-app":
        enabled: false
      "plugin.grafana-pyroscope-app":
        enabled: false
      "plugin.grafana-metricsdrilldown-app":
        enabled: false
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/default/cluster-overview.json
      unified_alerting:
        enabled: true
      server:
        root_url: "https://grafana.chalupatech.com/"
        serve_from_sub_path: false
      auth:
        signout_redirect_url: "https://grafana.chalupatech.com/"
        disable_brute_force_login_protection: true
      auth.generic_oauth:
        enabled: true
        name: OpenBao
        allow_sign_up: true
        auto_login: true
        scopes: openid user
        auth_url: "https://openbao.chalupatech.com/ui/vault/identity/oidc/provider/default/authorize"
        token_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/token"
        api_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/userinfo"
        login_attribute_path: username
        role_attribute_path: grafana_role
        skip_org_role_sync: false
    resources:
      requests:
        cpu: 20m
        memory: 256Mi
      limits:
        memory: 1Gi
    # Side-pod that renders panels/dashboards to PNG. Wires the Grafana
    # pod's GF_RENDERING_SERVER_URL automatically. Sized for occasional
    # single-user snapshots (mcp__grafana__get_panel_image), not
    # production rendering — Grafana docs recommend 16 GiB / 4 cores
    # for that workload, well above what a Pi5 can give. If dense
    # dashboards OOM, raise the limit or skip those panels rather than
    # over-provisioning across the cluster.
    imageRenderer:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

  ## ── K8s internal scrapes ──────────────────────────────────────────
  ## Toggle: set enabled: false to disable any scrape entirely.

  kubelet:
    enabled: true
    vmScrape:
      spec:
        metricRelabelConfigs:
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)

  # yamllint disable rule:comments-indentation
  kubeApiServer:
    enabled: true   # toggle apiserver scraping
    vmScrape:
      spec:
        endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
        jobLabel: component
        namespaceSelector:
          matchNames: [default]
        selector:
          matchLabels: {component: apiserver, provider: kubernetes}

  # K3s embeds etcd/controller-manager/scheduler — no standalone pods exist.
  # Disabled here; replaced by VMNodeScrape resources in templates/ that
  # auto-discover server nodes by label (zero hardcoded IPs).
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  # yamllint enable rule:comments-indentation

  ## Datasource overrides
  defaultDatasources:
    alertmanager:
      datasources:
        - name: Alertmanager
          access: proxy
          jsonData:
            implementation: prometheus
            handleGrafanaManagedAlerts: true

  ## Dashboards
  defaultDashboards:
    enabled: true
    dashboards:
      node-exporter-full:
        enabled: false
      # Grafana-native alerting is intentionally off (vmalert is sole engine).
      # The upstream dashboard's "Firing Alerts" panel queries
      # grafana_alerting_result_total, which has zero series in this cluster —
      # disable the whole dashboard rather than ship a misleading "0 firing"
      # number. See docs/grafana-dashboards.md §15.
      grafana-overview:
        enabled: false

  ## Alertmanager
  alertmanager:
    enabled: true
    spec:
      configSecret: vmalertmanager-config
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

  ## VMAgent — scrapes targets and forwards to VMSingle
  vmagent:
    spec:
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 500Mi

  ## VMAlert — evaluates alert rules and sends to Alertmanager
  vmalert:
    spec:
      extraArgs:
        external.url: "https://grafana.chalupatech.com"

  ## Default alert rules — disable noisy defaults
  defaultRules:
    rules:
      vmoperator: false
      etcd: false                  # K3s-embedded — custom VMNodeScrape handles monitoring
      kubeScheduler: false         # K3s-embedded — custom VMNodeScrape handles monitoring
      kubeControllerManager: false # K3s-embedded — custom VMNodeScrape handles monitoring

      # Tune vmagent alerts — defaults fire on >0 errors which is too sensitive
      # during canary rollouts / pod churn. Thresholds set to tolerate a single
      # bad canary's scrape failures through the 10min progressDeadlineSeconds.
      TooManyScrapeErrors:
        spec:
          expr: increase(vm_promscrape_scrapes_failed_total[5m]) > 50
          for: 20m
      TooManyLogs:
        spec:
          expr: >-
            sum(increase(vm_log_messages_total{level!="info"}[5m])) without(app_version,location,is_printed) > 30
          for: 20m

  ## Node Exporter
  # CPU limit intentionally omitted — causes CFS throttling on low-overhead
  # collectors. Memory limit retained to catch actual leaks.
  # Ref: https://home.robusta.dev/blog/stop-using-cpu-limits
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

  ## Kube State Metrics
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
