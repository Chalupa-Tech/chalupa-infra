victoria-metrics-k8s-stack:
  # Required for correct service discovery when deployed via ArgoCD ApplicationSet
  argocdReleaseOverride: "observability"

  ## VMSingle — replaces Prometheus
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "30d"
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi

  ## VMOperator — converts ServiceMonitor CRDs to VM scrape configs
  victoria-metrics-operator:
    enabled: true
    operator:
      disable_prometheus_converter: false

  ## Grafana
  grafana:
    enabled: true
    replicas: 1
    persistence:
      enabled: true
      size: 1Gi
    plugins:
      - victoriametrics-logs-datasource
    envFromSecret: "grafana-oidc-secret"
    grafana.ini:
      server:
        root_url: "https://pi-k3s.chalupatech.com/grafana/"
        serve_from_sub_path: true
      auth:
        signout_redirect_url: "https://pi-k3s.chalupatech.com/ui"
      auth.generic_oauth:
        enabled: true
        name: OpenBao
        allow_sign_up: true
        scopes: openid user
        auth_url: "https://pi-k3s.chalupatech.com/ui/vault/identity/oidc/provider/default/authorize"
        token_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/token"
        api_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/userinfo"
        login_attribute_path: username
        role_attribute_path: "'Admin'"
    additionalDataSources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        url: http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428
        access: proxy
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ## Dashboards
  defaultDashboards:
    enabled: true

  ## Alertmanager
  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 128Mi

  ## Node Exporter
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Kube State Metrics
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
