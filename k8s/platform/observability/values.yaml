victoria-metrics-k8s-stack:
  # Required for correct service discovery when deployed via ArgoCD ApplicationSet
  argocdReleaseOverride: "observability"
  # Shorten resource names — default includes full chart name which exceeds
  # the 63-char K8s name limit (e.g. observability-victoria-metrics-k8s-stack-kube-controller-manager)
  fullnameOverride: "vmstack"

  ## VMSingle — replaces Prometheus
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "30d"
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi

  ## VMOperator — converts ServiceMonitor CRDs to VM scrape configs
  victoria-metrics-operator:
    enabled: true
    operator:
      disable_prometheus_converter: false
    admissionWebhooks:
      certManager:
        enabled: true
    nodeSelector:
      compute-class: pi5

  ## Grafana
  grafana:
    enabled: true
    replicas: 1
    persistence:
      enabled: true
      size: 1Gi
      storageClassName: longhorn
    initChownData:
      enabled: false
    plugins:
      - victoriametrics-logs-datasource
      - victoriametrics-metrics-datasource
    sidecar:
      datasources:
        # Run the datasource sidecar as an init container so ConfigMap-based
        # datasources are written to the provisioning dir BEFORE Grafana starts.
        # Without this, the sidecar races the server — provisioning reads files
        # referencing plugin datasource types before the plugin registry is ready.
        initDatasources: true
    envFromSecret: "grafana-oidc-secret"
    grafana.ini:
      # NOTE: plugins.preinstall_sync is handled by the Helm chart's `plugins:`
      # list above — it sets GF_PLUGINS_PREINSTALL_SYNC env var automatically.
      # Do NOT add a [plugins] section here; grafana.ini `preinstall` puts
      # plugins in the ASYNC queue which conflicts with the sync env var.
      server:
        root_url: "https://pi-k3s.chalupatech.com/grafana/"
        serve_from_sub_path: true
      auth:
        signout_redirect_url: "https://pi-k3s.chalupatech.com/ui"
        disable_brute_force_login_protection: true
      auth.generic_oauth:
        enabled: true
        name: OpenBao
        allow_sign_up: true
        scopes: openid user
        auth_url: "https://pi-k3s.chalupatech.com/ui/vault/identity/oidc/provider/default/authorize"
        token_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/token"
        api_url: "http://openbao-active.openbao.svc.cluster.local:8200/v1/identity/oidc/provider/default/userinfo"
        login_attribute_path: username
        role_attribute_path: "'Admin'"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  ## ── K8s internal scrapes ──────────────────────────────────────────
  ## Toggle: set enabled: false to disable any scrape entirely.
  ## Histogram buckets (_bucket series) are dropped to save ~170k series / ~300Mi RAM.
  ## To restore full histograms: remove the metricRelabelConfigs blocks below.

  kubelet:
    enabled: true
    vmScrape:
      spec:
        metricRelabelConfigs:
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - {sourceLabels: [__name__], regex: ".*_bucket", action: drop}

  # yamllint disable rule:comments-indentation
  kubeApiServer:
    enabled: true   # toggle apiserver scraping
    vmScrape:
      spec:
        endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
              - {sourceLabels: [__name__], regex: ".*_bucket", action: drop}
        jobLabel: component
        namespaceSelector:
          matchNames: [default]
        selector:
          matchLabels: {component: apiserver, provider: kubernetes}

  kubeEtcd:
    enabled: true   # toggle etcd scraping
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: http
            metricRelabelConfigs:
              - {sourceLabels: [__name__], regex: ".*_bucket", action: drop}

  kubeControllerManager:
    enabled: true   # toggle controller-manager scraping
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: http
            metricRelabelConfigs:
              - {sourceLabels: [__name__], regex: ".*_bucket", action: drop}

  kubeScheduler:
    enabled: true   # toggle scheduler scraping
    vmScrape:
      spec:
        endpoints:
          - port: http-metrics
            scheme: http
            metricRelabelConfigs:
              - {sourceLabels: [__name__], regex: ".*_bucket", action: drop}
  # yamllint enable rule:comments-indentation

  ## Dashboards
  defaultDashboards:
    enabled: true

  ## Alertmanager
  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 128Mi

  ## Node Exporter
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi

  ## Kube State Metrics
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
