---
# Mints a random bearer token for GitHub Actions telemetry ingress and
# stores it at secret/platform/telemetry/gh-actions (raw token +
# htpasswd form). Idempotent — skips on re-run unless ROTATE=true.
# Rotation procedure: docs/runbooks/gh-actions-telemetry-token-rotation.md.
#
# Runs as an ArgoCD PostSync hook after observability syncs, so OpenBao
# and the minter SA/role must be healthy first.
apiVersion: batch/v1
kind: Job
metadata:
  name: gh-actions-telemetry-mint
  namespace: observability
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: gh-actions-telemetry-minter
    spec:
      serviceAccountName: gh-actions-telemetry-minter
      restartPolicy: OnFailure
      containers:
        - name: mint
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - apk add --no-cache curl jq openssl >/dev/null && sh /scripts/mint-gh-actions-telemetry.sh
          env:
            - name: KV_PATH
              value: "platform/telemetry/gh-actions"
            - name: BASIC_AUTH_USER
              value: "gh-actions"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: scripts
          configMap:
            name: gh-actions-telemetry-mint-script
            defaultMode: 0755
