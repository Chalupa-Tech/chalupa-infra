apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: observability
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pi-k3s-tls
  namespace: observability
spec:
  secretName: pi-k3s-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pi-k3s.chalupatech.com
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pi-k3s.chalupatech.com`) && PathPrefix(`/grafana`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: observability-grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-tls
  namespace: observability
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pi-k3s.chalupatech.com`) && PathPrefix(`/grafana`)
      kind: Rule
      services:
        - name: observability-grafana
          port: 80
  tls:
    secretName: pi-k3s-tls
