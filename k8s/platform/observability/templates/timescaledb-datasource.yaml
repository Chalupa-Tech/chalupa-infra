apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-timescaledb
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  timescaledb.yaml: |
    apiVersion: 1
    datasources:
      - name: TimescaleDB
        uid: timescaledb
        type: postgres
        access: proxy
        url: timescaledb.schwab-ddowell.svc.cluster.local:5432
        database: market
        user: grafana
        isDefault: false
        editable: true
        jsonData:
          database: market
          sslmode: disable
          timescaledb: true
          postgresVersion: 1600
          maxOpenConns: 5
        secureJsonData:
          password: "97ee0745384f2bbf0afcce7e7ae40d0d68ad0f3dae4edb2c"
