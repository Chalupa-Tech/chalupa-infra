---
# Alerts for Gemini (and future Claude / Codex) review spend.
#
# Depends on recording rules in gen-ai-pricing-rules.yaml:
#   - gen_ai_review_cost_usd:monthly
#   - gen_ai_pricing_table_age_days
#
# Severity routing: uses the cluster's existing Discord receivers
# (discord-info / discord-warning / discord-critical) — see
# alertmanager-config.yaml. Labels `auto_comment_pr` and `page` are
# stamped for future wiring to a repository-dispatch webhook that
# comments on PRs / flips the GEMINI_DISPATCH_ENABLED org var; that
# bridge is a follow-up phase (see phase-44 prompt).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: gen-ai-review-alerts
  namespace: observability
spec:
  groups:
    - name: gen-ai-spend
      interval: 5m
      rules:
        # 80% of the $20 soft cap — heads-up, no action.
        - alert: GeminiSpendSoftCap80
          expr: gen_ai_review_cost_usd:monthly > 16
          for: 30m
          labels:
            severity: info
            component: gen-ai-review
          annotations:
            summary: "Gemini review spend > $16/mo for {{ "{{" }} $labels.github_repository {{ "}}" }}"
            description: "Gemini-review monthly rolling spend for {{ "{{" }} $labels.github_repository {{ "}}" }} on model {{ "{{" }} $labels.gen_ai_request_model {{ "}}" }} is ${{ "{{" }} $value | printf \"%.2f\" {{ "}}" }} — 80% of the $20 soft cap. No action required; monitor the Gemini Review Spend dashboard."

        # At or above the soft cap — trigger auto-PR-comment via repo-dispatch
        # once the webhook bridge lands (phase-44).
        - alert: GeminiSpendSoftCap100
          expr: gen_ai_review_cost_usd:monthly > 20
          for: 30m
          labels:
            severity: warning
            component: gen-ai-review
            auto_comment_pr: "true"
          annotations:
            summary: "Gemini review spend > $20/mo for {{ "{{" }} $labels.github_repository {{ "}}" }}"
            description: "Gemini-review monthly rolling spend for {{ "{{" }} $labels.github_repository {{ "}}" }} on model {{ "{{" }} $labels.gen_ai_request_model {{ "}}" }} is ${{ "{{" }} $value | printf \"%.2f\" {{ "}}" }} — at or above the $20 soft cap. Consider pausing large/experimental diff reviews or moving to gemini-2.5-flash-lite for routine PRs."

        # Hard cap — critical. Signals disable-gemini-dispatch workflow.
        - alert: GeminiSpendHardCap
          expr: gen_ai_review_cost_usd:monthly > 50
          for: 15m
          labels:
            severity: critical
            component: gen-ai-review
            page: "true"
          annotations:
            summary: "Gemini review spend > $50/mo for {{ "{{" }} $labels.github_repository {{ "}}" }} — HARD CAP"
            description: "Gemini-review monthly rolling spend for {{ "{{" }} $labels.github_repository {{ "}}" }} on model {{ "{{" }} $labels.gen_ai_request_model {{ "}}" }} is ${{ "{{" }} $value | printf \"%.2f\" {{ "}}" }} — past the $50 hard cap. Flip GEMINI_DISPATCH_ENABLED=false per docs/runbooks/gemini-review-spend-cap.md. Investigate runaway cost before re-enabling."

    - name: gen-ai-pricing-table
      interval: 1h
      rules:
        - alert: GeminiPricingTableStale
          expr: gen_ai_pricing_table_age_days > 180
          for: 6h
          labels:
            severity: warning
            component: gen-ai-review
          annotations:
            summary: "Gemini pricing table is >180d stale (age={{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}d)"
            description: "chalupa-brain/docs/gen-ai-pricing-table.yaml hasn't been refreshed in more than 180 days. Cost metrics may drift from vendor reality. Refresh the YAML's `as_of:` date and update the corresponding gen_ai_pricing_table_as_of_timestamp rule in gen-ai-pricing-rules.yaml, then also verify per-model rates."
