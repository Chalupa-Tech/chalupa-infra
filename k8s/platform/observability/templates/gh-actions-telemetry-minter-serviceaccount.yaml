---
# Identity used by the gh-actions-telemetry mint Job to authenticate to
# OpenBao. Bound to gh-actions-telemetry-minter-role
# (policies/acl/gh-actions-telemetry-minter-policy) by
# openbao_setup/platform_setup.yml. No K8s RBAC needed — the Job only
# talks to OpenBao.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gh-actions-telemetry-minter
  namespace: observability
