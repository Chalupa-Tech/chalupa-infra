apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: discord-warning
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: "null"
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
        - matchers:
            - alertname =~ "KubeDaemonSet.*"
            - daemonset =~ "svclb-traefik-.*"
          receiver: "null"
        - matchers:
            - severity = critical
          receiver: discord-critical
        - matchers:
            - severity = error
          receiver: discord-error
        - matchers:
            - severity = info
          receiver: discord-info

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity =~ "warning|critical"
        target_matchers:
          - severity = info
        equal: ['namespace']

    receivers:
      - name: "null"
      - name: discord-info
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/info"
            send_resolved: true
      - name: discord-warning
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/warning"
            send_resolved: true
      - name: discord-error
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/error"
            send_resolved: true
      - name: discord-critical
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/critical"
            send_resolved: true
