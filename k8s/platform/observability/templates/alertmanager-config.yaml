apiVersion: v1
kind: Secret
metadata:
  name: vmalertmanager-config
type: Opaque
stringData:
  alertmanager.yaml: |
    route:
      receiver: discord-warning
      group_by: ['alertname', 'namespace']
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: "null"
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
        - matchers:
            - alertname =~ "KubeDaemonSet.*"
            - daemonset =~ "svclb-traefik-.*"
          receiver: "null"
        - matchers:
            - severity = critical
          receiver: discord-critical
        - matchers:
            - severity = error
          receiver: discord-error
        - matchers:
            - severity = info
          receiver: discord-info

    inhibit_rules:
      # Site-wide outage suppresses per-node NodeDown/NodeNotReady alerts —
      # one page for the whole event instead of one per node.
      - source_matchers:
          - alertname = MultipleNodesDown
        target_matchers:
          - alertname =~ "NodeDown|NodeNotReady"
      # A downed/unready node suppresses other alerts sharing its `node` label.
      # Note: only covers alerts that carry a `node` label (kubelet/node-scoped);
      # pod/deployment alerts don't, so MultipleNodesDown is the broader net.
      - source_matchers:
          - alertname =~ "NodeDown|NodeNotReady"
        target_matchers:
          - alertname !~ "NodeDown|NodeNotReady|MultipleNodesDown"
        equal: ['node']
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: ['alertname', 'namespace']
      - source_matchers:
          - severity =~ "warning|critical"
        target_matchers:
          - severity = info
        equal: ['namespace']

    receivers:
      - name: "null"
      - name: discord-info
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/info"
            send_resolved: true
      - name: discord-warning
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/warning"
            send_resolved: true
      - name: discord-error
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/error"
            send_resolved: true
      - name: discord-critical
        webhook_configs:
          - url: "http://alertmanager-discord.observability.svc:8080/critical"
            send_resolved: true
