apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cluster-alerts
spec:
  groups:
    # ── Critical ─────────────────────────────────────────────────────
    - name: critical
      rules:
        - alert: NodeDown
          expr: up{job="kubelet"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} is down"
            description: "Kubelet on {{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for 5 minutes."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ "{{" }} $labels.node {{ "}}" }} is NotReady"
            description: "Node has been in NotReady state for 5 minutes."

        # Site/power-outage meta-alert: two or more nodes unready within a short
        # window almost always means the whole site is down. Fires quickly and
        # inhibits per-node NodeDown/NodeNotReady alerts so the event pages once.
        - alert: MultipleNodesDown
          expr: count(kube_node_status_condition{condition="Ready",status="true"} == 0) >= 2
          for: 2m
          labels:
            severity: critical
            scope: cluster
          annotations:
            summary: "Multiple nodes NotReady — likely site/power outage"
            description: "{{ "{{" }} $value {{ "}}" }} nodes are NotReady simultaneously."

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_available_replicas == 0 and kube_deployment_spec_replicas > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }} has zero available replicas"
            description: "All replicas are down for 5 minutes."

        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ "{{" }} $labels.name {{ "}}" }} expires in < 7 days"
            description: "Namespace {{ "{{" }} $labels.namespace {{ "}}" }}, cert {{ "{{" }} $labels.name {{ "}}" }}."

        - alert: SchwabAuthDown
          expr: absent(up{job="go-schwab-auth"}) == 1 or up{job="go-schwab-auth"} == 0 or avg_over_time(up{job="go-schwab-auth"}[10m]) < 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "go-schwab-auth is down or flapping"
            description: "go-schwab-auth is unreachable, absent from scrape, or has had <50% uptime over the last 10 minutes (sustained 5m). Token refresh scheduler is not running reliably; Schwab OAuth pipeline will fail silently when the current refresh token expires. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Primary alarm for the refresh loop. Sum by registration only so
        # mixed failure reasons (e.g., 2 network + 1 server_error) still
        # count toward the threshold — any 3+ failures in 15m means human
        # attention regardless of classification. Reason breakdown is
        # available on the schwab-auth-lifecycle dashboard.
        - alert: SchwabRefreshFailureSpike
          expr: sum by (registration)(increase(schwab_auth_refresh_total{result="failure"}[15m])) >= 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Schwab auth refresh failing repeatedly ({{ "{{" }} $labels.registration {{ "}}" }})"
            description: "{{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} failed Schwab OAuth refreshes in the last 15m for registration {{ "{{" }} $labels.registration {{ "}}" }}. Access tokens will expire if refreshes keep failing. Check failure breakdown at https://grafana.chalupatech.com/d/schwab-auth-lifecycle — runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Backstop. The primary signal is refresh-failure; this catches
        # pathological cases where the refresh loop stops emitting
        # attempts at all. The process_start_time_seconds guard defuses
        # the "gauge initialized to 0 on pod restart makes time()-metric
        # huge" trap (Robust Perception pattern). `and on(instance)` is
        # required because process_start_time_seconds has no
        # `registration` label — vector matching must be explicit.
        - alert: SchwabAccessTokenExpiringSoon
          expr: |
            (schwab_auth_token_expiry_timestamp_seconds{token_type="access"} - time()) < 600
            and on(instance) (time() - schwab_auth_last_successful_refresh_timestamp_seconds) > 300
            and on(instance) (time() - process_start_time_seconds{job="go-schwab-auth"}) > 300
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Schwab access token {{ "{{" }} $labels.registration {{ "}}" }} expires in <10m with no recent refresh"
            description: "Access token for {{ "{{" }} $labels.registration {{ "}}" }} expires in <10m, last successful refresh was >5m ago, and the pod has been up >5m (so this isn't startup). Refresh loop is stuck. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

    # ── Error ────────────────────────────────────────────────────────
    - name: error
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} has restarted {{ "{{" }} $value {{ "}}" }} times in 15 minutes."

        - alert: PodImagePullBackOff
          expr: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ImagePullBackOff"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} cannot pull its image."

        - alert: ContainerOOMKilled
          expr: increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[30m]) > 0
          for: 0m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} OOMKilled"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} was killed due to out-of-memory."

        - alert: PVCPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "PVC {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} stuck Pending"
            description: "PVC has been pending for 10 minutes."

        - alert: ExternalSecretSyncFailure
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "ExternalSecret {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} sync failed"
            description: "ExternalSecret has been failing to sync for 10 minutes."

    # ── Warning ──────────────────────────────────────────────────────
    - name: warning
      rules:
        - alert: NodeMemoryPressure
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} memory > 80%"
            description: "Memory usage is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}%."

        - alert: NodeCPUPressure
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} CPU > 80%"
            description: "CPU usage is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}%."

        - alert: NodeDiskPressure
          expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} disk > 85%"
            description: "Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}% full."

        - alert: ArgoCDOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.sync_status {{ "}}" }}"
            description: "App has been out of sync for 15 minutes."

        - alert: ArgoCDUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.health_status {{ "}}" }}"
            description: "App health has been degraded for 15 minutes."

        - alert: CertificateExpiring30d
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ "{{" }} $labels.name {{ "}}" }} expires in < 30 days"
            description: "Namespace {{ "{{" }} $labels.namespace {{ "}}" }}, cert {{ "{{" }} $labels.name {{ "}}" }}."

        # Refresh tokens typically last days to weeks. 24h ahead of expiry
        # is a pre-emptive warning (human re-auth will be needed), not a
        # page-level urgency. `for: 10m` avoids flapping at the boundary.
        # The `on(instance)` pod-startup guard prevents the gauge-zero
        # trap on pod restart (same pattern as the access-token alert).
        - alert: SchwabRefreshTokenExpiringSoon
          expr: |
            (schwab_auth_token_expiry_timestamp_seconds{token_type="refresh"} - time()) < 86400
            and on(instance) (time() - process_start_time_seconds{job="go-schwab-auth"}) > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Schwab refresh token {{ "{{" }} $labels.registration {{ "}}" }} expires in <24h"
            description: "Refresh token for {{ "{{" }} $labels.registration {{ "}}" }} expires in {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}s. Human re-auth at https://go-schwab-auth.tailbecff0.ts.net/auth/start?registration={{ "{{" }} $labels.registration {{ "}}" }} is required before expiry. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Correlates a failed scrape with a recent pod creation so the
        # alert specifically catches "deploy went out, new pod came up
        # unhealthy" — the silent-failure mode CI verification can't
        # see (image landed, ArgoCD synced, but app never became
        # ready). Correlation is on `pod` because `kube_pod_created`
        # has no `job` label and our up-series carries pod. The 10m
        # window matches typical ArgoCD sync + readiness latency;
        # `for: 5m` requires the failure to be sustained, not a
        # startup blip. Covers both Deployments and Rollouts (which
        # `kube_deployment_status_observed_generation` misses — see
        # reference_argo_rollout_not_deployment).
        - alert: ServiceUnhealthyPostDeploy
          expr: |
            up{job=~"go-.*"} == 0
            and on(pod)
              (time() - kube_pod_created < 600)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.job {{ "}}" }} unhealthy within 10m of a deploy"
            description: "Scrape job {{ "{{" }} $labels.job {{ "}}" }} (pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}) has up==0 and its pod was created less than 10 minutes ago. Likely a botched deploy — inspect recent chalupa-infra merges and ArgoCD sync history."


    # ── Info ─────────────────────────────────────────────────────────
    - name: info
      rules:
        - alert: CronJobFailed
          expr: kube_job_status_failed > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Job {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.job_name {{ "}}" }} failed"
            description: "A Job has failed."

        - alert: LonghornVolumeHealth
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ "{{" }} $labels.volume {{ "}}" }} degraded"
            description: "Volume has been in degraded state for 10 minutes."
