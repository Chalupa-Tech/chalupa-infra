apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cluster-alerts
spec:
  groups:
    # ── Critical ─────────────────────────────────────────────────────
    - name: critical
      rules:
        - alert: NodeDown
          expr: up{job="kubelet"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} is down"
            description: "Kubelet on {{ "{{" }} $labels.instance {{ "}}" }} has been unreachable for 5 minutes."

        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ "{{" }} $labels.node {{ "}}" }} is NotReady"
            description: "Node has been in NotReady state for 5 minutes."

        # Site/power-outage meta-alert: two or more nodes unready within a short
        # window almost always means the whole site is down. Fires quickly and
        # inhibits per-node NodeDown/NodeNotReady alerts so the event pages once.
        - alert: MultipleNodesDown
          expr: count(kube_node_status_condition{condition="Ready",status="true"} == 0) >= 2
          for: 2m
          labels:
            severity: critical
            scope: cluster
          annotations:
            summary: "Multiple nodes NotReady — likely site/power outage"
            description: "{{ "{{" }} $value {{ "}}" }} nodes are NotReady simultaneously."

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_available_replicas == 0 and kube_deployment_spec_replicas > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.deployment {{ "}}" }} has zero available replicas"
            description: "All replicas are down for 5 minutes."

        - alert: CertificateExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ "{{" }} $labels.name {{ "}}" }} expires in < 7 days"
            description: "Namespace {{ "{{" }} $labels.namespace {{ "}}" }}, cert {{ "{{" }} $labels.name {{ "}}" }}."

        - alert: SchwabAuthDown
          expr: absent(up{job="go-schwab-auth"}) == 1 or up{job="go-schwab-auth"} == 0 or avg_over_time(up{job="go-schwab-auth"}[10m]) < 0.5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "go-schwab-auth is down or flapping"
            description: "go-schwab-auth is unreachable, absent from scrape, or has had <50% uptime over the last 10 minutes (sustained 5m). Token refresh scheduler is not running reliably; Schwab OAuth pipeline will fail silently when the current refresh token expires. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Primary alarm for the refresh loop. Sum by registration only so
        # mixed failure reasons (e.g., 2 network + 1 server_error) still
        # count toward the threshold — any 3+ failures in 15m means human
        # attention regardless of classification. Reason breakdown is
        # available on the schwab-auth-lifecycle dashboard.
        - alert: SchwabRefreshFailureSpike
          expr: sum by (registration)(increase(schwab_auth_refresh_total{result="failure"}[15m])) >= 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Schwab auth refresh failing repeatedly ({{ "{{" }} $labels.registration {{ "}}" }})"
            description: "{{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} failed Schwab OAuth refreshes in the last 15m for registration {{ "{{" }} $labels.registration {{ "}}" }}. Access tokens will expire if refreshes keep failing. Check failure breakdown at https://grafana.chalupatech.com/d/schwab-auth-lifecycle — runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Backstop. The primary signal is refresh-failure; this catches
        # pathological cases where the refresh loop stops emitting
        # attempts at all. The process_start_time_seconds guard defuses
        # the "gauge initialized to 0 on pod restart makes time()-metric
        # huge" trap (Robust Perception pattern). `and on(instance)` is
        # required because process_start_time_seconds has no
        # `registration` label — vector matching must be explicit.
        - alert: SchwabAccessTokenExpiringSoon
          expr: |
            (schwab_auth_token_expiry_timestamp_seconds{token_type="access"} - time()) < 600
            and on(instance) (time() - schwab_auth_last_successful_refresh_timestamp_seconds) > 300
            and on(instance) (time() - process_start_time_seconds{job="go-schwab-auth"}) > 300
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Schwab access token {{ "{{" }} $labels.registration {{ "}}" }} expires in <10m with no recent refresh"
            description: "Access token for {{ "{{" }} $labels.registration {{ "}}" }} expires in <10m, last successful refresh was >5m ago, and the pod has been up >5m (so this isn't startup). Refresh loop is stuck. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

    # ── Error ────────────────────────────────────────────────────────
    - name: error
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} is crash-looping"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} has restarted {{ "{{" }} $value {{ "}}" }} times in 15 minutes."

        - alert: PodImagePullBackOff
          expr: kube_pod_container_status_waiting_reason{reason="ImagePullBackOff"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ImagePullBackOff"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} cannot pull its image."

        # Fires for 10 minutes after a kill, from the kill's own timestamp.
        # The previous expr, increase(last_terminated_reason[30m]), counted
        # a gauge that stays 1 for the container's life, so it re-fired for
        # old kills whenever the series reappeared after a data gap: on
        # 2026-11-17 timescaledb-1 (killed 06:09) and vector-8bnbc
        # re-notified hours later (platform phase-95).
        - alert: ContainerOOMKilled
          expr: |
            (time() - kube_pod_container_status_last_terminated_timestamp) < 600
            and on(namespace, pod, container)
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: error
          annotations:
            summary: "{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} OOMKilled"
            description: "Container {{ "{{" }} $labels.container {{ "}}" }} was killed due to out-of-memory."

        - alert: PVCPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "PVC {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} stuck Pending"
            description: "PVC has been pending for 10 minutes."

        - alert: ExternalSecretSyncFailure
          expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
          for: 10m
          labels:
            severity: error
          annotations:
            summary: "ExternalSecret {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} sync failed"
            description: "ExternalSecret has been failing to sync for 10 minutes."

    # ── Warning ──────────────────────────────────────────────────────
    - name: warning
      rules:
        - alert: NodeMemoryPressure
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} memory > 80%"
            description: "Memory usage is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}%."

        - alert: NodeCPUPressure
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} CPU > 80%"
            description: "CPU usage is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}%."

        - alert: NodeDiskPressure
          expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ "{{" }} $labels.instance {{ "}}" }} disk > 85%"
            description: "Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} is {{ "{{" }} $value | printf \"%.1f\" {{ "}}" }}% full."

        - alert: ArgoCDOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.sync_status {{ "}}" }}"
            description: "App has been out of sync for 15 minutes."

        - alert: ArgoCDUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.health_status {{ "}}" }}"
            description: "App health has been degraded for 15 minutes."

        - alert: CertificateExpiring30d
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ "{{" }} $labels.name {{ "}}" }} expires in < 30 days"
            description: "Namespace {{ "{{" }} $labels.namespace {{ "}}" }}, cert {{ "{{" }} $labels.name {{ "}}" }}."

        # Refresh tokens typically last days to weeks. 24h ahead of expiry
        # is a pre-emptive warning (human re-auth will be needed), not a
        # page-level urgency. `for: 10m` avoids flapping at the boundary.
        # The `on(instance)` pod-startup guard prevents the gauge-zero
        # trap on pod restart (same pattern as the access-token alert).
        - alert: SchwabRefreshTokenExpiringSoon
          expr: |
            (schwab_auth_token_expiry_timestamp_seconds{token_type="refresh"} - time()) < 86400
            and on(instance) (time() - process_start_time_seconds{job="go-schwab-auth"}) > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Schwab refresh token {{ "{{" }} $labels.registration {{ "}}" }} expires in <24h"
            description: "Refresh token for {{ "{{" }} $labels.registration {{ "}}" }} expires in {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }}s. Human re-auth at https://schwab-auth.chalupatech.com/auth/start?registration={{ "{{" }} $labels.registration {{ "}}" }} is required before expiry. Runbook: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/docs/runbooks/auth-pod-incident.md"

        # Correlates a failed scrape with a recent pod creation so the
        # alert specifically catches "deploy went out, new pod came up
        # unhealthy" — the silent-failure mode CI verification can't
        # see (image landed, ArgoCD synced, but app never became
        # ready). Correlation is on `pod` because `kube_pod_created`
        # has no `job` label and our up-series carries pod. The 10m
        # window matches typical ArgoCD sync + readiness latency;
        # `for: 5m` requires the failure to be sustained, not a
        # startup blip. Covers both Deployments and Rollouts (which
        # `kube_deployment_status_observed_generation` misses — see
        # reference_argo_rollout_not_deployment).
        # Paper-trader adapter-events drop rate. Per the channel-policy
        # decision in
        # workstreams/paper-trading-realism/briefs/2026-05-12-adapter-channel-backpressure-policy.md,
        # SimAdapter.Events() does drop-with-measurement: a slow
        # in-process subscriber increments paper_adapter_events_dropped_total
        # rather than blocking PlaceOrder. Steady-state observed rate is
        # 0.05-0.23/s per active book — harmless, since the durable
        # lifecycle history is in paper_order_events. Sustained >1.0/s
        # is catastrophic and indicates either a degraded subscriber
        # (dashboard / decision loop) or a quote-burst the channel
        # can't fan out fast enough, both of which need a human.
        - alert: PaperTraderAdapterEventsDroppingHigh
          expr: sum by (book_id)(rate(paper_adapter_events_dropped_total[5m])) > 1.0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "paper-trader dropping AdapterEvents on book {{ "{{" }} $labels.book_id {{ "}}" }} at >1/s"
            description: "Drop rate is {{ "{{" }} $value | printf \"%.2f\" {{ "}}" }}/s sustained for 10m on the SimAdapter.Events() channel for book {{ "{{" }} $labels.book_id {{ "}}" }}. Durable lifecycle is preserved in paper_order_events, but in-process subscribers (dashboards, decision loops) are missing transitions. Inspect the Simulator health row on https://grafana.chalupatech.com/d/paper-trading and check go-paper-trader logs for slow consumers. Policy rationale: https://github.com/Chalupa-Tech/chalupa-brain/blob/main/workstreams/paper-trading-realism/briefs/2026-05-12-adapter-channel-backpressure-policy.md"

        # Reconciler liveness. Steady-state for the SimAdapter is zero
        # divergences — write-through consistency guarantees both sides
        # come from the same event log. Zero healthy sweeps in 15m means
        # every sweep reported a divergence (or the goroutine is stalled).
        # `on(book_id) (paper_reconcile_last_run_timestamp_seconds > 0)`
        # gates the alert until the reconciler has emitted at least one
        # run for each book, defusing the deploy-window false fire when
        # a new book is just coming up.
        # Sized against the 2026-05-11 latent-failure mode where alt-30s
        # / alt-60s / sma-5x20 had paper_reconcile_healthy_sweeps_total
        # flat at zero since deploy and the dashboard row was a permanent
        # red zero with no alert behind it.
        - alert: PaperTraderReconcilerStalled
          expr: |
            increase(paper_reconcile_healthy_sweeps_total[15m]) == 0
            and on(book_id) (paper_reconcile_last_run_timestamp_seconds > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "paper-trader book {{ "{{" }} $labels.book_id {{ "}}" }} has had no healthy reconciler sweeps in 15m"
            description: "Every reconciler sweep in the last 15m on book {{ "{{" }} $labels.book_id {{ "}}" }} has reported a divergence (or the goroutine is stalled). Drill into panel 923 (Divergence rate by kind) on https://grafana.chalupatech.com/d/paper-trading and check go-paper-trader logs for reconcile-loop errors."

        # Memory pressure. Working set vs container memory limit, sized
        # against the post-PR-#445 256 Mi limit and the post-phase-11e
        # bounded memory shape. Vector match is on pod + namespace +
        # container — kube_pod_container_resource_limits carries all
        # three. 85% threshold gives the operator ~15% headroom before
        # the next reconcile-sweep spike OOMKills the pod. LHS is wrapped
        # in `max by(...)` because kubelet exposes the cadvisor metric on
        # both /metrics/cadvisor and /metrics/resource, which otherwise
        # produces duplicate series and a 422 on every vmalert eval.
        - alert: PaperTraderMemoryPressure
          expr: |
            max by (pod, namespace, container) (
              container_memory_working_set_bytes{namespace="schwab-ddowell",container="go-paper-trader"}
            )
              / on(pod, namespace, container)
            kube_pod_container_resource_limits{namespace="schwab-ddowell",container="go-paper-trader",resource="memory"}
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "paper-trader pod {{ "{{" }} $labels.pod {{ "}}" }} memory >85% of limit"
            description: "Working set has stayed above 85% of the container memory limit for 5 minutes on pod {{ "{{" }} $labels.pod {{ "}}" }}. OOMKill is likely on the next reconcile-sweep spike. Either bump the limit on k8s/apps/schwab/go-paper-trader/values.yaml or investigate whether phase-11e's terminal-order prune covers the growth surface (candidate: appliedClientOrderIDs map, deferred by phase-11e)."

        # Phase-11l: strategy reject loop watchdog. Catches the failure
        # mode the 2026-05-14 audit found — a book whose adapter is
        # rejecting every order attempt while no fills land. Pre-phase-11l
        # this fired as the AdapterEventsDroppingHigh alert because the
        # reject pair (Submitted → Rejected) spammed the events channel;
        # phase-11l §2 stopped the strategy-side retry storm but the same
        # pattern can recur (any future strategy that doesn't honor
        # terminal rejects). Alert directly on the symptom — rejects
        # without fills — rather than on the downstream channel-drop
        # noise floor, so a regression is visible at the right layer.
        #
        # Market-closed rejects are subtracted out: every book that
        # attempts orders off-hours collects them and they are normal,
        # not a stuck strategy. The fills side uses `unless` rather than
        # `and ... == 0` so a book that has never filled — and therefore
        # has no paper_fills_total series — is still evaluated; an
        # `and on(book_id) ... == 0` join silently drops such a book,
        # which is exactly the failure mode this alert must catch.
        - alert: PaperTraderStrategyStuck
          expr: |
            (
              sum by (book_id) (rate(paper_order_rejects_total[15m]))
              - (
                  sum by (book_id) (rate(paper_market_closed_rejects_total[15m]))
                  or
                  sum by (book_id) (rate(paper_order_rejects_total[15m])) * 0
                )
            ) > 0
            unless on(book_id)
            (sum by (book_id) (rate(paper_fills_total[15m])) > 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "paper-trader book {{ "{{" }} $labels.book_id {{ "}}" }} rejecting but not filling for 30m"
            description: "All order attempts for book {{ "{{" }} $labels.book_id {{ "}}" }} are rejecting; no fills in 30m. Likely a strategy-side reject loop (see phase-11l) or a cash-exhausted state the strategy is not honoring. Drill into reject reasons on https://grafana.chalupatech.com/d/paper-trading."

        - alert: ServiceUnhealthyPostDeploy
          expr: |
            up{job=~"go-.*"} == 0
            and on(pod)
              (time() - kube_pod_created < 600)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{" }} $labels.job {{ "}}" }} unhealthy within 10m of a deploy"
            description: "Scrape job {{ "{{" }} $labels.job {{ "}}" }} (pod {{ "{{" }} $labels.pod {{ "}}" }} in {{ "{{" }} $labels.namespace {{ "}}" }}) has up==0 and its pod was created less than 10 minutes ago. Likely a botched deploy — inspect recent chalupa-infra merges and ArgoCD sync history."
        # The one backup alert (platform phase-93, extended in phase-94).
        # Velero failed silently for 3.5 months in 2026 because fw1 (MinIO)
        # was powered off. Every backup lands on MinIO on fw1, so one rule
        # covers them all; the description says where to look for each.
        #   1. TimescaleDB: no successful base backup in 48h (the metric is
        #      0 until the first backup, so this also covers "never backed
        #      up"), or the metric is missing;
        #   2. TimescaleDB: more than 64 WAL segments (~1 GiB) waiting to be
        #      archived. WAL that cannot reach MinIO piles up on the 10Gi
        #      data volume and stops Postgres when it fills, well inside 48h;
        #   3. etcd: fewer than all 3 servers uploaded a snapshot to MinIO
        #      in 48h (k3s snapshots every 12h; job="apiserver" has one
        #      series per server). A failed upload alone is not an alert:
        #      the next one may succeed.
        #      The success series exists only after a k3s process's first
        #      upload, so "never" is absent_over_time over 48h; a plain
        #      absent() would fire after every k3s restart;
        #   4. OpenBao: the daily openbao-snapshot CronJob has not succeeded
        #      in 48h, or has never succeeded. A failed run also fires
        #      CronJobFailed; this clause catches a job that stops running.
        - alert: BackupsUnhealthy
          expr: |
            (time() - max(cnpg_collector_last_available_backup_timestamp{namespace="schwab-ddowell"}) > 48 * 3600)
            or absent(cnpg_collector_last_available_backup_timestamp{namespace="schwab-ddowell"})
            or (max(cnpg_collector_pg_wal_archive_status{namespace="schwab-ddowell",value="ready"}) > 64)
            or ((count(increase(k3s_etcd_snapshot_save_s3_duration_seconds_count{job="apiserver",status="success"}[48h]) > 0) or vector(0)) < 3)
            or absent_over_time(k3s_etcd_snapshot_save_s3_duration_seconds_count{job="apiserver",status="success"}[48h])
            or (time() - max(kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshot"}) > 48 * 3600)
            or absent(kube_cronjob_status_last_successful_time{namespace="openbao",cronjob="openbao-snapshot"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "A backup to MinIO on fw1 is unhealthy"
            description: "One of: no TimescaleDB base backup in 48h or WAL not reaching MinIO; an etcd server has not uploaded a snapshot in 48h; no successful OpenBao snapshot in 48h. All three write to MinIO on fw1 (http://192.168.2.51:9000), so first check that fw1 is powered on. Then: `kubectl -n schwab-ddowell get backups.postgresql.cnpg.io` and the ContinuousArchiving condition on cluster/timescaledb; `kubectl get etcdsnapshotfiles.k3s.cattle.io` for s3 entries; `kubectl -n openbao get jobs` and the openbao-snapshot job logs. If fw1 will stay down, disable WAL archiving before the database volume fills. See docs/runbooks/cluster-cold-recovery.md in chalupa-brain."


    # ── Info ─────────────────────────────────────────────────────────
    - name: info
      rules:
        - alert: CronJobFailed
          expr: kube_job_status_failed > 0
          for: 0m
          labels:
            severity: info
          annotations:
            summary: "Job {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.job_name {{ "}}" }} failed"
            description: "A Job has failed."

    # ── Storage and log pipeline (platform phase-95) ─────────────────
    # On 2026-11-17 a longhorn-manager on tpi1 replayed an old engine log
    # for over three hours and the volume under it ran degraded; the first
    # alert was NodeCPUPressure. None of longhorn_*, vector_* or vl_*
    # existed in VictoriaMetrics. The scrapes now live in
    # k8s/platform/{longhorn,vector,victoria-logs}. Incident record:
    # workstreams/platform/briefs/2026-11-17-tpi1-longhorn-incident.md in
    # chalupa-brain.
    - name: storage-and-log-pipeline
      rules:
        # robustness: 0 unknown (detached), 1 healthy, 2 degraded, 3 faulted.
        # Not filtered on attached: Longhorn detaches a faulted volume, and a
        # faulted volume is unavailable either way. Pages.
        - alert: LonghornVolumeFaulted
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness == 3)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ "{{" }} $labels.pvc_namespace {{ "}}" }}/{{ "{{" }} $labels.pvc {{ "}}" }} is faulted"
            description: "Volume {{ "{{" }} $labels.volume {{ "}}" }} has no healthy replica, so its data is unavailable. Do not delete replicas or the volume. `kubectl -n longhorn-system get volumes.longhorn.io {{ "{{" }} $labels.volume {{ "}}" }}` and `kubectl -n longhorn-system get replicas.longhorn.io -l longhornvolume={{ "{{" }} $labels.volume {{ "}}" }}`; see reference_longhorn_operations in the brain memory."

        # Replaces LonghornVolumeHealth (degraded for 10m, which also covered
        # ordinary rebuilds) and stands in for a separate "replica rebuild
        # stuck" rule: Longhorn 1.7.2 exports no per-replica metric, and a
        # volume is degraded exactly while a replica is not healthy. A
        # rebuild of these volumes (20Gi at most, NVMe) finishes well
        # inside 30m.
        - alert: LonghornVolumeDegraded
          expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness == 2)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ "{{" }} $labels.pvc_namespace {{ "}}" }}/{{ "{{" }} $labels.pvc {{ "}}" }} degraded for 30m"
            description: "A replica of {{ "{{" }} $labels.volume {{ "}}" }} has not been healthy for 30 minutes: a rebuild is stuck or a replica's node cannot take it. `kubectl -n longhorn-system get replicas.longhorn.io -l longhornvolume={{ "{{" }} $labels.volume {{ "}}" }} -o wide`. On 2026-11-17 the dpi1 replica of nats-js-nats-1 never became healthy until the nats-1 pod was restarted."

        # Line rate per node from Vector's log_to_metric counter. Baseline on
        # 2026-11-21: 45k lines/day, the busiest 5m at 16 lines/s. On
        # 2026-11-17 the replay loop wrote about 2,200 lines/s.
        - alert: LonghornManagerLogFlood
          expr: |
            sum by (node) (
              rate(vector_pod_log_lines_total{log_namespace="longhorn-system", log_container="longhorn-manager"}[5m])
            ) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "longhorn-manager on {{ "{{" }} $labels.node {{ "}}" }} is logging {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} lines/s"
            description: "Above 100 lines/s for 10 minutes. On 2026-11-17 this was printInstanceLogs replaying a month-old engine log, and it starved the node's CPU through Vector and VictoriaLogs. Look at the volume underneath, not only the log: check the inner timestamps of the lines in VictoriaLogs (namespace:longhorn-system container:longhorn-manager node:{{ "{{" }} $labels.node {{ "}}" }}) and the robustness of the volumes attached on that node."

        # Total ingest against its own 1-day median, with a floor so a quiet
        # baseline (13 lines/s on 2026-11-21) does not make a deploy's burst
        # an alert. The 500 rows/s ceiling keeps a flood that lasts long
        # enough to raise the median (half a day) from resolving itself.
        - alert: LogIngestSpike
          expr: |
            (
              sum(rate(vl_rows_ingested_total[5m]))
                > 10 * quantile_over_time(0.5, sum(rate(vl_rows_ingested_total[5m]))[1d:5m])
              and sum(rate(vl_rows_ingested_total[5m])) > 100
            )
            or sum(rate(vl_rows_ingested_total[5m])) > 500
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "VictoriaLogs is ingesting {{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} rows/s, over 10x its 1-day median"
            description: >-
              {{`{{ with query "topk(1, sum by (node, log_namespace, log_container) (rate(vector_pod_log_lines_total[15m])))" }}{{ with first . }}Top stream: {{ label "log_namespace" . }}/{{ label "log_container" . }} on {{ label "node" . }} at {{ value . | printf "%.0f" }} lines/s. {{ end }}{{ end }}`}}A log flood costs CPU on the node it comes from (Vector) and on VictoriaLogs, and filled vmsingle's node on 2026-11-17.
              Find the stream in Grafana Explore on VictoriaLogs with `* | stats by (namespace, container) count() | sort by (count() desc)`.

        # The metrics pipeline itself, as one alert with a `cause` label:
        #   no-current-samples: vmsingle answers but holds no `up` sample
        #     from the last 3 minutes (vmagent down, or replaying its queue
        #     oldest-first after an outage, so "now" stays empty). Every
        #     absent()-based rule then fires for healthy services, so
        #     Alertmanager inhibits those for this cause only
        #     (alertmanager-config.yaml);
        #   vmagent-backlog: vmagent's remote-write queue above 64 MiB for
        #     10 minutes while current samples may still arrive. Inhibits
        #     nothing. Covers the backlog, so there is no separate queue alert.
        # It cannot see vmsingle being down: vmalert queries vmsingle, and a
        # failing query leaves every rule's state unchanged. That needs a
        # dead man's switch outside the cluster (Watchdog is routed to null).
        - alert: MetricsPipelineStale
          expr: |
            label_set(absent_over_time(up[3m]), "cause", "no-current-samples")
            or label_set(max(min_over_time(vm_persistentqueue_bytes_pending[10m]) > 64 * 1024 * 1024 and vm_persistentqueue_bytes_pending > 64 * 1024 * 1024), "cause", "vmagent-backlog")
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Metrics pipeline is stale ({{ "{{" }} $labels.cause {{ "}}" }}): alerts are blind or delayed"
            description: "no-current-samples: vmsingle has no samples from the last 3 minutes, so no rule sees current data and absent()-based alerts are inhibited. vmagent-backlog: vmagent has held more than 64 MiB for vmsingle for 10 minutes, so recent data arrives late. Check `kubectl -n observability get pods` for vmsingle-vmstack and vmagent-vmstack, and vmsingle's volume (`kubectl -n longhorn-system get volumes.longhorn.io`). A full queue replays oldest-first; vm_persistentqueue_bytes_pending shows how much is left."

        # Phase-97's guard makes mkfs refuse a volume that holds data; the
        # refusal, like any mkfs failure, is logged by mount-utils as
        # "format of disk ... failed". Counted by Vector from the
        # longhorn-csi-plugin log. No legitimate cause, so it pages.
        - alert: LonghornFormatRefusedOrFailed
          expr: sum by (node, volume) (increase(vector_longhorn_csi_format_failures_total[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn CSI refused or failed to format {{ "{{" }} $labels.volume {{ "}}" }} on {{ "{{" }} $labels.node {{ "}}" }}"
            description: "kubelet tried to format a Longhorn volume and mkfs failed, either because the phase-97 guard refused a volume that holds data or because the device returns I/O errors. Do not retry the mount or delete the pod in a loop. Read the line in VictoriaLogs (container:longhorn-csi-plugin \"format of disk\" node:{{ "{{" }} $labels.node {{ "}}" }}) and see the 2026-11-17 incident brief and reference_longhorn_operations."

        # The guard drops off the longhorn-csi-plugin DaemonSet on every
        # Longhorn upgrade and only this 5-minute CronJob puts it back.
        - alert: LonghornMkfsGuardNotApplied
          expr: |
            (time() - max(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="longhorn-mkfs-guard"}) > 30 * 60)
            or absent(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="longhorn-mkfs-guard"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "longhorn-mkfs-guard has not succeeded in 30 minutes"
            description: "The CronJob that keeps the mkfs guard on the longhorn-csi-plugin DaemonSet has not succeeded for 30 minutes, so a Longhorn upgrade or DaemonSet edit may have left volumes unguarded. `kubectl -n longhorn-system get jobs | grep longhorn-mkfs-guard` and the latest job's logs; k8s/platform/longhorn/templates/mkfs-guard.yaml."
