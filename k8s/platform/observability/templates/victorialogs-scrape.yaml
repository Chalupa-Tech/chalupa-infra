# Scrape VictoriaLogs' own /metrics (vl_rows_ingested_total and the rest,
# ~600 series), which LogIngestSpike reads (platform phase-95).
#
# It lives here rather than as `server.vmServiceScrape.enabled` in
# k8s/platform/victoria-logs because that ArgoCD app could not sync when
# phase-95 added it (an immutable volumeClaimTemplates storageClassName,
# fixed in the same phase).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: victoria-logs
  namespace: observability
spec:
  selector:
    matchLabels:
      app: server
      app.kubernetes.io/instance: victoria-logs
      app.kubernetes.io/name: victoria-logs-single
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
