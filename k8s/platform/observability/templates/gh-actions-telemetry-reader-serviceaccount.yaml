---
# Identity used by External Secrets Operator to read the
# gh-actions-telemetry htpasswd from OpenBao. Bound to
# gh-actions-telemetry-reader-role (read-only) by
# openbao_setup/platform_setup.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gh-actions-telemetry-reader
  namespace: observability
