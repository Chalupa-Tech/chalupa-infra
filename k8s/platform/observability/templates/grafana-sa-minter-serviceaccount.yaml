---
# Identity used by grafana-sa-mint-* Jobs to authenticate to OpenBao.
# Bound to grafana-sa-minter-role (policies/acl/grafana-sa-minter-policy)
# by openbao_setup/platform_setup.yml. No K8s RBAC needed — the Job
# makes zero k8s API calls.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-sa-minter
  namespace: observability
