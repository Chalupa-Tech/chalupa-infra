---
# Dedicated least-privilege SecretStore for Grafana admin credentials.
# Uses the observability-grafana SA so the Grafana pod itself is the only
# workload that can resolve admin-password. See docs/service-account-framework.md
# Appendix A and ADR-008.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: grafana-admin-store
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "grafana-admin-reader-role"
          serviceAccountRef:
            name: "observability-grafana"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-admin-store
    kind: SecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: secret/data/platform/grafana/admin-password
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: secret/data/platform/grafana/admin-password
        property: admin-password
