apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ds-infinity
  namespace: observability
  labels:
    grafana_datasource: "1"
data:
  infinity.yaml: |
    apiVersion: 1
    datasources:
      - name: Infinity
        uid: infinity
        type: yesoreyeram-infinity-datasource
        access: proxy
        isDefault: false
        editable: true
        jsonData:
          allowedHosts:
            - "http://victoria-traces-vt-single-server.observability.svc.cluster.local:10428"
