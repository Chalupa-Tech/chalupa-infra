---
# Recording rules for Gemini (and future Claude / Codex) review spend.
#
# Input metric (phase-55 reshape): gen_ai_client_token_usage (Histogram)
#   with _sum / _count / _bucket series, labels gen_ai_system,
#   gen_ai_request_model, gen_ai_token_type, github_repository,
#   gen_ai_operation_name. NOT keyed by github_run_id (unbounded
#   cardinality anti-pattern; per-run drill-down deferred to phase-44
#   VictoriaLogs event records).
#
# Emitted by scripts/ingest-gemini-telemetry.py post-review, parsed from
# .gemini/telemetry.log; OTel SemConv GenAI compliant histogram shape.
#
# Pricing source of truth: chalupa-brain/docs/gen-ai-pricing-table.yaml.
# Rates encoded below as `vector()` expressions — keep in sync with the
# YAML manually (drift is caught by the GeminiPricingTableStale alert
# in gen-ai-alert-rules.yaml after `staleness_warning_days` = 180).
#
# Phase-44 will likely replace this hand-kept block with either:
#   - a Helm --values render from the brain YAML at chart-render time, or
#   - a lightweight text-exporter that serves the YAML as metrics.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: gen-ai-review-pricing
  namespace: observability
spec:
  groups:
    # ── Pricing rates (USD per 1M tokens) ────────────────────────────
    # Encoded as constant metrics so the cost rule below can `group_left`
    # against them. Update `vector()` values when vendor pricing drifts;
    # also bump `docs/gen-ai-pricing-table.yaml` in chalupa-brain and
    # the `gen_ai_pricing_table_as_of_timestamp` rule below.
    - name: gen-ai-pricing-rates
      interval: 5m
      rules:
        # gemini-2.5-flash
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.30)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash", gen_ai_token_type: input}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(2.50)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash", gen_ai_token_type: output}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(2.50)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash", gen_ai_token_type: thought}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.075)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash", gen_ai_token_type: cached}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.0)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash", gen_ai_token_type: tool}

        # gemini-2.5-flash-lite
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.10)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash-lite", gen_ai_token_type: input}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.40)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash-lite", gen_ai_token_type: output}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.40)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash-lite", gen_ai_token_type: thought}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.025)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash-lite", gen_ai_token_type: cached}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.0)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-flash-lite", gen_ai_token_type: tool}

        # gemini-2.5-pro (≤200K context)
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(1.25)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro", gen_ai_token_type: input}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(10.00)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro", gen_ai_token_type: output}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(10.00)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro", gen_ai_token_type: thought}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.3125)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro", gen_ai_token_type: cached}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.0)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro", gen_ai_token_type: tool}

        # gemini-2.5-pro-long (>200K context)
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(2.50)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro-long", gen_ai_token_type: input}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(15.00)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro-long", gen_ai_token_type: output}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(15.00)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro-long", gen_ai_token_type: thought}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.625)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro-long", gen_ai_token_type: cached}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.0)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-2.5-pro-long", gen_ai_token_type: tool}

        # gemini-3-flash-preview — free-tier gated as of 2026-04; using
        # gemini-2.5-flash rates as a conservative fallback so dashboards
        # still produce a non-zero number if preview-tier is actually live.
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.30)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-3-flash-preview", gen_ai_token_type: input}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(2.50)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-3-flash-preview", gen_ai_token_type: output}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(2.50)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-3-flash-preview", gen_ai_token_type: thought}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.075)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-3-flash-preview", gen_ai_token_type: cached}
        - record: gen_ai_pricing_usd_per_mtoken
          expr: vector(0.0)
          labels: {gen_ai_system: gemini, gen_ai_request_model: "gemini-3-flash-preview", gen_ai_token_type: tool}

    # ── Pricing-table staleness ─────────────────────────────────────
    # Keep this timestamp in sync with `as_of:` in
    # chalupa-brain/docs/gen-ai-pricing-table.yaml. 2026-04-19T00:00Z UTC = 1776556800.
    #
    # Phase-55: the derived `gen_ai_pricing_table_age_days` recording
    # rule was retired — same-group cross-rule dependency never
    # produced a sample. Panel 5 now inlines
    # `(time() - gen_ai_pricing_table_as_of_timestamp) / 86400`.
    - name: gen-ai-pricing-staleness
      interval: 5m
      rules:
        - record: gen_ai_pricing_table_as_of_timestamp
          expr: vector(1776556800)
          labels:
            schema_version: v1

    # ── Cost aggregation ─────────────────────────────────────────────
    # Cost = rate-of-tokens * price-per-token over window
    #
    # Phase-55 reshape: `_sum` is the accumulated-tokens counter
    # component of the histogram; `rate(...[30d])` gives tokens/sec over
    # the window; multiplying by window seconds yields total tokens;
    # dividing by 1M and multiplying by USD/Mtoken gives USD.
    #
    # Simpler equivalent via `increase()`: total-tokens-in-window.
    # Using `increase()` keeps PromQL idiomatic.
    #
    # 30d rolling window matches the dashboard's default range. For the
    # alert thresholds ($16/$20/$50 soft/soft/hard) in
    # gen-ai-alert-rules.yaml, the same metric is consumed.
    #
    # Labels preserved on output: gen_ai_system, gen_ai_request_model,
    # github_repository. Token-type label is summed out.
    #
    # `:per_run` retired in phase-55. Per-run cost distribution lives on
    # VictoriaLogs event records in phase-44's log fan-out.
    - name: gen-ai-cost
      interval: 5m
      rules:
        - record: gen_ai_review_cost_usd:monthly
          expr: |-
            sum by (gen_ai_system, gen_ai_request_model, github_repository) (
              (
                increase(gen_ai_client_token_usage_sum[30d]) / 1e6
              )
              * on(gen_ai_system, gen_ai_request_model, gen_ai_token_type) group_left
              gen_ai_pricing_usd_per_mtoken
            )
