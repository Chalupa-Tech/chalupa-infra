---
# Dedicated least-privilege SecretStore for the gh-actions-telemetry
# htpasswd. Scoped to one path via gh-actions-telemetry-reader-policy;
# see docs/service-account-framework.md Appendix A.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gh-actions-telemetry-store
  namespace: observability
spec:
  provider:
    vault:
      server: "http://openbao-active.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "gh-actions-telemetry-reader-role"
          serviceAccountRef:
            name: "gh-actions-telemetry-reader"
---
# Materialises the Traefik BasicAuth Secret. The `users` key must hold
# one or more htpasswd lines — Traefik Middleware.basicAuth.secret
# reads this key and reloads on change via the kubernetescrd provider's
# informer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gh-actions-telemetry-users
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gh-actions-telemetry-store
    kind: SecretStore
  target:
    name: gh-actions-telemetry-users
    creationPolicy: Owner
  data:
    - secretKey: users
      remoteRef:
        key: secret/data/platform/telemetry/gh-actions
        property: htpasswd
