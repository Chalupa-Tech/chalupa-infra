opentelemetry-collector:
  mode: daemonset

  # Contrib image required for spanmetrics connector
  image:
    repository: otel/opentelemetry-collector-contrib

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # Run on all nodes including fw1
  tolerations:
    - operator: Exists

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Disable chart defaults — not needed
      jaeger: null
      zipkin: null
      prometheus: null

    connectors:
      spanmetrics:
        metrics_flush_interval: 15s
        aggregation_cardinality_limit: 500
        resource_metrics_cache_size: 512
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.route
          - name: rpc.method
          - name: rpc.service
        metrics_expiration: 5m

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 200
        spike_limit_mib: 40
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      otlp_http:
        endpoint: http://victoria-traces-vt-single-server.observability.svc.cluster.local:10428/insert/opentelemetry
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://vmsingle-vmstack.observability.svc.cluster.local:8428/api/v1/write
        tls:
          insecure: true
      # Disable chart default
      debug: null

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http, spanmetrics]
        metrics/spanmetrics:
          receivers: [spanmetrics]
          exporters: [prometheusremotewrite]
        # Disable default pipelines
        logs: null
        metrics: null

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      hostPort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      hostPort: 4318
      protocol: TCP
    # Disable default ports we don't need
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
