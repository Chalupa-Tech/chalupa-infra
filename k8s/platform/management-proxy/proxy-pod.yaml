apiVersion: v1
kind: ConfigMap
metadata:
  name: management-proxy-config
  namespace: management-proxy
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        server {
            listen 80;
            resolver kube-dns.kube-system.svc.cluster.local valid=10s;

            # Increase timeout for long-lived connections
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;

            # Support for Large Headers
            proxy_buffer_size   128k;
            proxy_buffers   4 256k;
            proxy_busy_buffers_size   256k;

            # Proxy to Grafana (prefix maintained)
            location /grafana {
                proxy_pass http://observability-grafana.observability.svc.cluster.local;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Proxy to ArgoCD (prefix maintained)
            location /argocd {
                proxy_pass http://argocd-server.argocd.svc.cluster.local;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # WebSocket support for ArgoCD
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            # Proxy to OpenBao (prefix stripped)
            location /openbao/ {
                proxy_pass http://openbao.openbao.svc.cluster.local:8200/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # OpenBao UI assets and API (needed because OpenBao UI doesn't support subpaths)
            location /ui/ {
                proxy_pass http://openbao.openbao.svc.cluster.local:8200/ui/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /v1/ {
                proxy_pass http://openbao.openbao.svc.cluster.local:8200/v1/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Simple redirect for /openbao to /openbao/
            location = /openbao {
                return 301 /openbao/;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-proxy
  namespace: management-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: management-proxy
  template:
    metadata:
      labels:
        app: management-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: management-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: management-proxy
  namespace: management-proxy
spec:
  selector:
    app: management-proxy
  ports:
    - port: 80
      targetPort: 80
