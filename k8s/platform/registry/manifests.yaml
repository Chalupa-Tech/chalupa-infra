apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-registry
  namespace: kube-system
  labels:
    app: private-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: private-registry
  template:
    metadata:
      labels:
        app: private-registry
    spec:
      containers:
      - name: registry
        image: registry:2
        ports:
        - containerPort: 5000
        env:
        - name: REGISTRY_HTTP_TLS_CERTIFICATE
          value: "/certs/tls.crt"
        - name: REGISTRY_HTTP_TLS_KEY
          value: "/certs/tls.key"
        volumeMounts:
        - name: registry-data
          mountPath: /var/lib/registry
        - name: certs
          mountPath: /certs
      volumes:
      - name: registry-data
        hostPath:
          path: /opt/local-path-provisioner/registry
      - name: certs
        hostPath:
          path: /var/lib/chalupa-registry/certs
          type: Directory
      nodeSelector:
        chalupa.tech/registry-host: "true" # Run on any node with this label (e.g. dp1)
---
apiVersion: v1
kind: Service
metadata:
  name: private-registry
  namespace: kube-system
spec:
  selector:
    app: private-registry
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
