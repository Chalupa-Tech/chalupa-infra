{{- if .Values.offsiteCopy.enabled }}
# Daily off-site copy of the fw1 backups to Backblaze B2 (platform phase-94a).
#
# 1. credentials (OpenBao image): log in with this pod's ServiceAccount
#    through Kubernetes auth and write each key to its own file (mode 0600,
#    in-memory volume), never to a command line. The token expires after
#    10 minutes and can read secret/platform/offsite-copy only.
# 2. copy (rclone image): `rclone copy` each MinIO bucket into a crypt
#    remote on B2. Contents and names are encrypted before they leave the
#    pod; the password and salt also live in Ansible Vault, which is how a
#    restore gets them after losing the site.
#
# copy never deletes. The MinIO key can only read the three buckets; the B2
# key can only list and write the one bucket (no read, no delete), and a
# write with an existing name adds a version in B2. Old files expire by a
# B2 lifecycle rule on the bucket, not from here.
#
# Failure is caught by CronJobFailed; a job that stops running at all is
# caught by the off-site clause in BackupsUnhealthy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: offsite-copy
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: offsite-copy
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.offsiteCopy.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.offsiteCopy.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offsite-copy
        spec:
          serviceAccountName: offsite-copy
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: credentials
              image: "quay.io/openbao/openbao:{{ .Values.openbao.server.image.tag }}"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  export BAO_ADDR={{ .Values.snapshot.baoAddr }}
                  BAO_TOKEN=$(bao write -field=token auth/kubernetes/login \
                    role={{ .Values.offsiteCopy.authRole }} \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN
                  umask 077
                  for f in minio_access_key minio_secret_key b2_key_id b2_key crypt_password crypt_salt; do
                    bao kv get -mount=secret -field="$f" {{ .Values.offsiteCopy.keyPath }} > "/creds/$f"
                    test -s "/creds/$f"
                  done
                  echo "credentials: ok"
              env:
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              volumeMounts:
                - name: creds
                  mountPath: /creds
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: copy
              image: {{ .Values.offsiteCopy.rcloneImage | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Remotes come from the environment; no config file is written.
                  export RCLONE_CONFIG_MINIO_TYPE=s3
                  export RCLONE_CONFIG_MINIO_PROVIDER=Minio
                  export RCLONE_CONFIG_MINIO_ENDPOINT={{ .Values.offsiteCopy.minioEndpoint | quote }}
                  RCLONE_CONFIG_MINIO_ACCESS_KEY_ID=$(cat /creds/minio_access_key)
                  RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY=$(cat /creds/minio_secret_key)
                  export RCLONE_CONFIG_MINIO_ACCESS_KEY_ID RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY
                  export RCLONE_CONFIG_B2_TYPE=b2
                  RCLONE_CONFIG_B2_ACCOUNT=$(cat /creds/b2_key_id)
                  RCLONE_CONFIG_B2_KEY=$(cat /creds/b2_key)
                  export RCLONE_CONFIG_B2_ACCOUNT RCLONE_CONFIG_B2_KEY
                  export RCLONE_CONFIG_OFFSITE_TYPE=crypt
                  export RCLONE_CONFIG_OFFSITE_REMOTE={{ printf "b2:%s" .Values.offsiteCopy.b2Bucket | quote }}
                  # obscure reads the first line of stdin (rclone docs).
                  RCLONE_CONFIG_OFFSITE_PASSWORD=$(rclone obscure - < /creds/crypt_password)
                  RCLONE_CONFIG_OFFSITE_PASSWORD2=$(rclone obscure - < /creds/crypt_salt)
                  export RCLONE_CONFIG_OFFSITE_PASSWORD RCLONE_CONFIG_OFFSITE_PASSWORD2
                  rc=0
                  {{- range .Values.offsiteCopy.buckets }}
                  echo "== {{ .name }}"
                  rclone copy "minio:{{ .name }}" "offsite:{{ .name }}" \
                    --max-duration {{ .maxDuration }} \
                    --transfers 2 --b2-upload-concurrency 2 --b2-chunk-size 32M \
                    --stats 10m --stats-one-line -v || rc=1
                  {{- end }}
                  exit "$rc"
              env:
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: RCLONE_CACHE_DIR
                  value: /tmp/rclone-cache
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: creds
                  mountPath: /creds
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: creds
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
{{- end }}
