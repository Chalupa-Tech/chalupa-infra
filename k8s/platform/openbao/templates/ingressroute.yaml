apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: openbao
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pi-k3s-tls
  namespace: openbao
spec:
  secretName: pi-k3s-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - pi-k3s.chalupatech.com
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openbao-strip-prefix
  namespace: openbao
spec:
  stripPrefix:
    prefixes:
      - /openbao
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pi-k3s.chalupatech.com`) && PathPrefix(`/openbao`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: openbao-active
          port: 8200
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openbao-tls
  namespace: openbao
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pi-k3s.chalupatech.com`) && PathPrefix(`/openbao`)
      kind: Rule
      middlewares:
        - name: openbao-strip-prefix
      services:
        - name: openbao-active
          port: 8200
  tls:
    secretName: pi-k3s-tls
