openbao:
  server:
    ha:
      enabled: true
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          api_addr = "http://HOSTNAME.openbao-internal:8200"
          cluster_addr = "http://HOSTNAME.openbao-internal:8201"
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://openbao-0.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-1.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-2.openbao-internal:8200"
            }
          }
          service_registration "kubernetes" {}
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: openbao
            component: server
    affinity: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - openbao
              topologyKey: kubernetes.io/hostname
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: local-path
    ui:
      enabled: true
    image:
      tag: "2.3.1"

# Daily Raft snapshot to MinIO on fw1 (platform phase-94). The policy,
# Kubernetes auth role and MinIO key are set by the openbao_setup Ansible
# role (tasks/snapshot_setup.yml); MinIO expires objects after 14 days.
snapshot:
  enabled: true
  schedule: "30 3 * * *"
  baoAddr: http://openbao-active.openbao.svc:8200
  authRole: openbao-snapshot-role
  minioKeyPath: platform/openbao-snapshot/minio
  s3Endpoint: http://192.168.2.51:9000
  bucket: openbao-snapshots
  curlImage: curlimages/curl:8.11.1
