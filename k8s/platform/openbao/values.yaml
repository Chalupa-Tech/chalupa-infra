openbao:
  server:
    ha:
      enabled: true
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          api_addr = "http://HOSTNAME.openbao-internal:8200"
          cluster_addr = "http://HOSTNAME.openbao-internal:8201"
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/openbao/data"
            retry_join {
              leader_api_addr = "http://openbao-0.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-1.openbao-internal:8200"
            }
            retry_join {
              leader_api_addr = "http://openbao-2.openbao-internal:8200"
            }
          }
          service_registration "kubernetes" {}
    replicas: 3
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: openbao
            component: server
    affinity: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - openbao
              topologyKey: kubernetes.io/hostname
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: local-path
    ui:
      enabled: true
    image:
      tag: "2.3.1"

# Daily Raft snapshot to MinIO on fw1 (platform phase-94). The policy,
# Kubernetes auth role and MinIO key are set by the openbao_setup Ansible
# role (tasks/snapshot_setup.yml); MinIO expires objects after 14 days.
snapshot:
  enabled: true
  schedule: "30 3 * * *"
  baoAddr: http://openbao-active.openbao.svc:8200
  authRole: openbao-snapshot-role
  minioKeyPath: platform/openbao-snapshot/minio
  s3Endpoint: http://192.168.2.51:9000
  bucket: openbao-snapshots
  curlImage: curlimages/curl:8.11.1

# Daily copy of the three fw1 backup buckets to Backblaze B2, encrypted
# with rclone crypt (platform phase-94a). Runs after all three backups:
# etcd 00:00/12:00, OpenBao 03:30, the database base backup 04:00.
offsiteCopy:
  enabled: true
  schedule: "30 5 * * *"
  authRole: offsite-copy-role
  # OpenBao KV path (mount "secret") holding minio_access_key,
  # minio_secret_key, b2_key_id, b2_key, crypt_password, crypt_salt.
  keyPath: platform/offsite-copy
  minioEndpoint: http://192.168.2.51:9000
  # Private B2 bucket; 30-day hide + 7-day delete lifecycle rule set on it.
  b2Bucket: chalupa-offsite-27c70e32
  rcloneImage: rclone/rclone:1.76.0
  # Small, most important first. A copy cut short by --max-duration fails
  # the job and resumes where it stopped on the next run.
  buckets:
    - name: openbao-snapshots
      maxDuration: 30m
    - name: etcd-snapshots
      maxDuration: 1h
    - name: cnpg-backups
      maxDuration: 4h
  activeDeadlineSeconds: 21600
