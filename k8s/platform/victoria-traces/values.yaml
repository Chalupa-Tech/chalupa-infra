victoria-traces-single:
  server:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi

    # Aggressive retention — time AND disk capped (whichever triggers first)
    retentionPeriod: 3d
    retentionDiskSpaceUsage: 5GiB

    persistentVolume:
      enabled: true
      size: 8Gi
      # Must match the live StatefulSet: volumeClaimTemplates is immutable,
      # and a different class here (longhorn-single, 2026-04 to 2026-11)
      # makes every ArgoCD diff fail, so the app never syncs. Changing the
      # class means recreating the StatefulSet with --cascade=orphan.
      storageClassName: longhorn

    # Stateful: keep the pod and its Longhorn volume in site-dpi, never on tpi1.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [site-dpi]
                - key: compute-class
                  operator: In
                  values: [pi5]

    extraArgs:
      envflag.enable: true
      envflag.prefix: VM_
      loggerFormat: json
