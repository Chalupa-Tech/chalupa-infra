longhorn:
  # -- Disable pre-install/pre-upgrade hooks (incompatible with ArgoCD)
  preUpgradeChecker:
    jobEnabled: false

  # -- Global settings
  defaultSettings:
    # Storage reservation: 25% of 234G NVMe (~58G) for OS/K3s/images (actual usage ~15G)
    storageOverProvisioningPercentage: 100
    storageMinimalAvailablePercentage: 25
    # 2 replicas within same site (intra-site HA, avoids cross-site MTU issues)
    defaultReplicaCount: 2
    # Allow replicas on same zone (keep storage traffic intra-site)
    replicaZoneSoftAntiAffinity: false
    # Only schedule on Pi nodes
    systemManagedComponentsNodeSelector: "compute-class:pi5"
    # Guaranteed engine manager CPU (prevents starvation on Pi)
    guaranteedInstanceManagerCPU: 5
    # Prefer replica on same node as workload (reduces network attach latency)
    defaultDataLocality: best-effort
    # Proactively delete pods on failed nodes (bypasses K8s 5-min eviction wait)
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

  persistence:
    # local-path is the default StorageClass — Longhorn must be explicitly requested
    defaultClass: false
    defaultClassReplicaCount: 2

  # -- Component scheduling: Pi nodes only (exclude fw1 and future oracle1)
  longhornManager:
    nodeSelector:
      compute-class: pi5
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  longhornDriver:
    nodeSelector:
      compute-class: pi5

  longhornUI:
    replicas: 1
    nodeSelector:
      compute-class: pi5

  # -- Ingress (disabled — access via kubectl port-forward if needed)
  ingress:
    enabled: false
