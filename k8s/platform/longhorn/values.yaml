longhorn:
  # -- Disable pre-install/pre-upgrade hooks (incompatible with ArgoCD)
  preUpgradeChecker:
    jobEnabled: false

  # -- Global settings
  defaultSettings:
    # Storage reservation: 25% of 234G NVMe (~58G) for OS/K3s/images (actual usage ~15G)
    storageOverProvisioningPercentage: 100
    storageMinimalAvailablePercentage: 25
    # 2 replicas within same site (intra-site HA, avoids cross-site MTU issues)
    defaultReplicaCount: 2
    # Soft zone anti-affinity: both replicas may sit in one zone (site-dpi).
    # Hard (false) forced one replica of every 2-replica volume onto tpi1, the only
    # storage node in site-tpi, so every write crossed sites (2026-11-17 incident).
    # tpi1 also has Longhorn scheduling disabled (node CR, not in git).
    replicaZoneSoftAntiAffinity: true
    # Only schedule on Pi nodes
    systemManagedComponentsNodeSelector: "compute-class:pi5"
    # Guaranteed engine manager CPU (prevents starvation on Pi)
    guaranteedInstanceManagerCPU: 5
    # Prefer replica on same node as workload (reduces network attach latency)
    defaultDataLocality: best-effort
    # Proactively delete pods on failed nodes (bypasses K8s 5-min eviction wait)
    nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod

  persistence:
    # local-path is the default StorageClass — Longhorn must be explicitly requested
    defaultClass: false
    defaultClassReplicaCount: 2

  # -- Component scheduling: Pi nodes only (exclude fw1 and future oracle1)
  longhornManager:
    nodeSelector:
      compute-class: pi5
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 512Mi

  longhornDriver:
    nodeSelector:
      compute-class: pi5

  longhornUI:
    replicas: 1
    nodeSelector:
      compute-class: pi5
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  # -- Ingress (disabled — access via kubectl port-forward if needed)
  ingress:
    enabled: false
