apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ "{{ .access_key }}" }}
          aws_secret_access_key={{ "{{ .secret_key }}" }}
  data:
    - secretKey: access_key
      remoteRef:
        key: secret/data/velero/minio
        property: access_key
    - secretKey: secret_key
      remoteRef:
        key: secret/data/velero/minio
        property: secret_key
