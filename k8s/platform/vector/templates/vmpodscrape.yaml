# Scrape Vector's prometheus_exporter sink on every agent pod
# (platform phase-95). It carries Vector's own internal metrics plus two
# counters derived from the log stream in values.yaml:
#   vector_pod_log_lines_total{log_namespace, log_container}
#   vector_longhorn_csi_format_failures_total{volume}
# The pod's node is added as `node`, so a per-node log flood names the
# node it is on.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: vector
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
      app.kubernetes.io/component: Agent
  podMetricsEndpoints:
    - port: prom-exporter
      path: /metrics
      interval: 30s
      relabelConfigs:
        - action: replace
          source_labels: [__meta_kubernetes_pod_node_name]
          target_label: node
      metricRelabelConfigs:
        # Allowlist: the two log-derived counters plus Vector's per-component
        # throughput, error and buffer counters. Everything else, including
        # histograms and any internal metric carrying per-pod or per-file
        # tags, is dropped, so pod churn cannot grow the series count.
        - action: keep
          source_labels: [__name__]
          regex: vector_(pod_log_lines_total|longhorn_csi_format_failures_total|component_(received|sent|discarded)_events_total|component_errors_total|buffer_(events|byte_size))
