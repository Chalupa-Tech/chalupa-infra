vector:
  role: Agent

  # Agent mode (DaemonSet) has no ports to expose
  service:
    enabled: false
  serviceHeadless:
    enabled: false

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      # Platform phase-96: normal use is about 0.005 cores. Measured
      # 2026-11-22: a 10k lines/s flood costs about 65us/line (0.65 cores
      # averaged, about 2 cores while draining) even with the throttle
      # ahead of remap_logs, because the source and the counters see every
      # line. The limit makes the 0.5-core bound real: a flood drains more
      # slowly (the lines stay in the node's log files) while the throttle
      # still caps what ships.
      cpu: 500m
      memory: 256Mi

  customConfig:
    data_dir: /vector-data-dir

    api:
      enabled: false

    sources:
      kubernetes_logs:
        type: kubernetes_logs

      # Vector's own metrics (events in/out, errors, buffers), exposed by
      # the prom_exporter sink below (platform phase-95).
      internal_metrics:
        type: internal_metrics
        scrape_interval_secs: 15

    transforms:
      # Platform phase-96: the cheap early stages. Everything that must see
      # every line (the counters, the CSI filter) taps drop_self using only
      # .kubernetes.* fields; the expensive parsing in remap_logs runs only
      # on what the throttle lets through. Measured 2026-11-22: with the
      # throttle after remap_logs a 10k lines/s burst cost Vector about
      # 88us per line (roughly 2 cores for 11s), because every dropped line
      # was still parsed first.
      drop_self:
        type: remap
        inputs:
          - kubernetes_logs
        source: |
          if .kubernetes.container_name == "vector" {
            abort
          }
          # The throttle key; kept short because toYaml folds long lines
          # inside Helm's template string. remap_logs deletes it.
          .tk = (string(.kubernetes.pod_namespace) ?? "") + "/" +
            (string(.kubernetes.pod_name) ?? "") + "/" +
            (string(.kubernetes.container_name) ?? "")

      # One pod/container cannot cost more than 200 events/s on the way to
      # VictoriaLogs (2026-11-17: one longhorn-manager stream produced
      # 3.98M lines in 30 minutes). Drops are counted in
      # component_discarded_events_total{component_id="throttle_logs"}
      # (no per-pod tag, so internal_metrics_kept keeps it).
      throttle_logs:
        type: throttle
        inputs:
          - drop_self
        key_field: '{{ "{{ tk }}" }}'
        threshold: 200
        window_secs: 1

      remap_logs:
        type: remap
        inputs:
          - throttle_logs
        source: |
          del(.tk)
          .pod = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name

          # Extract log level from various formats
          .level = "unknown"

          # Try JSON first (Go services: {"level":"INFO","msg":"..."})
          parsed, err = parse_json(.message)
          if err == null {
            .level = downcase(string(parsed.level) ?? "unknown")
            .service = string(parsed.service) ?? ""
            .error_msg = string(parsed.error) ?? ""
            .caller = string(parsed.caller) ?? ""
            .component = string(parsed.component) ?? ""
            .trace_id = string(parsed.trace_id) ?? ""
            .span_id = string(parsed.span_id) ?? ""
            inner_msg = string(parsed.msg) ?? ""
            if inner_msg != "" {
              .message = inner_msg
            }
          }

          # logfmt fallback (ArgoCD: level=info msg="...")
          if .level == "unknown" {
            level_logfmt, err = parse_regex(.message, r'level=(?P<level>\w+)')
            if err == null {
              .level = downcase(string(level_logfmt.level) ?? "unknown")
            }
          }

          # klog fallback (kube-system: I0330, E0330, W0330, F0330)
          if .level == "unknown" {
            klog_match, err = parse_regex(.message, r'^(?P<level>[IWEF])\d{4}\s')
            if err == null {
              klog_char = string(klog_match.level) ?? ""
              .level = if klog_char == "I" {
                "info"
              } else if klog_char == "W" {
                "warn"
              } else if klog_char == "E" {
                "error"
              } else {
                "fatal"
              }
            }
          }

          # Bracket fallback (CoreDNS: [WARNING], [INFO])
          if .level == "unknown" {
            bracket_match, err = parse_regex(.message, r'\[(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL|PANIC)\]')
            if err == null {
              lvl = downcase(string(bracket_match.level) ?? "unknown")
              .level = if lvl == "warning" { "warn" } else { lvl }
            }
          }

      filter_noise:
        type: filter
        inputs:
          - remap_logs
        condition: |
          # Drop kubelet/kube-proxy health check probes
          !match(string(.message) ?? "", r'(healthz|readyz|livez)\s*\b') &&
          # Drop Vector's own internal logs
          .container != "vector"

      # Platform phase-95: log lines per namespace/container, the signal
      # that would have caught the 2026-11-17 longhorn-manager replay loop
      # (3.98M lines in 30 minutes) directly. Phase-96 moved it ahead of the
      # throttle so it counts every line a container writes, not only what is
      # shipped; it now also counts probe lines that filter_noise drops. The
      # tags are Vector templates; `{{ "{{ x }}" }}` keeps Helm's tpl pass
      # from evaluating them.
      log_line_counts:
        type: log_to_metric
        inputs:
          - drop_self
        metrics:
          - type: counter
            field: message
            namespace: vector
            name: pod_log_lines_total
            tags:
              log_namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
              log_container: '{{ "{{ kubernetes.container_name }}" }}'

      # Platform phase-96: one line per flooding pod/container per minute, so
      # a throttled flood is visible in VictoriaLogs rather than silent.
      # Vector 0.54's throttle cannot reroute what it drops, so lines are
      # counted per pod before the throttle (not exported: it has a pod tag)
      # and a summary is emitted when a stream averaged above the cap
      # (200/s * 60s) over the minute. The exact drop count is
      # component_discarded_events_total{component_id="throttle_logs"}.
      flood_counts:
        type: log_to_metric
        inputs:
          - drop_self
        metrics:
          - type: counter
            field: message
            namespace: vector
            name: flood_pod_lines
            tags:
              log_namespace: '{{ "{{ kubernetes.pod_namespace }}" }}'
              log_pod: '{{ "{{ kubernetes.pod_name }}" }}'
              log_container: '{{ "{{ kubernetes.container_name }}" }}'

      flood_minute:
        type: aggregate
        inputs:
          - flood_counts
        interval_ms: 60000
        mode: Sum

      flood_minute_logs:
        type: metric_to_log
        inputs:
          - flood_minute

      flood_over_cap:
        type: filter
        inputs:
          - flood_minute_logs
        condition: (float(.counter.value) ?? 0.0) > 12000.0

      flood_summary_line:
        type: remap
        inputs:
          - flood_over_cap
        source: |
          n = to_int!(.counter.value)
          . = {
            "timestamp": now(),
            "namespace": .tags.log_namespace,
            "pod": .tags.log_pod,
            "container": .tags.log_container,
            "node": get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown",
            "level": "warn",
            "throttled": true,
            "lines": n,
            "message": "log flood: " + to_string(n) +
              " lines in the last minute from this pod and container;" +
              " anything above 200/s is dropped before VictoriaLogs"
          }

      # Platform phase-95: mount-utils logs "format of disk" only when mkfs
      # fails, and the phase-97 mkfs guard's refusal is part of that line.
      # Neither has a legitimate cause, so every such line is counted.
      # Phase-96: reads drop_self (before the throttle) so a flood cannot
      # hide a format failure; the raw message holds whatever remap_logs
      # would have copied into error_msg.
      csi_format_failures:
        type: filter
        inputs:
          - drop_self
        condition: |
          .kubernetes.container_name == "longhorn-csi-plugin" && contains(string(.message) ?? "", "format of disk")

      csi_format_failure_volume:
        type: remap
        inputs:
          - csi_format_failures
        source: |
          m, err = parse_regex(string(.message) ?? "", r'/dev/longhorn/(?P<volume>pvc-[0-9a-f-]+)')
          .volume = if err == null { string(m.volume) ?? "unknown" } else { "unknown" }

      csi_format_failure_counts:
        type: log_to_metric
        inputs:
          - csi_format_failure_volume
        metrics:
          - type: counter
            field: message
            namespace: vector
            name: longhorn_csi_format_failures_total
            tags:
              volume: '{{ "{{ volume }}" }}'

      # buffer_discarded_events_total is where the victorialogs sink's
      # drop_newest buffer counts what it drops (component_discarded_events_total
      # does not; platform phase-96a).
      # Only these internal metrics reach the exporter, which holds every
      # series it receives for flush_period_secs; filtering here bounds
      # Vector's own memory, not just what is scraped. kubernetes_logs tags
      # its received-events counter with pod_name and pod_namespace (one
      # series per pod, so it grows with pod churn); those series are
      # dropped, and vector_pod_log_lines_total gives the per-container view.
      internal_metrics_kept:
        type: filter
        inputs:
          - internal_metrics
        condition: |
          includes(["component_received_events_total", "component_sent_events_total", "component_discarded_events_total", "component_errors_total", "buffer_events", "buffer_byte_size", "buffer_discarded_events_total"], .name) && !exists(.tags.pod_name)

    sinks:
      # Scraped by templates/vmpodscrape.yaml. The chart derives the
      # container port (named prom-exporter) from this address.
      # flush_period_secs: a counter not updated for this long is expired;
      # an hour keeps quiet containers' counters from resetting between
      # lines.
      prom_exporter:
        type: prometheus_exporter
        inputs:
          - internal_metrics_kept
          - log_line_counts
          - csi_format_failure_counts
        address: 0.0.0.0:9598
        flush_period_secs: 3600

      victorialogs:
        type: elasticsearch
        inputs:
          - filter_noise
          - flood_summary_line
        # Platform phase-96: bounded memory buffer that drops instead of
        # blocking. 2026-11-17: a stalled VictoriaLogs volume left vector-8bnbc
        # OOMKilled (256Mi) twice. Blocking would also stall the shared
        # source and with it the line counters the flood alert reads.
        buffer:
          type: memory
          max_events: 1000
          when_full: drop_newest
        endpoints:
          - "http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/elasticsearch/"
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: "pod,namespace,container,node,level"
        request:
          concurrency: 1
          # Platform phase-96a: the default retries a failed request for ever,
          # and this sink's retry sits outside its concurrency limit, so while
          # VictoriaLogs is unreachable every retrying request keeps its batch
          # and a new batch starts beside it. tpi1's Vector was OOMKilled 8
          # times while its DNS lookups failed (2026-11-24/25). Scratch pod with this
          # config, 10k lines/s, sink refusing connections (2026-11-26):
          # without the bound, 47Mi to OOMKilled at 256Mi in 38 minutes; with
          # it, flat at about 77Mi. A request is dropped after 5 failed tries
          # (about 30s when refused, about 5 minutes when the sink hangs) and
          # counted in component_discarded_events_total{component_id="victorialogs"}.
          retry_attempts: 5
