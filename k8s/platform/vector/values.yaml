vector:
  role: Agent

  # Agent mode (DaemonSet) has no ports to expose
  service:
    enabled: false
  serviceHeadless:
    enabled: false

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

  customConfig:
    data_dir: /vector-data-dir

    api:
      enabled: false

    sources:
      kubernetes_logs:
        type: kubernetes_logs

      # Vector's own metrics (events in/out, errors, buffers), exposed by
      # the prom_exporter sink below (platform phase-95).
      internal_metrics:
        type: internal_metrics
        scrape_interval_secs: 15

    transforms:
      remap_logs:
        type: remap
        inputs:
          - kubernetes_logs
        source: |
          .pod = .kubernetes.pod_name
          .namespace = .kubernetes.pod_namespace
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name

          # Extract log level from various formats
          .level = "unknown"

          # Try JSON first (Go services: {"level":"INFO","msg":"..."})
          parsed, err = parse_json(.message)
          if err == null {
            .level = downcase(string(parsed.level) ?? "unknown")
            .service = string(parsed.service) ?? ""
            .error_msg = string(parsed.error) ?? ""
            .caller = string(parsed.caller) ?? ""
            .component = string(parsed.component) ?? ""
            .trace_id = string(parsed.trace_id) ?? ""
            .span_id = string(parsed.span_id) ?? ""
            inner_msg = string(parsed.msg) ?? ""
            if inner_msg != "" {
              .message = inner_msg
            }
          }

          # logfmt fallback (ArgoCD: level=info msg="...")
          if .level == "unknown" {
            level_logfmt, err = parse_regex(.message, r'level=(?P<level>\w+)')
            if err == null {
              .level = downcase(string(level_logfmt.level) ?? "unknown")
            }
          }

          # klog fallback (kube-system: I0330, E0330, W0330, F0330)
          if .level == "unknown" {
            klog_match, err = parse_regex(.message, r'^(?P<level>[IWEF])\d{4}\s')
            if err == null {
              klog_char = string(klog_match.level) ?? ""
              .level = if klog_char == "I" {
                "info"
              } else if klog_char == "W" {
                "warn"
              } else if klog_char == "E" {
                "error"
              } else {
                "fatal"
              }
            }
          }

          # Bracket fallback (CoreDNS: [WARNING], [INFO])
          if .level == "unknown" {
            bracket_match, err = parse_regex(.message, r'\[(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL|PANIC)\]')
            if err == null {
              lvl = downcase(string(bracket_match.level) ?? "unknown")
              .level = if lvl == "warning" { "warn" } else { lvl }
            }
          }

      filter_noise:
        type: filter
        inputs:
          - remap_logs
        condition: |
          # Drop kubelet/kube-proxy health check probes
          !match(string(.message) ?? "", r'(healthz|readyz|livez)\s*\b') &&
          # Drop Vector's own internal logs
          .container != "vector"

      # Platform phase-96: one pod/container cannot cost more than
      # 200 events/s on the way to VictoriaLogs (2026-11-17: one
      # longhorn-manager stream produced 3.98M lines in 30 minutes). Only
      # the victorialogs sink reads this; log_line_counts and the CSI
      # counters read filter_noise/remap_logs directly, so
      # vector_pod_log_lines_total still counts every line and
      # LonghornManagerLogFlood can still fire. Drops are counted in
      # component_discarded_events_total{component_id="throttle_logs"}
      # (no per-pod tag, so internal_metrics_kept keeps it).
      throttle_logs:
        type: throttle
        inputs:
          - filter_noise
        key_field: '{{ "{{ namespace }}/{{ pod }}/{{ container }}" }}'
        threshold: 200
        window_secs: 1

      # One line per flooding pod/container per minute, so a throttled
      # flood is visible in VictoriaLogs rather than silent. Vector 0.54's
      # throttle cannot reroute what it drops, so lines are counted per key
      # before the throttle and a summary is emitted when a stream averaged
      # above the cap (200/s * 60s) for the minute. The exact drop count is
      # component_discarded_events_total{component_id="throttle_logs"}.
      flood_marker:
        type: remap
        inputs:
          - filter_noise
        source: |
          . = {
            "namespace": .namespace,
            "pod": .pod,
            "container": .container,
            "node": .node,
            "lines": 1
          }

      flood_minute:
        type: reduce
        inputs:
          - flood_marker
        group_by:
          - namespace
          - pod
          - container
        end_every_period_ms: 60000
        merge_strategies:
          lines: sum

      flood_over_cap:
        type: filter
        inputs:
          - flood_minute
        condition: (int(.lines) ?? 0) > 12000

      flood_summary_line:
        type: remap
        inputs:
          - flood_over_cap
        source: |
          .timestamp = now()
          .level = "warn"
          .throttled = true
          .message = "log flood: " + to_string!(.lines) +
            " lines in the last minute from this pod and container;" +
            " anything above 200/s is dropped before VictoriaLogs"

      # Platform phase-95: log lines per namespace/container, the signal
      # that would have caught the 2026-11-17 longhorn-manager replay loop
      # (3.98M lines in 30 minutes) directly. Counts what is shipped to
      # VictoriaLogs (after filter_noise). The tags are Vector templates;
      # `{{ "{{ x }}" }}` keeps Helm's tpl pass from evaluating them.
      log_line_counts:
        type: log_to_metric
        inputs:
          - filter_noise
        metrics:
          - type: counter
            field: message
            namespace: vector
            name: pod_log_lines_total
            tags:
              log_namespace: '{{ "{{ namespace }}" }}'
              log_container: '{{ "{{ container }}" }}'

      # Platform phase-95: mount-utils logs "format of disk" only when mkfs
      # fails, and the phase-97 mkfs guard's refusal is part of that line.
      # Neither has a legitimate cause, so every such line is counted.
      csi_format_failures:
        type: filter
        inputs:
          - remap_logs
        condition: |
          .container == "longhorn-csi-plugin" && (contains(string(.message) ?? "", "format of disk") || contains(string(.error_msg) ?? "", "format of disk"))

      csi_format_failure_volume:
        type: remap
        inputs:
          - csi_format_failures
        source: |
          m, err = parse_regex((string(.message) ?? "") + " " + (string(.error_msg) ?? ""), r'/dev/longhorn/(?P<volume>pvc-[0-9a-f-]+)')
          .volume = if err == null { string(m.volume) ?? "unknown" } else { "unknown" }

      csi_format_failure_counts:
        type: log_to_metric
        inputs:
          - csi_format_failure_volume
        metrics:
          - type: counter
            field: message
            namespace: vector
            name: longhorn_csi_format_failures_total
            tags:
              volume: '{{ "{{ volume }}" }}'

      # Only these internal metrics reach the exporter, which holds every
      # series it receives for flush_period_secs; filtering here bounds
      # Vector's own memory, not just what is scraped. kubernetes_logs tags
      # its received-events counter with pod_name and pod_namespace (one
      # series per pod, so it grows with pod churn); those series are
      # dropped, and vector_pod_log_lines_total gives the per-container view.
      internal_metrics_kept:
        type: filter
        inputs:
          - internal_metrics
        condition: |
          includes(["component_received_events_total", "component_sent_events_total", "component_discarded_events_total", "component_errors_total", "buffer_events", "buffer_byte_size"], .name) && !exists(.tags.pod_name)

    sinks:
      # Scraped by templates/vmpodscrape.yaml. The chart derives the
      # container port (named prom-exporter) from this address.
      # flush_period_secs: a counter not updated for this long is expired;
      # an hour keeps quiet containers' counters from resetting between
      # lines.
      prom_exporter:
        type: prometheus_exporter
        inputs:
          - internal_metrics_kept
          - log_line_counts
          - csi_format_failure_counts
        address: 0.0.0.0:9598
        flush_period_secs: 3600

      victorialogs:
        type: elasticsearch
        inputs:
          - throttle_logs
          - flood_summary_line
        # Platform phase-96: bounded memory buffer that drops instead of
        # blocking. 2026-11-17: a stalled VictoriaLogs volume left vector-8bnbc
        # OOMKilled (256Mi) twice. Blocking would also stall the shared
        # source and with it the line counters the flood alert reads.
        buffer:
          type: memory
          max_events: 1000
          when_full: drop_newest
        endpoints:
          - "http://victoria-logs-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/elasticsearch/"
        mode: bulk
        api_version: v8
        compression: gzip
        healthcheck:
          enabled: false
        query:
          _msg_field: message
          _time_field: timestamp
          _stream_fields: "pod,namespace,container,node,level"
        request:
          concurrency: 1
