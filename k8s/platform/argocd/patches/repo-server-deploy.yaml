apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          env:
            # Default 90s is too tight for Helm template on ARM64
            - name: ARGOCD_EXEC_TIMEOUT
              value: "300s"
          # Liveness: basic check only ("is the process alive?")
          # The default ?full=true blocks on Redis + git, killing the pod
          # when either is slow — wrong behavior for a liveness probe.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness: full check ("can it serve requests?")
          readinessProbe:
            httpGet:
              path: /healthz?full=true
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
