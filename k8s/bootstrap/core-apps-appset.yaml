# Core Platform ApplicationSet
#
# This manifest is the single source of truth for platform services.
# Adding a new service is a one-step process: add an entry to the list
# below and merge to main. ArgoCD detects the change and deploys
# automatically — no scripts, no manual apply, no intervention.
#
# The repo URL is intentionally hardcoded rather than templated so that
# ArgoCD can self-heal this manifest like any other resource. A templated
# placeholder (e.g. {{REPO_URL}}) would require out-of-band script
# execution after every change, breaking the GitOps contract.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-apps
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: longhorn
            path: k8s/platform/longhorn
            namespace: longhorn-system
          - name: cert-manager
            path: k8s/platform/cert-manager
            namespace: cert-manager
          - name: external-secrets
            path: k8s/platform/external-secrets
            namespace: external-secrets
          - name: observability
            path: k8s/platform/observability
            namespace: observability
          - name: openbao
            path: k8s/platform/openbao
            namespace: openbao
          - name: external-dns
            path: k8s/platform/external-dns
            namespace: external-dns
          - name: argocd-ingress
            path: k8s/platform/argocd-ingress
            namespace: argocd
          - name: nats
            path: k8s/platform/nats
            namespace: nats
          - name: victoria-logs
            path: k8s/platform/victoria-logs
            namespace: observability
          - name: vector
            path: k8s/platform/vector
            namespace: observability
          - name: victoria-traces
            path: k8s/platform/victoria-traces
            namespace: observability
          - name: otel-collector
            path: k8s/platform/otel-collector
            namespace: observability
          - name: telemetry-mesh
            path: k8s/apps/telemetry-mesh
            namespace: telemetry-mesh
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/Chalupa-Tech/chalupa-infra.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      ignoreDifferences:
        # Longhorn (and other operators) inject runtime fields into CRDs:
        # caBundle, conversion webhook namespace, version schemas.
        # Use jqPathExpressions for flexible matching across nested fields.
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jqPathExpressions:
            - .spec.conversion
            - .spec.versions
            - .spec.preserveUnknownFields
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
